# GroundedOps — full stack, for real deployment (NOT local dev — use
# run.cmd/run.ps1 at the repo root for that). Bring up with, from this
# directory:  docker compose up -d --build
# Then open http://localhost:8080   (widget API on http://localhost:8000)
services:
  backend:
    build:
      context: ../src
      dockerfile: ../docker/Dockerfile.backend
    environment:
      # Online by default; set to "local" for fully offline (needs Ollama below).
      GENERATION_MODE: ${GENERATION_MODE:-api}
      ONLINE_PROVIDER: ${ONLINE_PROVIDER:-deepseek}
      OLLAMA_URL: http://ollama:11434/api/generate
      CHROMA_DIR: /data/chroma_db
      # v3.0.0: keep the conversation SQLite db on the persistent volume.
      # It defaulted to ./conversations.db — i.e. /app inside the image —
      # so in a production run (no source bind-mount) every rebuild
      # silently discarded all saved conversations.
      CONVO_DB_PATH: /data/conversations.db
      CORPUS_DIR: /app/corpus
      # v3.0.0: CORS origins for the embeddable widget. Comma-separated.
      # "*" is a DEV default — set your real site origins in .env before
      # exposing this publicly, e.g.
      #   WIDGET_ALLOWED_ORIGINS=https://acme.com,https://docs.acme.com
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-*}

      # ── Admin accounts (replaced ADMIN_PASSWORD) ────────────────────
      # Signs admin session tokens. NO DEFAULT ON PURPOSE: if this is unset
      # the console refuses every sign-in, which is a loud, obvious failure.
      # A default would silently make every deployment share one signing
      # key, so any token minted anywhere would be valid here.
      #   openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in docker/.env}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      # Empty = the admin console is LAN-only, as it has always been. Set to
      # a comma-separated list of IP prefixes to reach it from outside, e.g.
      #   ADMIN_ALLOWED_IPS=203.0.113.,198.51.100.42
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      # Needed ONCE to create the first root account over the network. Leave
      # empty and create it on the box instead:
      #   docker compose exec backend python manage_accounts.py create \
      #       you@company.com --level root
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}

      # ── Behind a reverse proxy ──────────────────────────────────────
      # Honour X-Forwarded-For so per-IP quotas and ADMIN_ALLOWED_IPS see
      # the real caller. Only set this when a proxy you control is in front
      # — otherwise a client can forge the header and mint unlimited
      # anonymous identities.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # TLS terminates at the proxy, so ask browsers to stay on HTTPS.
      ENABLE_HSTS: ${ENABLE_HSTS:-1}

      # ── Widget token shared with the WordPress plugin ───────────────
      # Must match GROUNDEDOPS_SECRET in wp-config.php. Use a DIFFERENT
      # value on staging than production.
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:-}
      WIDGET_SIGN_IN_URL: ${WIDGET_SIGN_IN_URL:-}

      # ── Runtime state, all on the persistent volume ─────────────────
      # These default to the working directory, i.e. /app INSIDE the image,
      # so without these lines every rebuild silently discarded them. Same
      # bug the CONVO_DB_PATH comment above describes. accounts.json is the
      # one that really matters: it is NOT regenerable, and losing it loses
      # every account. widget_leads.json holds customer enquiries.
      ACCOUNTS_PATH: /data/accounts.json
      POLICY_PATH: /data/policy.json
      QUOTA_DB_PATH: /data/quota.db
      FAQ_STORE_PATH: /data/faq_store.json
      FAQ_GAP_PATH: /data/faq_gaps.json
      CATALOG_CONFIG: /data/catalog_config.json
      WIDGET_CONFIG_PATH: /data/widget_config.json
      WIDGET_LEADS_PATH: /data/widget_leads.json
      INGEST_STAMP_PATH: /data/ingest_stamp.txt
      # The document store (docstore.py). Bind-mounted below so the
      # originals live on the host and survive the container entirely.
      SOURCE_FILE_DIR: /data/documents

      # Widget traffic can't supply a key from the browser, so an env key
      # is required for Online mode when serving the widget. These can also
      # be pasted in at runtime from the console's API keys page (root only).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # v3.0.0: the backend now needs a reachable origin, because the
      # widget runs on a THIRD-PARTY site and calls /query directly from
      # the visitor's browser — it can't reach the compose-internal
      # network the way the bundled frontend can.
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Everything stateful: chroma_db, conversations.db, accounts.json,
      # policy.json, quota.db, the FAQ/catalog/widget stores and leads.
      - grounded-data:/data
      - ../corpus:/app/corpus:ro     # OPTIONAL: drop PDFs here to ingest
      # The document store. Read-write: the console writes uploads here, and
      # this is the ONLY copy of some source PDFs — see PENDING.md. Bind-
      # mounted rather than left in the named volume so it is visible on the
      # host and can be backed up with ordinary tools.
      - ../documents:/data/documents
    restart: unless-stopped

  # The `frontend` service was removed in v15.2 along with the React SPA it
  # served. It was a third chat surface duplicating the admin console's test
  # chat and the widget, so every fix had to be made three times. The admin
  # console is served by the backend at /admin, and the widget has its own
  # service below -- which no longer depends on a React build to exist.
  widget:
    image: nginx:alpine
    ports:
      - "${WIDGET_PORT:-8081}:80"
    volumes:
      - ../src/widget:/usr/share/nginx/html:ro
      - ../src/widget/widget-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, NOT localhost: nginx `listen 80` binds IPv4 only
      # (0.0.0.0:80), while inside the container "localhost" resolves to
      # ::1 first — so the probe gets connection-refused and the container
      # is reported unhealthy while serving traffic perfectly.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Embed snippet for a customer page:
    #   <script src="http://localhost:8081/groundedops-widget.js"
    #           data-api="http://localhost:8000"
    #           data-title="Product support"></script>

  # Local-model service. Only needed for Free/offline mode. Safe to leave
  # running; models download into the named volume on first use (or via
  # the app's Free-mode dialog / `docker compose exec ollama ollama pull mistral`).
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # GPU (optional, big speedup for Free mode) — uncomment if you have NVIDIA+toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  grounded-data:
  ollama-models:
