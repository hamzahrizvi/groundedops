name: CI — test & build

# Runs on every push and PR to main or an experimental/** branch (M11: 89
# commits on experimental/v16.4-logic-and-latency had never been seen by
# CI before this). Real gates (a failure fails the run):
#   1. unit           — the pure-logic test suite (no ML deps, no corpus
#                        needed) plus the scenario routing suite, gated on
#                        the committed floor (run_scenarios.py --min-pass)
#   2. build           — both Docker images must build
#   3. eval-selfcheck — validates every eval suite's schema and that its
#                        committed baseline parses (eval_baseline*.json are
#                        NOT gitignored, .gitignore:46, so this is a real
#                        gate, not advisory — continue-on-error dropped)
#
# Deployment is STAGE 2 below — commented out until a target exists.

on:
  push:
    branches: [ main, "experimental/**" ]
  pull_request:
    branches: [ main, "experimental/**" ]
  # 10.3: nightly run of every gate above, including the Docker start-up
  # test, so a dependency or base-image change that breaks the build is seen
  # the next morning, not at the next push. GitHub runs scheduled workflows
  # on the DEFAULT branch only; to run another branch, use "Run workflow"
  # (workflow_dispatch) and pick it in the branch dropdown.
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, off the top of the hour
  workflow_dispatch:

# Least privilege, set once at the top so every job inherits it. Without an
# explicit block a job gets the token's default permissions, which on some
# repo settings is write access to contents -- far more than a test-and-build
# workflow needs. Flagged by CodeQL (actions/missing-workflow-permissions) on
# all three jobs; a single top-level declaration covers them.
permissions:
  contents: read

jobs:
  # ── Gate 1: unit + route tests ─────────────────────────────────────────
  # Deliberately installs only the lightweight web deps (fastapi/uvicorn/
  # pydantic), not the heavy ML stack (torch/chromadb/sentence-transformers)
  # — the pure-logic modules (chunking, structure, text_utils, memory) and
  # the FastAPI route tests (tests/test_new_routes.py, via _harness.py's
  # ML stubs) are both fully testable without it. Tests that genuinely
  # need sentence-transformers raise SkipTest, which run_tests.py reports
  # as SKIP rather than disguising as a pass. This keeps the gate
  # meaningful and the run fast (seconds, not minutes).
  #
  # Since v15.0 run_tests.py COUNTS a file that fails to import as a failure
  # and exits non-zero, and it isolates sys.modules per file so one test's
  # stubs cannot break the next one's imports. Before that, a bad import was
  # printed as "COULD NOT LOAD" and silently skipped, so a green run did not
  # mean every test file had executed -- five files were being skipped that
  # way, and the missing python-multipart below hid behind the same gap.
  # A genuinely optional dependency (playwright) is reported as a SKIP.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install web deps + sentence-transformers
        # python-multipart is what FastAPI needs to parse the UploadFile
        # document-upload endpoint. It was missing here, so test_new_routes.py
        # could not import at all -- and that went unnoticed for as long as
        # run_tests.py swallowed load failures (see the note above, now fixed).
        # httpx: starlette's TestClient is built on it. Verified against this
        # exact dependency set in a clean Python 3.11 venv, which is what CI
        # uses -- the local venv is 3.14 and behaves differently here.
        #
        # sentence-transformers was DELIBERATELY absent until now, so this job
        # proved the routes import without the ML stack. That guarantee is
        # traded knowingly: test_streaming_and_tables needs the real NLI model,
        # and skipping it meant the streaming grounding rule -- that a streamed
        # answer cannot assert something the documents do not support -- was
        # never exercised in CI, only locally. An untested guarantee is the
        # more expensive thing to be missing.
        #
        # It pulls torch, so pip caching is on above. If this job's runtime
        # becomes a problem, the alternative is to split it: keep `unit` lean
        # and give the ML-dependent files their own job, rather than dropping
        # the coverage again.
        run: pip install fastapi "uvicorn[standard]" pydantic python-multipart httpx cryptography sentence-transformers
      - name: Run unit + route test suite
        run: |
          cd src
          python run_tests.py
      - name: Run scenario routing suite (M11)
        # 148 is the current committed count (24 scenarios, 160 checks);
        # a handful of misses are known/documented, not silently accepted
        # by relabelling them out -- see PENDING.md's M10 section. Raise
        # this number when a real fix earns it, never to paper over a drop.
        run: |
          cd src
          python tests/run_scenarios.py --min-pass 148

  # ── Gate 2: images build ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t groundedops-backend ./src
      # 10.3: building is not starting. Run the image with no index or key and
      # check it comes up, finishes warm-up, and does not claim to be ready.
      - name: Start the image and check health
        run: bash tools/docker_startup_check.sh groundedops-backend
      # The frontend image was removed in v15.2 with the React SPA. The admin
      # console is served by the backend image; the widget is plain static
      # files with no build step, so there is nothing left to compile here.

  # ── Gate 3: eval suite schema ─────────────────────────────────────────
  # Real gate, not advisory (M11): eval_baseline*.json are committed, not
  # gitignored (.gitignore:46), so a broken suite or an unparsable baseline
  # is exactly the kind of thing this should catch before merge.
  # `--selfcheck` needs no backend and no corpus, only every case file's
  # schema and its baseline's JSON — so it runs over the four suites now
  # the "blind" layer exists (M1), not just eval_cases.json.
  eval-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install deps
        run: |
          cd src
          pip install -r requirements.txt
      - name: Validate eval suite schemas
        env:
          GENERATION_MODE: local
        run: |
          cd src
          for f in eval_cases.json eval_cases_blind.json eval_cases_blind2.json eval_cases_retrieval.json; do
            python eval.py --selfcheck --cases "$f"
          done

  # ── STAGE 2: DEPLOY (uncomment once a target exists) ─────────────────
