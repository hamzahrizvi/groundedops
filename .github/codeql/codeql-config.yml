name: "GroundedOps CodeQL config"

# WHY THIS FILE EXISTS
#
# paths-ignore keeps folders that hold no application code out of the scan.
# It is only honoured by an ADVANCED setup like this workflow; GitHub's
# default setup ignores config files entirely.
#
# (Until November 2026 it also excluded src/legacy/, the old release copies.
# That folder was deleted in D-20261112-20; git tags hold the releases.)
paths-ignore:

# corpus/ and documents/ hold customer PDFs, not code, but list them so a
# future stray script in either directory does not silently start being
# scanned as part of the application.
  - corpus
  - documents
