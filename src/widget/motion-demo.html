<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget motion demo</title>
<!--
  Local look at the widget's expand button, animations and typing with no
  backend: fetch is stubbed. A question gets a canned answer after six
  seconds; one with "vs", "compare" or "difference" plays the step-by-step
  comparison (one product, the other, then the comparison). Serve this folder
  over http (a file:// page cannot be driven by the preview browser).
-->
<style>
  body { margin: 0; min-height: 100vh; font: 15px/1.6 system-ui, sans-serif; background: #eef1f4; color: #333; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
</style>
<script>
  (function () {
    var answer = "The **X200** takes a 12 V DC supply.\n\n" +
      "| Pin | Name | Use |\n|---|---|---|\n| 1 | +12V | Supply |\n| 2 | GND | Ground |\n| 3 | TX | Serial out |\n\n" +
      "- Check the supply is within 11-13.2 V.\n- Use the supplied cable.";
    function sse(ev, v) { return "event: " + ev + "\ndata: " + JSON.stringify(v) + "\n\n"; }
    // [seconds, event, data]: what the server sends, and when.
    function script(q) {
      if (!/\bvs\b|compare|difference/i.test(q)) {
        return [[6, "meta", { sources: [] }], [6, "delta", { text: answer }]];
      }
      return [
        [0, "status", { stage: "Looking up the X100" }],
        // Canned answers, real pacing.
        [8, "part", { title: "X100", answer: "The X100 requires a stable 12 V DC power supply rated at least 2 A.", sources: [] }],
        [8, "status", { stage: "Looking up the Y200" }],
        [16, "part", { title: "Y200", answer: "The Y200 requires a stable 12 V DC power supply rated at least 1.5 A.", sources: [] }],
        [16, "status", { stage: "Comparing the two" }],
        [18, "meta", { sources: [] }],
        [18, "delta", { text: "### Comparison

Both take a stable 12 V DC supply; the X100 needs at least 2 A and the Y200 at least 1.5 A.

| | X100 | Y200 |
|---|---|---|
| Supply | 12 V DC, 2 A | 12 V DC, 1.5 A |" }],
      ];
    }
    window.fetch = function (url, init) {
      if (String(url).indexOf("/widget/ask") >= 0) {
        var steps = script(JSON.parse(init.body).q);
        var enc = new TextEncoder();
        return Promise.resolve(new Response(new ReadableStream({
          start: function (c) {
            steps.forEach(function (s, i) {
              setTimeout(function () {
                c.enqueue(enc.encode(sse(s[1], s[2])));
                if (i === steps.length - 1) c.close();
              }, s[0] * 1000 + i);
            });
          },
        }), { headers: { "Content-Type": "text/event-stream" } }));
      }
      return Promise.resolve(new Response("{}", { headers: { "Content-Type": "application/json" } }));
    };
  })();
</script>
</head>
<body>
<main>
  <h1>A customer's page</h1>
  <p>Open the chat bottom right, ask anything, then press the expand button in its header.</p>
</main>
<script src="groundedops-widget.js" data-api="https://stub.invalid"></script>
</body>
</html>
