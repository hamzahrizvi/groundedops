// Everything here changes HOW an answer is produced or verified, rather than
// who may ask. Each switch is written for someone who has to decide whether
// to flip it at 4pm with a customer waiting, so the hint says what happens
// and what it costs -- not what the code does.
function viewAdvanced() {
  if (!polCache) { loadPolicy(); return [el("h1", {}, "Advanced"),
    el("p", { class: "lede" }, "Loading…")]; }
  if (polCache.error) return [el("h1", {}, "Advanced"),
    el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
      el("b", {}, "Could not load settings"), polCache.error))];

  const p = Object.assign({}, polCache.policy);

  // data-sec is the TAB label, which is not always the heading: the top bar
  // wants two words, the card can afford a sentence. Pass "Heading|Tab" to
  // split them.
  const card = (title, hint, ...rows) => {
    const [head, tab] = String(title).split("|");
    return el("div", { class: "card elev-sm",
                style: "padding:18px 20px;gap:0;margin-bottom:14px",
                "data-sec": tab || head },
      el("h3", {}, head),
      hint ? el("p", { class: "sec-hint" }, hint) : null,
      rows);
  };

  const hintLine = t => el("div", { class: "row-hint" }, t);

  const toggleRow = (key, label, hint) => {
    const box = el("input", { type: "checkbox" });
    box.checked = !!p[key];
    box.addEventListener("change", () => { p[key] = box.checked; });
    return el("div", { style: "margin-top:14px" },
      el("label", { style: "display:flex;align-items:center;gap:8px;"
        + "font-size:13.5px;cursor:pointer" }, box, label),
      hintLine(hint));
  };

  const numRow = (key, label, hint, unit, max) => {
    const inp = el("input", { class: "input", type: "number", min: "0",
      max: String(max), value: String(p[key] === undefined ? 0 : p[key]),
      style: "max-width:110px" });
    inp.addEventListener("input", () => { p[key] = inp.value; });
    return el("div", { class: "item", style: "align-items:flex-start;margin-top:14px" },
      el("div", { style: "flex:1 1 260px" },
        el("div", { style: "font-size:13.5px" }, label), hintLine(hint)),
      el("div", { style: "flex:0 0 auto;display:flex;align-items:center;gap:8px" },
        inp, el("span", { style: "font-size:12px;color:color-mix(in srgb,"
          + "var(--color-text) 50%,transparent)" }, unit || "")));
  };

  // ── verification ──
  const verifyCard = card("Checking answers before they are sent|Answer checks",
    "Every answer is checked against the documents it came from, and held "
    + "back if it cannot be verified. That protects customers from confident "
    + "wrong answers — but the checker is strict about tables, and most "
    + "of these manuals keep their facts in tables.",
    toggleRow("llm_verify", "Second opinion on held-back answers",
      "When the first check cannot verify an answer, ask the AI to read the "
      + "page and decide. Measured on 57 questions: 68% answered without "
      + "this, 96% with it, and nothing wrong slipped through. Costs one "
      + "extra AI call, but only for answers that would otherwise be "
      + "refused — in testing it was slightly faster overall, because "
      + "fewer answers fall through to retrying."),
    numRow("grounding_retries", "Retries before giving up",
      "If an answer cannot be verified, write it again and re-check. Useful "
      + "because the same question sometimes verifies on a second attempt. "
      + "Each retry is a full AI call, so keep it low — 1 is plenty "
      + "with the second opinion switched on. 0 means never retry.",
      "attempts", 5));

  // ── sales ──
  const salesReply = el("textarea", { class: "input", rows: "3" },
                        p.sales_reply || "");
  salesReply.addEventListener("input", () => { p.sales_reply = salesReply.value; });
  const salesReplyWrap = el("div", { style: "margin-top:14px;display:"
      + (p.sales_mode === "deflect" ? "" : "none") },
    el("label", { class: "flabel" }, "What a sales question is answered with"),
    salesReply,
    hintLine("Shown on its own, word for word, so put the phone number or "
      + "address you want people to use directly in the text."));
  const salesSel = el("select", { class: "input", onchange: e => {
      p.sales_mode = e.target.value;
      salesReplyWrap.style.display = e.target.value === "deflect" ? "" : "none";
    } },
    el("option", { value: "answer" }, "Answer them from the product list"),
    el("option", { value: "deflect" }, "Reply with a fixed message"),
    el("option", { value: "documents" }, "Treat them as ordinary questions"));
  salesSel.value = p.sales_mode || "answer";

  const salesCard = card("Sales questions",
    "Questions that span the whole range rather than one product — "
    + "“which products run on 24V?”, “do you have anything "
    + "that sorts coins?”. Answering from the product list is safe "
    + "(every name and figure is copied, never invented), but a fixed reply "
    + "hands every sales enquiry to a person instead.",
    el("label", { class: "flabel", style: "margin-top:14px" }, "How to handle them"),
    salesSel, salesReplyWrap,
    hintLine("To answer from a brochure or price list instead, upload it on "
      + "the Documents page and attach it to a product — it is then "
      + "searched like any other manual, whichever option is chosen here."));

  // ── indexing ──
  const indexCard = card("Reading uploaded documents|Uploads",
    "How a PDF is broken up when it is uploaded. These affect documents "
    + "uploaded from now on — existing ones keep the settings they were "
    + "uploaded with.",
    toggleRow("dedupe_shadowed_chunks", "Drop duplicate scraps of a page",
      "When a page introduces a table, the sentence above the table often "
      + "gets stored twice — once on its own, once with the table. The "
      + "copy without the table matches the question but holds none of the "
      + "answer, and can crowd out the copy that does. Leaving this on "
      + "discards it; nothing is lost, because every word is still in the "
      + "copy that kept the table."));

  const saveBtn = el("button", { class: "btn btn-primary", onclick: async () => {
    saveBtn.disabled = true; saveBtn.textContent = "Saving…";
    try {
      await api("/admin/policy", { method: "PUT",
        body: JSON.stringify({ changes: p }) });
      toast("Saved — applies to the next question, no restart");
      polCache = null; await loadPolicy();
    } catch (e) { toast(e.message, true); }
    finally { saveBtn.disabled = false; saveBtn.textContent = "Save changes"; }
  } }, "Save changes");

  return [
    el("h1", {}, "Advanced"),
    el("p", { class: "lede" },
      "How answers are produced and checked. Changes apply to the next "
      + "question — no restart. Only root accounts see this page."),
    verifyCard, salesCard, indexCard, saveBtn,
  ];
}

// Not held in `cache` for the same reason acctCache isn't: refresh() runs
// for every staff account on every render, and this is root-only.
let keysCache = null;

async function loadKeys() {
  try { keysCache = await api("/admin/keys"); }
  catch (e) { keysCache = { providers: [], error: e.message }; }
  render();
}

function viewKeys() {
  if (!keysCache) { loadKeys(); return [el("h1", {}, "API keys"),
    el("p", { class: "lede" }, "Loading…")]; }
  if (keysCache.error) return [el("h1", {}, "API keys"),
    el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
      el("b", {}, "Could not load key status"), keysCache.error))];

  const rows = keysCache.providers.map(p => {
    const input = el("input", { class: "input", type: "password",
      placeholder: p.configured ? "Enter a new key to replace it" : "Paste the key",
      autocomplete: "new-password" });

    const save = async () => {
      const v = input.value.trim();
      if (!v) return toast("Paste a key first", true);
      try {
        await api("/admin/keys/" + p.key, { method: "POST",
          body: JSON.stringify({ value: v }) });
        toast(p.label + " key saved — usable immediately, no restart needed");
        keysCache = null;
        await loadKeys();
      } catch (e) { toast(e.message, true); }
    };

    const clear = async () => {
      if (!confirm("Remove the " + p.label + " key? Anything set to use "
        + p.label + " will fall back to whatever else is configured.")) return;
      try {
        await api("/admin/keys/" + p.key, { method: "DELETE" });
        toast(p.label + " key removed");
        keysCache = null;
        await loadKeys();
      } catch (e) { toast(e.message, true); }
    };

    input.addEventListener("keydown", e => { if (e.key === "Enter") save(); });

    return el("div", { class: "card elev-sm",
                       style: "padding:14px 18px;gap:0;margin-bottom:10px" },
      el("div", { style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap" },
        el("b", {}, p.label),
        p.configured
          ? el("span", { class: "tag tag-accent" }, "configured")
          : el("span", { class: "tag tag-neutral" }, "not set"),
        p.masked ? el("span", { class: "mono", style: "font-size:12px;"
          + "color:color-mix(in srgb,var(--color-text) 55%,transparent)" }, p.masked) : null),
      el("div", { class: "row", style: "margin-top:10px" },
        el("div", { class: "grow" }, input),
        el("div", { style: "flex:0 0 auto;display:flex;gap:6px" },
          el("button", { class: "btn btn-primary", onclick: save }, "Save"),
          p.configured
            ? el("button", { class: "btn btn-ghost", onclick: clear }, "Remove")
            : null)));
  });

  return [
    el("h1", {}, "API keys"),
    el("p", { class: "lede" },
      "Keys for the online answer providers. Saved keys take effect "
      + "immediately — no restart — and only root accounts can see this "
      + "page or the keys' status. A key is never shown again once saved, "
      + "only a masked form for recognising it."),
    el("div", { "data-sec": "Providers", "data-tour": "keys-list" }, rows),
  ];
}

/* ---------------- overview ---------------- */
function viewOverview() {
  const prods = products(), un = unassigned(), ans = answered();

  const scopeLabel = key => {
    const p = prods.find(x => x.key === key);
    if (p) return p.categoryName + " › " + p.name;
    const c = cache.catalog.find(x => x.key === key);
    return c ? c.name : key;
  };

  // Every tile is a button. The numbers were the first thing on the first
  // page and the only thing you could not act on: reading "193 unanswered"
  // and then hunting the rail for where that lives is a step the page can
  // take for you.
  const stat = (label, value, tone, target, hint) =>
    el("button", { class: "stat " + (tone || ""), title: hint || ("Go to " + label),
                   onclick: () => { view = target; render(); } },
      el("div", { class: "lbl" }, label),
      el("b", {}, String(value)),
      el("span", { class: "stat-go" }, hint || ""));

  const step = (state, title, desc, actions) =>
    el("div", { class: "step" },
      el("div", { class: "mark-dot " + state }, state === "done" ? "\u2713" : state === "todo" ? "!" : "\u00b7"),
      el("div", { class: "step-b" },
        el("b", {}, title), el("p", {}, desc),
        actions && actions.length ? el("div", { class: "acts" }, actions) : null));

  const goTo = (id, label, primary) =>
    el("button", { class: "btn " + (primary ? "btn-primary" : "btn-secondary"), style: "font-size:12.5px;padding:4px 10px",
                   onclick: () => { view = id; render(); } }, label);

  const steps = [];

  steps.push(prods.length
    ? step("done", "Products are set up",
        prods.length + " product" + (prods.length === 1 ? "" : "s") +
        " across " + cache.catalog.length + " range" + (cache.catalog.length === 1 ? "" : "s") + ".",
        [goTo("catalog", "Manage products")])
    : step("todo", "Set up your products first",
        "Documents are filed against a product, and the widget asks visitors to pick one. Nothing else works until at least one exists.",
        [goTo("catalog", "Add a product", true)]));

  steps.push(cache.sources.length
    ? step(un.length ? "todo" : "done",
        un.length ? un.length + " document" + (un.length === 1 ? "" : "s") + " need a product"
                  : cache.sources.length + " documents, all filed",
        un.length ? "Unfiled documents are searchable but never offered in the widget, because it can only show products it can answer about."
                  : "Every document belongs to a product and can be found by the widget.",
        [goTo("documents", un.length ? "File them now" : "View documents", !!un.length)])
    : step("todo", "Add your first document",
        "PDF, Word or text. This is what answers are drawn from.",
        [goTo("documents", "Add documents", true)]));

  steps.push(ans.length
    ? step("done", ans.length + " reviewed answers",
        "Signed-out visitors only ever see these, so they are the public face of the widget.",
        [goTo("faq", "Review answers")])
    : step(cache.sources.length ? "todo" : "idle", "Write the reviewed answers",
        "Visitors who are not signed in can only be shown answers you have approved. Draft them from a document, then edit.",
        cache.sources.length ? [goTo("faq", "Start writing", true)] : []));

  steps.push(cache.gaps.length
    ? step("todo", cache.gaps.length + " unanswered questions logged",
        "Real questions the reviewed answers did not cover. This is your to-do list, ordered by how often each was asked.",
        [goTo("gaps", "See what people asked", true)])
    : step("idle", "Questions people could not get answered",
        "Anything the widget could not answer shows up here once visitors start using it.", []));

  // The backlog, on the front page, in the order it should be worked --
  // and answerable from here. Overview summarised work that lived somewhere
  // else; the one list everybody actually opens this console to work
  // through was two clicks away.
  const topGaps = [...(cache.gaps || [])]
    .sort((a, b) => (b.times_asked || 1) - (a.times_asked || 1))
    .slice(0, 5);
  const topAsked = topGaps.length
    ? el("div", { class: "card elev-sm", style: "padding:18px 20px 10px;gap:0;margin-bottom:16px",
                  "data-sec": "Most asked" },
        el("div", { class: "sec-title" }, "Most asked, still unanswered"),
        el("div", { class: "sec-hint" },
          "The five questions customers asked most often that the reviewed "
          + "answers did not cover. Answering one resolves every rewording of it."),
        topGaps.map(g => el("div", { class: "step gap-row" },
          el("span", { style: "font-size:15px;font-variant-numeric:tabular-nums;"
                            + "color:var(--color-accent-ink);flex:0 0 42px" },
            (g.times_asked || 1) + "×"),
          el("div", { class: "step-b" },
            el("div", { style: "font-size:13.5px" }, g.question),
            el("p", {}, g.scope ? scopeLabel(g.scope) : "No product selected")),
          el("div", { class: "gap-actions" },
            el("button", { class: "btn btn-primary", onclick: () => {
              pendingAnswer = { question: g.question, product: g.scope || "", answer: "" };
              view = "faq"; render();
            } }, "Answer this"),
            el("button", { class: "btn btn-ghost", onclick: () => { view = "gaps"; render(); } },
              "See all")))))
    : null;

  const unhandled = (cache.leadStats || {}).unhandled || 0;
  if (unhandled) {
    steps.push(step("todo", unhandled + " enquir" + (unhandled === 1 ? "y" : "ies") + " waiting",
      "Someone filled in the sales or support form. These are not emailed anywhere, so they sit here until you reply.",
      [goTo("leads", "Read them", true)]));
  }

  return [
    el("div", { class: "row-between", style: "align-items:flex-start;gap:16px" },
      el("div", {},
        el("h1", {}, "Overview"),
        el("p", { class: "lede" }, "Everything the support widget knows comes from this console. Work down the list; anything needing attention is marked.")),
      // The per-page help answers "what is on this page". Nothing answered
      // "what do I do first", which is the only question a new install has.
      el("button", { class: "btn btn-primary", style: "flex:0 0 auto",
                     onclick: startGuided },
        "Show me how it all fits together")),
    el("div", { class: "readout", "data-tour": "ov-readout", "data-sec": "At a glance" },
      stat("Documents", cache.sources.length, "", "documents",
           cache.sources.length ? "Manage documents" : "Add the first one"),
      stat("Need filing", un.length, un.length ? "warn" : "", "documents",
           un.length ? "File them" : "All filed"),
      stat("Reviewed answers", ans.length, "", "faq",
           ans.length ? "Review or edit" : "Write the first"),
      stat("Unanswered", cache.gaps.length, cache.gaps.length ? "warn" : "", "gaps",
           cache.gaps.length ? "Answer them" : "Nothing waiting")),
    topAsked,
    el("div", { class: "card elev-sm", style: "padding:18px 20px 6px;gap:0",
                "data-tour": "ov-next", "data-sec": "What to do next" },
      el("div", { class: "sec-title" }, "What to do next"),
      el("div", { class: "sec-hint" }, "Read from live state. Anything needing attention is marked in the accent."),
      steps),
  ];
}

/* ---------------- documents ---------------- */
let pendingReplace = null;

function viewDocuments() {
  const prods = products();
  let chosenCat = cache.catalog.length === 1 ? cache.catalog[0].key : "";
  let chosen = prods.length === 1 ? prods[0].key : "";

  // Category first, then a product list filtered to it \u2014 separate steps
  // instead of one long "Category > Product" dropdown.
  const catSel = el("select", { class: "input", onchange: e => {
    chosenCat = e.target.value; chosen = ""; syncProductOptions(); sync();
  } }, el("option", { value: "" }, cache.catalog.length ? "Choose a category\u2026" : "No categories yet"),
     cache.catalog.map(c => el("option", { value: c.key }, c.name)));
  if (chosenCat) catSel.value = chosenCat;

  const prodSel = el("select", { class: "input", onchange: e => { chosen = e.target.value; sync(); } });
  function syncProductOptions() {
    prodSel.innerHTML = "";
    const inCat = prods.filter(p => p.category === chosenCat);
    prodSel.disabled = !chosenCat;
    prodSel.append(el("option", { value: "" },
      !chosenCat ? "Choose a category first" : inCat.length ? "Choose a product\u2026" : "No products in this category"));
    inCat.forEach(p => prodSel.append(el("option", { value: p.key }, p.name)));
    if (chosen) prodSel.value = chosen;
  }
  syncProductOptions();

  const drop = el("div", { class: "drop off" },
    el("b", {}, "Choose a product first"),
    "Then drop files here, or click to browse");
  const file = el("input", { type: "file", multiple: "true", accept: ".pdf,.docx,.txt", style: "display:none" });
  const progress = el("div", {});

  function sync() {
    const ok = !!chosen;
    drop.className = "drop" + (ok ? "" : " off");
    drop.innerHTML = "";
    drop.append(el("b", {}, ok ? "Drop files here" : "Choose a product first"),
      ok ? "PDF, Word or text \u2014 or click to browse"
         : "Documents must belong to a product so the widget can offer them");
  }
  sync();

  // One POST. `replaceSource` names the document this is a new version of;
  // without it the server refuses a duplicate with 409 and we ask.
  async function postUpload(f, p, replaceSource) {
    const fd = new FormData(); fd.append("file", f);
    const headers = { "x-admin-password": tok,
                      "category-key": p.category, "product-key": p.key };
    if (replaceSource) headers["replace-source"] = replaceSource;
    const r = await fetch(API + "/upload", { method: "POST", body: fd, headers });
    if (r.status === 409) {
      const body = await r.json().catch(() => null);
      const d = (body && body.detail) || {};
      if (d.error === "duplicate_document") return { duplicate: d };
      throw new Error(d.message || "Duplicate document");
    }
    if (!r.ok) throw new Error(await r.text());
    return { job_id: (await r.json()).job_id };
  }

  async function upload(files) {
    if (!chosen) return toast("Choose a product first", true);
    const p = prods.find(x => x.key === chosen);
    for (const f of files) {
      const line = el("div", { class: "item" },
        el("div", { class: "grow" }, el("b", {}, f.name), el("span", {}, "Uploading...")));
      progress.append(line);
      try {
        let res = await postUpload(f, p, null);

        // Already indexed. Rather than refusing and leaving them to work out
        // what to do, offer the two things they can actually mean: this is a
        // newer version of that document, or it was a mistake.
        if (res.duplicate) {
          const d = res.duplicate;
          const choice = await new Promise(resolve => {
            const span = line.querySelector("span");
            span.textContent = "";
            span.append(
              el("div", { style: "margin-bottom:6px" },
                "Already indexed as " + d.existing
                + (d.product ? " (" + d.product + ")" : "") + "."),
              el("div", { style: "display:flex;gap:6px;flex-wrap:wrap" },
                el("button", { class: "btn btn-primary", style: "font-size:12px;padding:4px 10px",
                  onclick: () => resolve("replace") }, "Replace with this version"),
                el("button", { class: "btn btn-ghost", style: "font-size:12px;padding:4px 10px",
                  onclick: () => resolve("skip") }, "Skip")));
          });
          if (choice === "skip") { line.querySelector("span").textContent = "Skipped"; continue; }
          line.querySelector("span").textContent = "Replacing...";
          res = await postUpload(f, p, d.existing);
          if (res.duplicate) throw new Error("Still refused as a duplicate");
          await track(res.job_id, line, f.name);
          afterReplace(line, p, f.name, d.existing);
          continue;
        }
        await track(res.job_id, line, f.name);
      } catch (e) {
        line.querySelector("span").textContent = "Failed: " + e.message;
      }
    }
    await refresh(); render();
  }

  // Recorded rather than drawn inline: upload() finishes with refresh() +
  // render(), which rebuilds this whole view and threw the prompt away the
  // first time it was written into the progress line. viewDocuments() picks
  // this up on the way back.
  function afterReplace(line, p, newName, oldName) {
    pendingReplace = { product: p.key, category: p.category,
                       newName, oldName };
  }

  function replacePrompt() {
    if (!pendingReplace) return null;
    const r = pendingReplace;
    const p = prods.find(x => x.key === r.product) || { key: r.product, category: r.category };
    const done = msg => { pendingReplace = null; if (msg) toast(msg); render(); };
    return el("div", { class: "card elev-sm",
        style: "padding:14px 20px;margin-bottom:12px;display:flex;"
             + "flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;"
             + "box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--color-accent)" },
      el("div", { style: "flex:1 1 320px" },
        el("b", { style: "display:block;font-size:13.5px" },
          "Replaced " + r.oldName),
        el("span", { class: "sec-hint", style: "margin:0" },
          "Answers written from the old version may no longer match it.")),
      el("div", { style: "display:flex;gap:6px;flex-wrap:wrap" },
        el("button", { class: "btn btn-primary", style: BTN, onclick: async e => {
          const b = e.target; b.disabled = true; b.textContent = "Generating…";
          try {
            await api("/admin/faq/autogenerate", { method: "POST", body: JSON.stringify({
              source: r.newName, product: p.key, category: p.category }) });
            await refresh();
            done("Questions regenerated from the new version");
          } catch (err) {
            toast(err.message, true);
            b.disabled = false; b.textContent = "Re-generate questions";
          }
        } }, "Re-generate questions"),
        el("button", { class: "btn btn-secondary", style: BTN,
          onclick: () => { pendingReplace = null; view = "faq"; render(); } },
          "Review existing answers"),
        el("button", { class: "btn btn-ghost", style: BTN,
          onclick: () => done(null) }, "Leave them")));
  }


  async function track(job, line, name) {
    for (let i = 0; i < 600; i++) {
      await new Promise(r => setTimeout(r, 1000));
      let s; try { s = await api("/upload/status/" + job); } catch (e) { break; }
      const span = line.querySelector("span");
      if (s.status === "done") { span.textContent = "Added \u2014 " + (s.chunks || 0) + " sections"; return; }
      if (s.status === "error") { span.textContent = "Failed: " + (s.error || "unknown"); return; }
      // pct is 0 until the first real step reports, and "working 0%" for a
      // minute reads as stuck. Show the stage, and the number only once it
      // means something.
      span.textContent = (s.stage || "working")
        + (s.pct ? " — " + Math.round(s.pct) + "%" : "…");
    }
  }

  drop.addEventListener("click", () => chosen && file.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); if (chosen) drop.classList.add("on"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("on"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("on");
    if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
  });
  file.addEventListener("change", () => file.files.length && upload(file.files));

  // Grouped by category > product instead of one flat list \u2014 unassigned
  // docs are their own pinned-first group, same idea as viewGaps' scope
  // grouping.
  const docRow = s => {
    const cur = s.product || s.products || "";
    const move = el("select", { class: "input", style: "width:auto", onchange: async e => {
      const p = prods.find(x => x.key === e.target.value);
      if (!p) return;
      try {
        await api("/admin/reassign_source", { method: "POST",
          body: JSON.stringify({ source: s.source, category_key: p.category, product_key: p.key }) });
        toast("Filed under " + p.name);
        await refresh(); render();
      } catch (err) { toast(err.message, true); }
    } }, el("option", { value: "" }, cur ? "Move to\u2026" : "File under\u2026"),
       prods.map(p => el("option", { value: p.key }, p.categoryName + " \u203a " + p.name)));

    return el("div", { class: "item" + (cur ? "" : " flagged") },
      el("div", { class: "grow" },
        el("b", {}, s.source),
        el("span", {}, (s.chunks || 0) + " sections")),
      cur ? el("span", { class: "tag tag-neutral" }, cur) : el("span", { class: "tag tag-accent" }, "no product"),
      move,
      el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
        if (!confirm("Remove " + s.source + "? Its answers stay, but it can no longer be searched.")) return;
        try { await api("/delete_source", { method: "POST", body: JSON.stringify({ source: s.source }) });
              toast("Removed"); await refresh(); render(); }
        catch (e) { toast(e.message, true); }
      } }, "Remove"));
  };

  const groups = new Map();
  cache.sources.forEach(s => {
    const key = s.product || s.products || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });
  const label = key => {
    if (!key) return "Unassigned";
    const p = prods.find(x => x.key === key);
    return p ? p.categoryName + " \u203a " + p.name : key;
  };
  const ordered = [...groups.entries()].sort((a, b) =>
    a[0] === "" ? -1 : b[0] === "" ? 1 : label(a[0]).localeCompare(label(b[0])));

  const list = ordered.length ? ordered.map(([key, docs]) =>
    el("div", { style: "margin-bottom:16px" },
      el("div", { class: "sec-title", style: key ? "" : "color:var(--color-accent-ink)" },
        label(key) + " \u00b7 " + docs.length + (docs.length === 1 ? " document" : " documents")),
      docs.map(docRow)))
    : [el("div", { class: "empty" }, el("b", {}, "No documents yet"),
        "Add a manual or datasheet above and the widget can start answering from it.")];

  return [
    el("h1", {}, "Documents"),
    el("p", { class: "lede" }, "The manuals and datasheets answers are drawn from. Each one belongs to a product, which is how the widget knows what to offer."),
    // Sits above the page when a document was just replaced, and stays put
    // across the re-render that follows the upload.
    replacePrompt(),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                "data-tour": "doc-add", "data-sec": "Add documents" },
      el("div", { class: "sec-title" }, "Add documents"),
      el("div", { class: "sec-hint" }, "Pick the category, then the product the document describes, then drop the files in."),
      el("div", { class: "row" },
        el("div", {}, el("label", { class: "flabel" }, "Category"), catSel),
        el("div", {}, el("label", { class: "flabel" }, "Product"), prodSel)),
      el("div", { style: "margin-top:14px" }, drop, file),
      progress),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0",
                "data-tour": "doc-list", "data-sec": "All documents" },
      el("div", { class: "sec-title" }, "All documents"),
      el("div", { class: "sec-hint" }, "A document with no product is searchable but never offered in the widget."),
      list),
  ];
}

/* ---------------- answers (FAQ) ---------------- */
function viewFaq() {
  const prods = products();

  const scopeOf = f => (f.products || "").split(",")[0] || f.category || "";

  // scope -> "Category \u203a Product" label.
  const scopeLabel = key => {
    if (!key || key === NO_SCOPE) return "Not tagged to a product";
    const p = prods.find(x => x.key === key);
    return p ? p.categoryName + " \u203a " + p.name : key;
  };

  // The list is gated on a product (below), so the picker has to offer every
  // scope that actually holds answers -- otherwise entries tagged with a key
  // the catalogue does not know about become unreachable rather than merely
  // unsurfaced, and those are exactly the ones needing to be retagged.
  const known = new Set(prods.map(p => p.key));
  const usedScopes = [...new Set(cache.faq.map(scopeOf))];
  const orphanScopes = usedScopes.filter(k => k && !known.has(k)).sort();
  const hasUnscoped = usedScopes.includes("");
  const countFor = key => (key === NO_SCOPE
    ? cache.faq.filter(f => !scopeOf(f)).length
    : cache.faq.filter(f => (f.products || "").split(",").includes(key) || f.category === key).length);

  let scope = "";
  const shown = () => {
    if (!scope) return [];
    if (scope === NO_SCOPE) return cache.faq.filter(f => !scopeOf(f));
    return cache.faq.filter(f =>
      (f.products || "").split(",").includes(scope) || f.category === scope);
  };

  // On the first render the page has whatever refresh() loaded, which does
  // not carry the scope list. Derive it from the gaps in hand so the filter
  // is populated immediately rather than empty until something reloads.
  if (!cache.gapScopes) {
    cache.gapScopes = [...new Set(cache.gaps.map(g => g.scope || ""))].sort();
  }

  const scopeSel = el("select", { class: "input", style: "width:auto",
                                  onchange: e => { scope = e.target.value; render2(); } },
    el("option", { value: "" }, "Choose a product\u2026"),
    prods.map(p => el("option", { value: p.key },
      p.categoryName + " \u203a " + p.name + " (" + countFor(p.key) + ")")),
    orphanScopes.map(k => el("option", { value: k },
      k + " \u2014 not in the catalogue (" + countFor(k) + ")")),
    hasUnscoped ? el("option", { value: NO_SCOPE },
      "Not tagged to a product (" + countFor(NO_SCOPE) + ")") : null);

  let expandedId = null;      // one row open for editing at a time
  const dirty = new Map();    // id -> {question, answer} not yet saved

  const listBox = el("div", {});
  function render2() {
    scopeSel.value = scope;
    listBox.innerHTML = "";

    // Nothing is listed until a product is chosen. The full list ran to
    // hundreds of rows across every product at once, which is not a thing
    // anyone reads -- and the wording is edited product by product anyway.
    if (!scope) {
      listBox.append(el("div", { class: "empty" },
        el("b", {}, "Choose a product to see its answers"),
        cache.faq.length
          ? cache.faq.length + " reviewed answers in total, across " +
            (usedScopes.filter(Boolean).length || 1) + " product tag" +
            (usedScopes.filter(Boolean).length === 1 ? "" : "s") + "."
          : "No answers yet. Draft some from a document above, or write one by hand."));
      return;
    }

    const items = shown();
    if (!items.length) {
      listBox.append(el("div", { class: "empty" },
        el("b", {}, "No answers for " + scopeLabel(scope)),
        "Draft some from a document above, or write one by hand."));
      return;
    }

    listBox.append(el("div", { style: "display:flex;align-items:center;gap:10px;margin:4px 0 6px" },
      el("b", { style: "font-size:13.5px" }, scopeLabel(scope)),
      el("span", { class: "tag tag-neutral" }, String(items.length)),
      el("button", { class: "btn btn-ghost", style: "font-size:11.5px;margin-left:auto", onclick: () => {
        appliesSel.value = scope === NO_SCOPE ? "" : scope; nq.value = ""; na.value = "";
        na.closest(".card").scrollIntoView({ behavior: "smooth", block: "center" });
        setTimeout(() => nq.focus(), 300);
      } }, "+ Add answer")));

    items.forEach(f => {
      const open = expandedId === f.id;
      const row = el("div", { class: "item", style: open ? "display:block" : "cursor:pointer" });

      if (!open) {
        row.addEventListener("click", () => { expandedId = f.id; render2(); });
        row.append(
          el("div", { class: "grow" }, el("b", {}, f.question),
            el("span", {}, (f.answer || "").slice(0, 90) + ((f.answer || "").length > 90 ? "\u2026" : ""))),
          dirty.has(f.id) ? el("span", { class: "tag tag-neutral mono" }, "unsaved") : null);
      } else {
        const draft = dirty.get(f.id) || {};
        const q = el("input", { class: "input", type: "text", value: draft.question ?? f.question });
        const a = el("textarea", { class: "input" }, draft.answer ?? (f.answer || ""));
        const markDirty = () => dirty.set(f.id, { question: q.value, answer: a.value });
        q.addEventListener("input", markDirty);
        a.addEventListener("input", markDirty);
        row.append(
          el("div", { class: "row", style: "margin-bottom:8px" },
            el("div", { style: "flex:3" }, el("label", { class: "flabel" }, "Question"), q)),
          el("label", { class: "flabel" }, "Answer"), a,
          el("p", { class: "sec-hint", style: "margin:7px 0 0" },
            "Write it so it reads correctly on its own \u2014 it may be shown to someone whose wording was slightly different."),
          el("div", { style: "margin-top:9px;display:flex;gap:8px" },
            el("button", { class: "btn btn-secondary", style: "font-size:12.5px;padding:5px 11px", onclick: async () => {
              try { await api("/faq/" + f.id, { method: "PATCH",
                      body: JSON.stringify({ question: q.value, answer: a.value }) });
                    dirty.delete(f.id); toast("Saved"); await refresh(); render(); }
              catch (e) { toast(e.message, true); }
            } }, "Save"),
            el("button", { class: "btn btn-ghost", style: "font-size:12.5px;padding:5px 11px", onclick: () => {
              expandedId = null; render2();
            } }, "Close"),
            el("button", { class: "btn btn-ghost", style: "font-size:12.5px;padding:5px 11px;margin-left:auto", onclick: async () => {
              if (!confirm("Delete this answer?")) return;
              try { await api("/faq/" + f.id, { method: "DELETE" }); dirty.delete(f.id); toast("Deleted");
                    await refresh(); render(); } catch (e) { toast(e.message, true); }
            } }, "Delete")));
      }
      listBox.append(row);
    });
  }
  render2();

  // Generating FAQs from a document, server-side.
  //
  // This was two buttons, "Draft answers" and "Draft all", which differed only
  // in WHICH documents they covered -- and that is a property of the picker,
  // not a separate action. One button now, with the scope chosen above it.
  const ALL_DOCS = "__all__";
  const undraftedDocs = () => cache.sources.filter(s => {
    const key = s.product || s.products || "";
    return !cache.faq.some(f => scopeOf(f) === key && f.source === s.source);
  });

  const srcSel = el("select", { class: "input" },
    el("option", { value: "" }, "Choose a document\u2026"),
    el("option", { value: ALL_DOCS }, "Every document with no FAQs yet"));

  // Eleven documents in one flat list is already a hunt, and the list only
  // grows. Narrowing by product first is the same two-level move the gaps
  // page makes, and it answers "which manual was that?" by where it is filed
  // rather than by remembering its filename.
  const srcFilter = el("select", { class: "input", style: "width:auto" },
    el("option", { value: "" }, "All products"),
    products().map(p => el("option", { value: p.key },
      p.categoryName + " › " + p.name)),
    el("option", { value: "__none__" }, "Not filed against a product"));

  const drawSources = () => {
    const want = srcFilter.value;
    const keep = cache.sources.filter(s => {
      if (!want) return true;
      const owner = s.product || s.products || "";
      return want === "__none__" ? !owner : owner === want;
    });
    // Rebuilt rather than hidden: a <select> with display:none options is
    // still keyboard-navigable to them, which is how you end up generating
    // FAQs for a document you filtered out.
    // From index 2: the two fixed options are "Choose a document" and "Every
    // document with no FAQs yet", and removing from 1 ate the second one --
    // taking the bulk-generate path with it.
    while (srcSel.options.length > 2) srcSel.remove(2);
    keep.forEach(s => srcSel.append(el("option", { value: s.source }, s.source)));
    if (!keep.length) {
      srcSel.append(el("option", { value: "", disabled: "true" },
        "No documents filed here yet"));
    }
  };
  srcFilter.addEventListener("change", drawSources);
  drawSources();
  const provSel = providerBox();
  const modelIn = linkModelBox(provSel,
    el("input", { class: "input", type: "text", placeholder: "model (optional)" }));

  const genOne = s => api("/admin/faq/autogenerate", { method: "POST",
    body: JSON.stringify({ source: s.source, product: s.product || s.products || "",
      category: s.category || "",
      provider: provSel.value || null, model: modelIn.value.trim() || null }) });

  const genBtn = el("button", { class: "btn btn-primary", style: BTN, onclick: async () => {
    const pick = srcSel.value;
    if (!pick) return toast("Choose a document first", true);

    const docs = pick === ALL_DOCS ? undraftedDocs()
                                   : cache.sources.filter(s => s.source === pick);
    if (!docs.length) {
      return toast(pick === ALL_DOCS ? "Every document already has FAQs"
                                     : "That document is no longer listed", true);
    }
    if (docs.length > 1 && !confirm("Generate FAQs from " + docs.length +
        " documents? This calls the model once per document.")) return;

    genBtn.disabled = true;
    let done = 0, added = 0, dupes = 0;
    try {
      for (const s of docs) {
        genBtn.textContent = docs.length > 1
          ? "Generating " + (++done) + "/" + docs.length + "\u2026" : "Generating\u2026";
        try {
          const r = await genOne(s);
          added += r.added || 0; dupes += r.skipped_duplicates || 0;
        } catch (e) { toast(s.source + ": " + e.message, true); }
      }
      toast("Added " + added + " new FAQ" + (added === 1 ? "" : "s") +
            (dupes ? ", skipped " + dupes + " already there" : ""));
      await refresh(); render();
    } finally { genBtn.disabled = false; genBtn.textContent = "Generate FAQs"; }
  } }, "Generate FAQs");

  // #7: PATCH every row edited but not yet saved.
  const saveAllBtn = el("button", { class: "btn btn-secondary", style: BTN, onclick: async () => {
    if (!dirty.size) return toast("Nothing unsaved");
    const n = dirty.size;
    for (const [id, d] of [...dirty]) {
      try { await api("/faq/" + id, { method: "PATCH", body: JSON.stringify(d) }); dirty.delete(id); }
      catch (e) { toast(id + ": " + e.message, true); }
    }
    toast("Saved " + n + " answer(s)");
    await refresh(); render();
  } }, "Save all");

  // add by hand
  const nq = el("input", { class: "input", type: "text", placeholder: "Does it need an internet connection?" });
  const na = el("textarea", { class: "input", placeholder: "No. Everything is processed on the device; no connection is required." });
  // Its own picker rather than a clone of scopeSel: an empty value means "all
  // products" when writing an answer, but "nothing chosen yet" when filtering.
  const appliesSel = el("select", { class: "input" },
    el("option", { value: "" }, "All products"),
    prods.map(p => el("option", { value: p.key }, p.categoryName + " \u203a " + p.name)),
    orphanScopes.map(k => el("option", { value: k }, k + " \u2014 not in the catalogue")));

  if (pendingAnswer) {
    nq.value = pendingAnswer.question;
    if (pendingAnswer.answer) na.value = pendingAnswer.answer;   // AI draft, from Unanswered
    if (pendingAnswer.product) {
      appliesSel.value = pendingAnswer.product;
      // Only when the picker actually offers it: a gap carries
      // `product || category`, and a category key has no option here.
      if ([...scopeSel.options].some(o => o.value === pendingAnswer.product)) {
        scope = pendingAnswer.product;          // open the list on that product
        render2();
      }
    }
    // Consumed on read: a later re-render (e.g. after saving) must not
    // resurrect a question the admin has already dealt with.
    pendingAnswer = null;
    setTimeout(() => {
      revealSection(na);
      na.focus(); na.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 60);
  }

  return [
    el("h1", {}, "Generate/Edit FAQs"),
    el("p", { class: "lede" }, "FAQs are shown to visitors exactly as written and cost nothing to serve. Anyone not signed in sees only these, so treat the wording as published copy."),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                "data-tour": "ans-draft", "data-sec": "Generate from a document" },
      el("div", { class: "sec-title" }, "Generate FAQs from a document"),
      el("div", { class: "sec-hint" }, "Reads a document you have already added and writes FAQs from it \u2014 the questions a customer would ask, answered from that document alone. Nothing goes live until you have read it, and running it again adds only genuinely new questions: it never overwrites an answer you edited."),
      // Explicit flex bases: the default .row>div{flex:1;min-width:170px} gave
      // five equal columns whose minimums overflowed the card, which is what
      // pushed the model field under the button.
      el("div", { class: "row" },
        el("div", { style: "flex:0 1 200px" },
          el("label", { class: "flabel" }, "Filter by product"), srcFilter),
        el("div", { style: "flex:1 1 240px" },
          el("label", { class: "flabel" }, "Document"), srcSel),
        el("div", { style: "flex:0 1 180px" },
          el("label", { class: "flabel" }, "Provider"), provSel),
        el("div", { style: "flex:0 1 180px" },
          el("label", { class: "flabel" }, "Model"), modelIn),
        el("div", { style: "flex:0 0 auto;min-width:0" }, genBtn))),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                "data-tour": "ans-hand", "data-sec": "Write one yourself" },
      el("div", { class: "sec-title" }, "Write one yourself"),
      el("div", { class: "sec-hint" }, "Hand-written answers are protected \u2014 drafting will never replace them."),
      el("label", { class: "flabel" }, "Question"), nq,
      el("label", { class: "flabel", style: "margin-top:10px" }, "Answer"), na,
      el("div", { class: "row", style: "margin-top:10px" },
        el("div", { style: "flex:0 1 260px" },
          el("label", { class: "flabel" }, "Applies to"), appliesSel),
        el("div", { style: "flex:0 0 auto;min-width:0" },
          el("button", { class: "btn btn-primary", style: BTN, onclick: async () => {
            if (!nq.value.trim()) return toast("Add a question first", true);
            try {
              await api("/faq", { method: "POST", body: JSON.stringify({
                question: nq.value, answer: na.value, product: appliesSel.value }) });
              nq.value = ""; na.value = ""; toast("Added");
              await refresh(); render();
            } catch (e) { toast(e.message, true); }
          } }, "Add answer")))),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0",
                "data-tour": "ans-list", "data-sec": "Answers by product" },
      el("div", { style: "display:flex;align-items:center;gap:12px;margin-bottom:2px;flex-wrap:wrap" },
        el("div", { class: "sec-title", style: "flex:1;margin:0;min-width:160px" }, "Answers by product"), scopeSel),
      el("div", { class: "sec-hint" }, "Edit the wording, or delete anything out of date."),
      listBox,
      el("div", { style: "margin-top:14px;display:flex;gap:8px;flex-wrap:wrap" },
        saveAllBtn,
        el("button", { class: "btn btn-ghost", style: BTN, onclick: async () => {
          if (!scope) return toast("Choose a product first", true);
          if (scope === NO_SCOPE) return toast("Retag these to a product before deleting in bulk", true);
          const label = scopeLabel(scope);
          if (!confirm("Delete every answer for " + label + "?\n\nHand-written answers cannot be recovered.")) return;
          if (prompt('Type DELETE to confirm') !== "DELETE") return toast("Cancelled");
          try {
            await api("/faq?confirm=true&product=" + encodeURIComponent(scope), { method: "DELETE" });
            toast("Deleted"); await refresh(); render();
          } catch (e) { toast(e.message, true); }
        } }, "Delete all shown"))),
  ];
}

/* ---------------- unanswered (gaps) ---------------- */
// Filter/sort state for the customer-questions page. Module-level so it
// survives render(), which rebuilds the whole view on every change.
let gapFilter = { scope: "", sort: "demand", grouped: true };

// How many questions a product group shows before asking. 256 gaps across
// six products meant 256 rows, each with a checkbox, a details element and
// three buttons, all built synchronously on every render -- the page took
// seconds to appear and every filter click paid it again. Nobody reads past
// the first handful: they are sorted by how often the question was asked, so
// the ones that matter are at the top.
const GAP_PAGE = 10;
const gapShown = {};

function viewGaps() {
  const prods = products();
  const nameFor = key => {
    const p = prods.find(x => x.key === key);
    if (p) return p.categoryName + " \u203a " + p.name;
    const c = cache.catalog.find(x => x.key === key);
    return c ? c.name : null;
  };

  const selected = new Set();
  const provSel = providerBox({ style: "width:auto" });
  const modelIn = linkModelBox(provSel,
    el("input", { class: "input", style: "width:auto", type: "text", placeholder: "model (optional)" }));

  const answerHere = (g, answer) => {
    // Prefill the Answers page's hand-written form with this question (and
    // an AI draft, if there is one) and jump there, rather than opening a
    // second editor here. One place to write an answer means one set of
    // wording rules to learn, and saving it resolves this gap automatically.
    pendingAnswer = { question: g.question, product: g.scope || "", answer: answer || "" };
    view = "faq"; render();
  };

  // A cluster stands for several stored gaps, so selecting it has to act on
  // all of them -- dismissing the headline phrasing and silently leaving its
  // five rewordings behind would put the item straight back on the list.
  const idsFor = g => (g.member_ids && g.member_ids.length) ? g.member_ids : [g.id];

  const bulkAction = async (path, method, verb) => {
    if (!selected.size) return toast("Select at least one question first", true);
    try {
      await api(path, { method, body: JSON.stringify({ ids: [...selected] }) });
      toast(verb + " " + selected.size + " question(s)");
      selected.clear(); await refresh(); render();
    } catch (e) { toast(e.message, true); }
  };

  // Group by scope so the list reads as "which product is underserved",
  // which is the decision this page exists to support. Questions asked
  // with no product selected are their own group rather than being
  // hidden or forced under an arbitrary product.
  const groups = new Map();
  cache.gaps.forEach(g => {
    const key = g.scope || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(g);
  });
  const ordered = [...groups.entries()].sort((a, b) =>
    b[1].reduce((n, g) => n + (g.times_asked || 1), 0) -
    a[1].reduce((n, g) => n + (g.times_asked || 1), 0));

  const rows = ordered.map(([key, list]) => {
    const label = key ? (nameFor(key) || key) : "No product selected";
    const asks = list.reduce((n, g) => n + (g.times_asked || 1), 0);
    return el("div", { class: "card elev-sm", style: "padding:14px 20px 8px;gap:0;margin-bottom:12px" +
                        (key ? "" : ";box-shadow:var(--shadow-sm),inset 0 0 0 1px color-mix(in srgb,var(--color-accent) 30%,transparent)") },
      el("div", { style: "display:flex;align-items:baseline;gap:10px;padding-bottom:4px" },
        el("span", { class: "sec-title", style: "flex:1;margin:0" }, label),
        el("span", { style: "font-size:12px;color:color-mix(in srgb,var(--color-text) 45%,transparent)" },
          list.length + (list.length === 1 ? " question" : " questions") + " \u00b7 " + asks + " asks")),
      list.slice(0, Math.min(gapShown[key] || GAP_PAGE, list.length)).map(g => {
        const draftBox = el("div", {});
        // 2px lines the box up with the cap-height of the count beside it.
        // The row is align-items:flex-start (see .gap-row) so neither drifts
        // when the question wraps or the "other wordings" line appears --
        // previously the count stayed at the top while the checkbox and the
        // buttons floated to the middle of a three-line row.
        const cb = el("input", { type: "checkbox", style: "margin-top:2px", onchange: e => {
          idsFor(g).forEach(id => {
            if (e.target.checked) selected.add(id); else selected.delete(id);
          });
        } });
        const row = el("div", { class: "step gap-row" },
          cb,
          el("span", { style: "font-size:15px;font-variant-numeric:tabular-nums;color:var(--color-accent-ink);flex:0 0 42px" },
            (g.times_asked || 1) + "\u00d7"),
          el("div", { class: "step-b" },
            el("div", { style: "font-size:13.5px" }, g.question),
            // The other phrasings this entry stands for. Shown, not hidden:
            // the count only makes sense if you can see what was counted,
            // and a wrong merge has to be visible to be reported.
            (g.variants && g.variants.length)
              ? el("details", { style: "margin-top:4px" },
                  el("summary", { style: "cursor:pointer;font-size:12px;color:var(--color-accent-ink)" },
                    "also asked as " + g.variants.length + " other "
                    + (g.variants.length === 1 ? "wording" : "wordings")),
                  el("div", { style: "margin-top:4px" },
                    g.variants.map(v => el("div", {
                      style: "font-size:12.5px;padding:2px 0;color:color-mix(in srgb,var(--color-text) 65%,transparent)" },
                      "\u2022 " + v.question
                      + (v.times_asked > 1 ? "  (" + v.times_asked + "\u00d7)" : "")))))
              : null,
            el("p", {}, (g.reason === "ungrounded_answer_suppressed"
                ? "The documents nearly cover this \u2014 an answer was found but could not be verified."
                : "Nothing in the documents matched.")
              + (g.ts ? " Last asked " + shortDate(new Date(g.ts * 1000).toISOString()) + "." : "")),
            draftBox),
          el("div", { class: "gap-actions" },
            el("button", { class: "btn btn-secondary", onclick: async e => {
              const btn = e.target; btn.disabled = true; btn.textContent = "Drafting\u2026";
              try {
                const r = await api("/admin/faq/answer_gap", { method: "POST", body: JSON.stringify({
                  gap_id: g.id, provider: provSel.value || null, model: modelIn.value.trim() || null }) });
                draftBox.innerHTML = "";
                draftBox.append(
                  el("p", { class: "sec-hint", style: "margin:8px 0 4px" }, "AI draft \u2014 not saved yet:"),
                  el("p", { style: "font-size:13px;white-space:pre-wrap" }, r.answer || "(no answer)"),
                  el("div", { style: "display:flex;gap:8px" },
                    el("button", { class: "btn btn-primary", style: "font-size:12px;padding:3px 10px",
                      onclick: () => answerHere(g, r.answer) }, "Use this \u2014 review & save"),
                    el("button", { class: "btn btn-ghost", style: "font-size:12px;padding:3px 10px",
                      onclick: () => { draftBox.innerHTML = ""; } }, "Discard")));
              } catch (e2) { toast(e2.message, true); }
              finally { btn.disabled = false; btn.textContent = "Answer with AI"; }
            } }, "Answer with AI"),
            el("button", { class: "btn btn-primary",
                             onclick: () => answerHere(g) }, "Answer this"),
            el("button", { class: "btn btn-ghost", onclick: async () => {
              if (!confirm("Dismiss this question?\n\nAsking it again starts a fresh entry. Use \"Mark spam\" instead if it should never come back.")) return;
              try { await api("/faq/gaps/" + encodeURIComponent(g.id), { method: "DELETE" });
                    toast("Dismissed"); await refresh(); render(); }
              catch (e) { toast(e.message, true); }
            } }, "Dismiss")));
        return row;
      }),
      (() => {
        const shown = Math.min(gapShown[key] || GAP_PAGE, list.length);
        if (shown >= list.length) return null;
        const rest = list.length - shown;
        return el("div", { class: "gap-more" },
          el("button", { class: "btn btn-secondary",
            onclick: () => { gapShown[key] = shown + GAP_PAGE; render(); } },
            rest <= GAP_PAGE
              ? "Show the remaining " + rest
              : "Show " + GAP_PAGE + " more"),
          // Only worth offering while it would actually save a press.
          rest > GAP_PAGE
            ? el("button", { class: "btn btn-ghost",
                onclick: () => { gapShown[key] = list.length; render(); } },
                "Show all " + list.length)
            : null,
          el("span", { class: "gap-more-n" },
            rest + " not shown"));
      })());
  });

  // Reloads from the server rather than filtering in the browser: grouping
  // needs the embedding model, and the scope list has to include keys that
  // are no longer catalogue products but still have questions filed under
  // them (nv9st, coin_hoppers) -- the browser cannot know those.
  const reload = async () => {
    try {
      const qs = "?sort=" + encodeURIComponent(gapFilter.sort)
               + "&group_similar=" + gapFilter.grouped
               + (gapFilter.scope ? "&product=" + encodeURIComponent(gapFilter.scope) : "");
      const r = await api("/faq/gaps" + qs);
      cache.gaps = r.gaps || [];
      cache.gapScopes = r.scopes || [];
      cache.gapCounts = r.scope_counts || {};
      render();
    } catch (e) { toast(e.message, true); }
  };

  // A dropdown hid the one thing this page is for: seeing WHICH product is
  // underserved. You had to open it, pick a product and wait, once per
  // product, to find that out. The same options as a row of chips put every
  // product and its weight on screen at once, and make switching between
  // them one click instead of three.
  // Derived here, not in the shared refresh(): the first paint of this page
  // does not go through reload() and so carries no scope_counts from the
  // server. Without it every chip reads "0", which says "nothing here"
  // rather than "not counted yet". (This lived in viewFaq() briefly, which
  // meant the counts were only right if you happened to visit the FAQ
  // editor first -- an ordering the page-by-page audit accidentally
  // satisfied and a direct link did not.)
  // Same ordering trap as the counts below: the scope list is also derived
  // lazily elsewhere, so arriving on this page directly left it empty and
  // the range chips never rendered at all.
  if (!cache.gapScopes) {
    cache.gapScopes = [...new Set(cache.gaps.map(g => g.scope || ""))].sort();
  }
  if (!cache.gapCounts) {
    cache.gapCounts = {};
    cache.gaps.forEach(g => {
      const k = g.scope || "";
      const e = cache.gapCounts[k] || (cache.gapCounts[k] = { questions: 0, asks: 0 });
      e.questions += 1;
      e.asks += (g.times_asked || 1);
    });
  }
  const counts = cache.gapCounts || {};
  const totalQs = Object.values(counts).reduce((n, c) => n + (c.questions || 0), 0);
  const chip = (key, label, n) => {
    const active = (gapFilter.scope || "") === key;
    return el("button", {
      class: "chip" + (active ? " chip-on" : ""),
      "aria-pressed": active ? "true" : "false",
      onclick: () => { gapFilter.scope = key; reload(); } },
      label,
      n != null ? el("span", { class: "chip-n" }, String(n)) : null);
  };
  // Two levels, not one flat row. Eleven products across three ranges is
  // already too many chips to scan, and it will only grow -- so the top row
  // is ranges, and the products inside one appear only once that range is
  // chosen. Choosing a range also filters the list to it, so the first click
  // is useful on its own rather than only a step towards the second.
  const catOf = k => {
    const pr = prods.find(x => x.key === k);
    if (pr) return pr.categoryKey || pr.category || "";
    return (cache.catalog || []).some(c => c.key === k) ? k : "";
  };
  const catName = ck => {
    const c = (cache.catalog || []).find(x => x.key === ck);
    if (c) return c.name;
    const pr = prods.find(x => (x.categoryKey || x.category) === ck);
    return pr ? pr.categoryName : ck;
  };
  const scopeKeys = (cache.gapScopes || []).filter(Boolean);
  const byCat = new Map();
  scopeKeys.forEach(k => {
    const ck = catOf(k) || "__other__";
    if (!byCat.has(ck)) byCat.set(ck, []);
    byCat.get(ck).push(k);
  });
  const sumFor = keys => keys.reduce((n, k) => n + ((counts[k] || {}).questions || 0), 0);
  const activeCat = gapFilter.scope
    ? (gapFilter.scope === "__none__" ? "" : (catOf(gapFilter.scope) || gapFilter.scope))
    : "";

  const catRow = el("div", { class: "chips", "data-tour": "gaps-filter" },
    chip("", "All products", totalQs),
    [...byCat.entries()]
      .sort((a, b) => sumFor(b[1]) - sumFor(a[1]))
      .map(([ck, keys]) => {
        // A range chip is active when it is selected itself OR when one of
        // its products is, so the trail back up stays visible while drilled in.
        const on = activeCat === ck && gapFilter.scope !== "";
        return el("button", {
          class: "chip" + (on ? " chip-on" : ""),
          "aria-pressed": on ? "true" : "false",
          onclick: () => {
            // Clicking the range you are already inside steps back out,
            // so the top row doubles as the way back.
            gapFilter.scope = on && gapFilter.scope === ck ? "" : ck;
            reload();
          } },
          ck === "__other__" ? "Unfiled" : (catName(ck) || ck),
          el("span", { class: "chip-n" }, String(sumFor(keys))));
      }),
    scopeKeys.indexOf("") >= 0 || (cache.gapScopes || []).indexOf("") >= 0
      ? chip("__none__", "No product selected", (counts[""] || {}).questions || 0)
      : null);

  const childKeys = activeCat && byCat.has(activeCat) ? byCat.get(activeCat) : [];
  const productRow = childKeys.length > 1
    ? el("div", { class: "chips chips-sub" },
        el("span", { class: "chips-rail" }),
        childKeys
          .sort((a, b) => ((counts[b] || {}).questions || 0) - ((counts[a] || {}).questions || 0))
          .map(k => {
            const label = (nameFor(k) || k).split(" › ").pop();
            return chip(k, label, (counts[k] || {}).questions || 0);
          }))
    : null;

  const scopeChips = el("div", {}, catRow, productRow);

  const scopeSel = el("select", { class: "input", style: "width:auto;display:none",
    onchange: () => { gapFilter.scope = scopeSel.value; reload(); } },
    el("option", { value: "" }, "All products"),
    (cache.gapScopes || []).filter(Boolean).map(k =>
      el("option", { value: k, selected: gapFilter.scope === k ? "true" : null },
         nameFor(k) || (k + "  (not in the catalogue)"))),
    (cache.gapScopes || []).indexOf("") >= 0
      ? el("option", { value: "__none__",
                       selected: gapFilter.scope === "__none__" ? "true" : null },
          "No product selected")
      : null);

  const sortSel = el("select", { class: "input", style: "width:auto",
    onchange: () => { gapFilter.sort = sortSel.value; reload(); } },
    [["demand", "Most asked"], ["latest", "Most recent"], ["product", "By product"]]
      .map(([v, t]) => el("option", { value: v,
        selected: gapFilter.sort === v ? "true" : null }, t)));

  const groupCb = el("input", { type: "checkbox",
    onchange: () => { gapFilter.grouped = groupCb.checked; reload(); } });
  groupCb.checked = gapFilter.grouped;

  // flex-direction:row is not redundant. .card is itself a flex column, so
  // a toolbar that sets only display:flex inherits that column and stacks --
  // and then align-items:center, written to centre a ROW vertically, centres
  // the whole thing horizontally instead. That is how this filter bar came
  // to render as a narrow centred stack rather than a left-aligned bar.
  const controls = el("div", { class: "card elev-sm",
      style: "padding:12px 20px;margin-bottom:12px;display:flex;"
           + "flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap",
      "data-tour": "gaps-filter" },
    el("label", { class: "flabel", style: "margin:0" }, "Sort"), sortSel,
    el("label", { style: "display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer" },
      groupCb, "Group similar wordings"),
    el("span", { style: "flex:1" }),
    el("span", { class: "sec-hint", style: "margin:0" },
      cache.gaps.length + (cache.gaps.length === 1 ? " entry" : " entries")));

  return [
    el("h1", {}, "FAQs from customers"),
    el("p", { class: "lede" }, "Questions real visitors asked that the reviewed answers did not cover. Rewordings of the same question are counted together, so the number beside each one is how many people asked it \u2014 not how many ways they phrased it."),
    scopeChips,
    controls,
    cache.gaps.length ? el("div", { class: "card elev-sm", style: "padding:12px 20px;margin-bottom:12px;display:flex;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap" },
      el("span", { class: "sec-hint", style: "margin:0" }, "Select questions above, then:"),
      el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: () => bulkAction("/faq/gaps", "DELETE", "Dismissed") }, "Dismiss selected"),
      el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: () => bulkAction("/faq/gaps/spam", "POST", "Marked spam:") }, "Mark spam"),
      el("span", { style: "flex:1" }),
      el("label", { class: "flabel", style: "margin:0" }, "AI model:"), provSel, modelIn) : null,
    // The anchor is on BOTH branches: on a new install this page is empty,
    // and the walkthrough step explaining what will collect here is exactly
    // the one a new install needs. Anchored only to the list, it had nothing
    // to point at and the step was skipped for the people it was written for.
    cache.gaps.length ? el("div", { "data-tour": "gaps-list" }, rows)
      : el("div", { class: "card elev-sm", "data-tour": "gaps-list" },
          el("div", { class: "empty" },
            el("b", {}, "Nothing unanswered"),
            "Questions the widget could not answer will collect here once visitors start using it.")),
  ];
}

function shortDate(iso) {
  try {
    const d = new Date(iso), now = new Date();
    const days = Math.floor((now - d) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 30) return days + " days ago";
    return d.toLocaleDateString();
  } catch (e) { return ""; }
}

/** Deleting a product, with its documents, answers and questions dealt
 *  with explicitly.
 *
 *  Deleting only the catalogue row is what produced the orphaned `nv9st`
 *  and `coin_hoppers` keys: real content behind a product that no longer
 *  exists, which this console cannot show because it builds every list
 *  FROM the catalogue. So the choice is put to the operator, with the
 *  actual counts in front of them rather than an abstract warning. */
async function deleteProductFlow(cat, prod) {
  let counts;
  try {
    const r = await api("/admin/product/" + encodeURIComponent(prod.key) + "/contents");
    counts = r.contents;
  } catch (e) { return toast(e.message, true); }

  const total = (counts.chunks || 0) + (counts.answers || 0) + (counts.questions || 0);
  if (!total) {
    if (!confirm("Delete " + prod.name + "?\n\nNothing is filed under it.")) return;
    return runDelete(cat, prod, "?delete_content=true");
  }

  const bits = [];
  if (counts.chunks) bits.push(counts.chunks + " document chunk" + (counts.chunks === 1 ? "" : "s"));
  if (counts.answers) bits.push(counts.answers + " reviewed answer" + (counts.answers === 1 ? "" : "s"));
  if (counts.questions) bits.push(counts.questions + " customer question" + (counts.questions === 1 ? "" : "s"));

  // Somewhere for the content to go. The product being deleted is not an
  // option, and neither is a key that is not a real product.
  const others = products().filter(x => x.key !== prod.key);

  const sel = el("select", { class: "input" },
    others.map(x => el("option", { value: x.key }, x.categoryName + " \u203a " + x.name)));

  const box = el("div", { class: "card elev-md",
      style: "position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);"
           + "width:min(520px,92vw);padding:22px" },
    el("h3", {}, "Delete " + prod.name + "?"),
    el("p", { class: "sec-hint", style: "margin-top:6px" },
      "This product holds " + bits.join(", ") + ". Choose what happens to it "
      + "\u2014 it cannot be left without a product, or it disappears from this "
      + "console while still taking up space."),
    others.length
      ? el("div", { style: "margin-top:14px" },
          el("label", { class: "flabel" }, "Move it to"), sel)
      : el("p", { class: "sec-hint", style: "color:var(--color-warn,#c98a00);margin-top:12px" },
          "There is no other product to move it to. Create one first, or "
          + "delete the content along with the product."),
    el("div", { style: "display:flex;gap:8px;margin-top:18px;flex-wrap:wrap" },
      others.length
        ? el("button", { class: "btn btn-primary", onclick: () => {
            close_();
            runDelete(cat, prod, "?reassign_to=" + encodeURIComponent(sel.value));
          } }, "Move it, then delete the product")
        : null,
      el("button", { class: "btn btn-secondary", onclick: () => {
          if (!confirm("Permanently delete " + bits.join(", ") + "?\n\n"
              + "The documents themselves stay on disk, but they will no longer "
              + "be searchable until re-ingested.")) return;
          close_();
          runDelete(cat, prod, "?delete_content=true");
        } }, "Delete it all"),
      el("button", { class: "btn btn-ghost", onclick: () => close_() }, "Cancel")));

  const veil = el("div", { style: "position:fixed;inset:0;z-index:59;"
                                + "background:rgba(0,0,0,.42)", onclick: () => close_() });
  function close_() { veil.remove(); box.remove(); }
  document.body.append(veil, box);
}

async function runDelete(cat, prod, qs) {
  try {
    const r = await api("/admin/product/" + encodeURIComponent(cat.key)
                        + "/" + encodeURIComponent(prod.key) + qs, { method: "DELETE" });
    const a = r.affected || {};
    toast(r.reassigned_to
      ? "Moved " + ((a.chunks || 0) + (a.answers || 0) + (a.questions || 0))
        + " item(s), then deleted " + prod.name
      : "Deleted " + prod.name + " and its content");
    await refresh(); render();
  } catch (e) { toast(e.message, true); }
}

/* ---------------- widget design ---------------- */
function viewWidget() {
  if (!cache.widget) {
    return [
      el("h1", {}, "Widget design"),
      el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
        el("b", {}, "Coming soon"),
        "The embeddable widget currently reads its branding from data-* " +
        "attributes on its embed script tag, not from a config this console " +
        "publishes. This page is disabled until the widget is updated to " +
        "fetch its settings at load.")),
    ];
  }

  // Staged locally; nothing is sent until Save. The preview reads from
  // this draft, so what is on screen is what Save will publish.
  const d = clone(cache.widget);
  const preview = el("div", {});
  const uid = () => randId("id_");

  const ACTIONS = [["product", "Select a product"], ["general", "Ask in general"],
                   ["sales", "Talk to sales"], ["support", "Talk to support"]];
  const TYPES = [["text", "Short answer"], ["email", "Email"],
                 ["textarea", "Long answer"], ["tel", "Phone"]];

  const drawPreview = () => {
    preview.innerHTML = "";
    preview.append(
      el("div", { style: "font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 45%,transparent);margin-bottom:8px" }, "Live preview"),
      el("div", { style: "border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--color-divider);background:var(--color-surface)" },
        el("div", { style: "display:flex;align-items:center;gap:10px;padding:14px 16px;background:" + d.color },
          el("div", { style: "width:30px;height:30px;border-radius:50%;flex:0 0 auto;background:rgba(255,255,255,.25);" +
              (d.icon_url ? "background-image:url('" + d.icon_url.replace(/'/g, "%27") + "');background-size:cover;background-position:center" : "") }),
          el("span", { style: "font-size:14px;font-weight:600;color:#fff" }, d.name || "Support")),
        el("div", { style: "padding:14px;min-height:200px;background:var(--color-bg)" },
          el("div", { style: "max-width:88%;padding:9px 12px;border-radius:10px;background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-divider);font-size:12.5px;line-height:1.5;margin-bottom:10px" },
            d.welcome || ""),
          el("div", { style: "display:flex;flex-direction:column;gap:6px;align-items:flex-start" },
            d.intro_options.map(o => el("span", {
              style: "font-size:12px;padding:6px 12px;border-radius:99px;color:#fff;white-space:nowrap;background:" + d.color
            }, o.label || "\u2026")))),
        el("div", { style: "padding:10px 12px;border-top:1px solid var(--color-divider);display:flex;gap:8px" },
          el("div", { style: "flex:1;height:30px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-divider)" }),
          el("div", { style: "width:30px;height:30px;border-radius:8px;background:" + d.color }))));
  };

  // ---- branding ----
  const nameIn = el("input", { class: "input", type: "text", value: d.name });
  nameIn.addEventListener("input", () => { d.name = nameIn.value; drawPreview(); });
  const welcomeIn = el("textarea", { class: "input", rows: "2" }, d.welcome);
  welcomeIn.addEventListener("input", () => { d.welcome = welcomeIn.value; drawPreview(); });
  const iconIn = el("input", { class: "input", type: "text", value: d.icon_url || "",
                               placeholder: "https://example.com/icon.png" });
  iconIn.addEventListener("input", () => { d.icon_url = iconIn.value.trim(); drawPreview(); });
  const colorIn = el("input", { type: "color", value: d.color,
      style: "width:34px;height:34px;padding:0;border:0;border-radius:8px;cursor:pointer;background:transparent" });
  const swatchRow = el("div", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap" });
  const setColor = hex => { d.color = hex; colorIn.value = hex; drawPreview(); };
  ["#9184d9", "#2f7de1", "#0e7a54", "#b26a00", "#e4002b", "#12161c"].forEach(hex =>
    swatchRow.append(el("button", { title: hex, onclick: () => setColor(hex),
      style: "width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;background:" + hex })));
  swatchRow.append(colorIn);
  colorIn.addEventListener("input", () => setColor(colorIn.value));

  // ---- opening options ----
  const optBox = el("div", {});
  function drawOpts() {
    optBox.innerHTML = "";
    d.intro_options.forEach(o => {
      const lab = el("input", { class: "input", type: "text", value: o.label });
      lab.addEventListener("input", () => { o.label = lab.value; drawPreview(); });
      const act = el("select", { class: "input" },
        ACTIONS.map(([v, t]) => el("option", { value: v }, t)));
      act.value = o.action;
      act.addEventListener("change", () => { o.action = act.value; });
      optBox.append(el("div", { style: "display:flex;gap:8px;align-items:flex-end;margin-bottom:8px" },
        el("div", { style: "flex:1" }, el("label", { class: "flabel" }, "Label"), lab),
        el("div", { style: "flex:0 0 190px" }, el("label", { class: "flabel" }, "Action"), act),
        el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: () => {
          if (d.intro_options.length <= 1)
            return toast("Keep at least one opening option \u2014 the widget needs somewhere to start", true);
          d.intro_options = d.intro_options.filter(x => x !== o);
          drawOpts(); drawPreview();
        } }, "Remove")));
    });
  }
  drawOpts(); drawPreview();

  // ---- contact forms ----
  function formCard(key, title, hint) {
    const f = d[key];
    const box = el("div", {});
    function draw() {
      box.innerHTML = "";
      f.fields.forEach(fl => {
        const lab = el("input", { class: "input", type: "text", value: fl.label });
        lab.addEventListener("input", () => { fl.label = lab.value; });
        const ty = el("select", { class: "input" }, TYPES.map(([v, t]) => el("option", { value: v }, t)));
        ty.value = fl.type;
        ty.addEventListener("change", () => { fl.type = ty.value; });
        const req = el("input", { type: "checkbox" });
        req.checked = !!fl.required;
        req.addEventListener("change", () => { fl.required = req.checked; });
        box.append(el("div", { style: "padding:10px 0;border-top:1px solid color-mix(in srgb,var(--color-text) 9%,transparent)" },
          el("label", { class: "flabel" }, "Field label"), lab,
          el("div", { style: "display:flex;gap:8px;align-items:flex-end;margin-top:8px" },
            el("div", { style: "flex:1" }, el("label", { class: "flabel" }, "Type"), ty),
            el("label", { style: "display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;padding-bottom:8px" },
              req, "Required"),
            el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: () => {
              if (f.fields.length <= 1) return toast("A form needs at least one field", true);
              f.fields = f.fields.filter(x => x !== fl); draw();
            } }, "Remove"))));
      });
    }
    draw();

    // The fixed destination for this form. Asked for here, when the form is
    // being built, because that is when you know who should receive it — and
    // a form with nowhere to go is the failure mode worth catching early.
    const notify = el("input", { class: "input", type: "email",
                                 value: f.notify_email || "",
                                 placeholder: key === "sales_form"
                                   ? "sales@yourcompany.com"
                                   : "support@yourcompany.com" });
    const notifyWarn = el("p", { class: "sec-hint",
      style: "margin:6px 0 0;color:var(--color-warn,#c98a00)" });
    const drawNotifyWarn = () => {
      const v = (f.notify_email || "").trim();
      notifyWarn.textContent = !v
        ? "No destination set — submissions will still be collected, but nobody is named as the owner."
        : v.indexOf("@") === -1
          ? "That does not look like an email address."
          : "";
    };
    notify.addEventListener("input", () => {
      f.notify_email = notify.value.trim();
      drawNotifyWarn();
    });
    drawNotifyWarn();
    const summ = el("input", { type: "checkbox" });
    summ.checked = !!f.allow_summary;
    summ.addEventListener("change", () => { f.allow_summary = summ.checked; });

    // Shown to the visitor as an alternative to waiting for a reply, and
    // named in the assistant's wording when it cannot answer something.
    const phoneIn = el("input", { class: "input", type: "text",
                                  value: f.phone || "",
                                  placeholder: "+44 1256 490290 (Mon-Fri, 9-5)" });
    phoneIn.addEventListener("input", () => { f.phone = phoneIn.value.trim(); });

    const ccIn = el("input", { type: "checkbox" });
    ccIn.checked = f.cc_visitor !== false;
    ccIn.addEventListener("change", () => { f.cc_visitor = ccIn.checked; });
    const titleIn = el("input", { class: "input", type: "text", value: f.title });
    titleIn.addEventListener("input", () => { f.title = titleIn.value; });

    return el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0", "data-sec": title },
      el("div", { class: "sec-title" }, title),
      el("div", { class: "sec-hint" }, hint),
      el("label", { class: "flabel" }, "Form heading"), titleIn,
      box,
      el("p", { class: "sec-hint", style: "margin:8px 0 0" },
        "Every form keeps a required email field: a reply has to go "
        + "somewhere, and a submission with no address is a dead end that "
        + "looks like it worked. It is added back automatically if removed."),
      el("button", { class: "btn btn-secondary", style: "margin-top:10px", onclick: () => {
        if (f.fields.length >= 8) return toast("Eight fields is the maximum \u2014 long forms get abandoned", true);
