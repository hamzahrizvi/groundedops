<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GroundedOps Console</title>
<link rel="stylesheet" href="nocturne/styles.css" />
<style>
  /* ------------------------------------------------------------------
     Thin layer on top of the Nocturne design-system stylesheet: shell
     layout, the nav rail, and a handful of list/chat/dropzone patterns
     the system doesn't itself define. Every color, radius and spacing
     value here still comes from Nocturne's tokens.
     ------------------------------------------------------------------ */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--color-neutral-800);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
  /* uppercase micro-label, used for stat readouts */
  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
       color:color-mix(in srgb, var(--color-text) 45%, transparent)}
  /* plain-case label above a form field */
  .flabel{display:block;font-size:12px;margin-bottom:5px;
          color:color-mix(in srgb, var(--color-text) 70%, transparent)}

  /* ---------- shell ---------- */
  .shell{display:flex;height:100vh;overflow:hidden;background:var(--color-bg);color:var(--color-text);
         font-family:var(--font-body)}
  .rail{width:246px;flex:0 0 auto;display:flex;flex-direction:column;padding:18px 0 14px;
        border-right:1px solid var(--color-divider)}
  .brand{padding:0 18px 18px}
  .brand b{display:block;font-size:16px;font-weight:500;letter-spacing:-.01em;font-family:var(--font-heading)}
  .brand span{font-size:11.5px;color:color-mix(in srgb, var(--color-text) 45%, transparent)}
  .nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:2px}
  /* signed-in account, at the foot of the rail */
  .who{padding:12px 16px 2px;margin:8px 10px 0;border-top:1px solid var(--color-divider)}
  .who-id{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .who-id b{font-size:12.5px;font-weight:500}
  .who-lvl{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
           padding:1px 6px;border-radius:var(--radius-sm);
           background:color-mix(in srgb, var(--color-accent-300) 22%, transparent);
           color:var(--color-accent-300)}
  .who-mail{font-size:11px;margin-top:2px;
            color:color-mix(in srgb, var(--color-text) 45%, transparent);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who-acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .who-acts .btn{font-size:11.5px;padding:3px 7px}
  /* a basic account gets no rail, so the main column carries the page */
  .shell-plain .main{width:100%}
  .row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .nav button{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
              background:transparent;border:0;color:color-mix(in srgb, var(--color-text) 80%, transparent);
              padding:8px 10px 8px 9px;border-radius:var(--radius-md);cursor:pointer;font-size:13.5px}
  .nav button:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);color:var(--color-text)}
  .nav button .mark{width:3px;height:15px;border-radius:2px;flex:0 0 auto;background:transparent}
  .nav button[aria-current="page"]{background:color-mix(in srgb, var(--color-accent) 14%, transparent);
                                    color:var(--color-text);font-weight:500}
  .nav button[aria-current="page"] .mark{background:var(--color-accent)}
  .nav button:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
  .nav .badge{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;
              background:color-mix(in srgb, var(--color-text) 12%, transparent);
              padding:1px 7px;border-radius:99px}
  .nav button[aria-current="page"] .badge{background:var(--color-accent-800);color:var(--color-accent-100)}

  .main{flex:1;overflow-y:auto;padding:30px 34px 90px;position:relative}
  /* Fills the window. This was max-width:1000px with no centring, so on
     anything wider than about 1300px the content hugged the left edge and
     the rest of the window was dead space -- half of it on a 2560 display.
     Width is not what keeps text readable here: the prose elements carry
     their own ch-based measures (.lede, .sec-hint), and the tables and
     lists are the things that actually wanted the room. */
  .wrap{width:100%;animation:rise .18s ease both}
  h1{font-size:26px;letter-spacing:-.025em;margin:0 0 4px;font-family:var(--font-heading);font-weight:500}
  .lede{margin:0 0 22px;max-width:66ch;font-size:14px;
        color:color-mix(in srgb, var(--color-text) 60%, transparent)}

  /* section-header pattern used inside cards, matching the design's
     15px/500 title + 12.5px muted hint pairing */
  .sec-title{font-size:15px;font-weight:500;margin:0 0 2px;font-family:var(--font-heading)}
  .sec-hint{font-size:12.5px;margin:0 0 14px;max-width:60ch;
            color:color-mix(in srgb, var(--color-text) 55%, transparent)}

  /* ---------- readout: overview stat band ---------- */
  .readout{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .readout>div{background:var(--color-surface);border-radius:var(--radius-md);padding:15px 16px 13px;
               box-shadow:var(--shadow-sm)}
  .readout b{display:block;font-family:ui-monospace,monospace;font-size:29px;font-weight:500;
             letter-spacing:-.03em;line-height:1.15;margin-top:6px}
  .readout .warn b{color:var(--color-accent-300)}

  /* ---------- form rows ---------- */
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:170px}

  /* ---------- checklist (overview "what to do next") ---------- */
  .step{display:flex;gap:12px;padding:13px 0;border-top:1px solid color-mix(in srgb, var(--color-text) 9%, transparent)}
  /* An unanswered-question row. Everything pins to the first line, so a row
     that grows (a wrapped question, the "other wordings" line) does not leave
     the checkbox and the buttons floating at its centre while the count stays
     at its top. */
  .gap-row{align-items:flex-start}
  /* Product index for the unanswered list. Every product and its share of
     the backlog visible at once, instead of one at a time behind a select. */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;align-items:center}
  /* The products inside the selected range. Indented and marked with a short
     rail so it reads as a level down rather than a second, equal row. */
  .chips-sub{margin:-4px 0 12px 14px}
  .chips-rail{width:10px;height:1px;flex:0 0 auto;
        background:color-mix(in srgb, var(--color-text) 22%, transparent)}
  .chips-sub .chip{font-size:12px;padding:5px 11px}
  .chip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
        font:inherit;font-size:12.5px;line-height:1;padding:7px 12px;
        border-radius:999px;color:var(--color-text);
        background:var(--color-surface);
        border:1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
        transition:background .12s,border-color .12s}
  .chip:hover{border-color:color-mix(in srgb, var(--color-accent) 45%, transparent)}
  .chip-n{font-variant-numeric:tabular-nums;font-size:11.5px;
          padding:1px 6px;border-radius:999px;
          background:color-mix(in srgb, var(--color-text) 10%, transparent);
          color:color-mix(in srgb, var(--color-text) 62%, transparent)}
  .chip-on{background:var(--color-accent-800);color:var(--color-accent-100);
           border-color:var(--color-accent)}
  .chip-on .chip-n{background:color-mix(in srgb, var(--color-accent-100) 22%, transparent);
                   color:var(--color-accent-100)}
  /* The three actions were a filled button, an outlined button and a bare
     text link, each sized by its own label -- so no two rows agreed on where
     the actions started, and the group read as three unrelated things. Same
     geometry for all three, right-aligned as one block, keeps them a single
     control group; the weight difference alone still says which is primary. */
  .gap-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto}
  .gap-actions .btn{font-size:12.5px;padding:5px 12px;min-width:104px;
        justify-content:center;white-space:nowrap}
  .step:first-of-type{border-top:0}
  .mark-dot{width:21px;height:21px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
        justify-content:center;font-size:11px;font-weight:700}
  .mark-dot.done{background:var(--color-accent-800);color:var(--color-accent-100)}
  .mark-dot.todo{background:transparent;color:var(--color-accent);box-shadow:inset 0 0 0 1.5px var(--color-accent)}
  .mark-dot.idle{background:var(--color-neutral-800);color:var(--color-neutral-400)}
  .step-b{flex:1;min-width:0}
  .step-b b{display:block;font-size:13.5px;font-weight:500}
  .step-b p{margin:2px 0 0;font-size:12.5px;line-height:1.5;
            color:color-mix(in srgb, var(--color-text) 55%, transparent)}
  .step-b .acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- list rows (documents / answers / products) ---------- */
  .item{display:flex;gap:12px;align-items:center;padding:10px 0;
        border-top:1px solid color-mix(in srgb, var(--color-text) 9%, transparent)}
  .item:first-child{border-top:0}
  .item .grow{flex:1;min-width:0}
  .item .grow b{display:block;font-size:13.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .grow span{font-size:12px;color:color-mix(in srgb, var(--color-text) 50%, transparent)}
  .item.flagged{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 35%, transparent);
                border-radius:var(--radius-md);padding:10px 12px;border-top:0;margin-bottom:2px}

  .empty{text-align:center;padding:30px 20px;color:color-mix(in srgb, var(--color-text) 55%, transparent)}
  .empty b{display:block;color:var(--color-text);margin-bottom:4px;font-weight:500}

  /* ---------- drop zone ---------- */
  .drop{border:1.5px dashed var(--color-divider);border-radius:var(--radius-md);padding:26px;text-align:center;
        background:color-mix(in srgb, var(--color-text) 3%, transparent);
        color:color-mix(in srgb, var(--color-text) 55%, transparent);
        transition:border-color .12s,background .12s;cursor:pointer}
  .drop b{display:block;color:var(--color-text);font-weight:500}
  .drop.on{border-color:var(--color-accent);background:color-mix(in srgb, var(--color-accent) 10%, transparent)}
  .drop.off{opacity:.55;cursor:default}

  /* ---------- test chat ---------- */
  .chat{border-radius:var(--radius-md);height:340px;overflow-y:auto;padding:14px;
        background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-divider)}
  .bub{max-width:80%;padding:9px 13px;border-radius:var(--radius-md);margin-bottom:9px;font-size:13.5px;
       line-height:1.5;white-space:pre-wrap}
  .bub.u{margin-left:auto;background:var(--color-accent-800);color:var(--color-accent-100)}
  .bub.a{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-divider)}

  /* ---------- toast ---------- */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:var(--color-surface);box-shadow:var(--shadow-md);color:var(--color-text);
         padding:11px 18px;border-radius:var(--radius-md);font-size:13.5px;z-index:80;max-width:90vw}
  .toast.bad{box-shadow:var(--shadow-md), inset 0 0 0 1px var(--color-accent);color:var(--color-accent-200)}

  /* ---------- login gate ---------- */
  .gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
        background:var(--color-bg);color:var(--color-text)}
  .gate .card{max-width:380px;width:100%}

  .md p{margin:0 0 7px}
  .md p:last-child{margin-bottom:0}
  .md ul,.md ol{margin:4px 0 7px;padding-left:20px;display:flex;flex-direction:column;gap:3px}
  .md li{font-size:13.5px}
  .md code{font-family:ui-monospace,monospace;font-size:.88em;
           background:color-mix(in srgb, var(--color-text) 9%, transparent);
           padding:.1em .32em;border-radius:3px}
  .md-table{border-collapse:collapse;margin:5px 0 8px;font-size:12.5px;
            display:block;overflow-x:auto;max-width:100%}
  .md-table td{border:1px solid var(--color-divider);padding:4px 8px;
               vertical-align:top;font-variant-numeric:tabular-nums}
  /* ---------- in-page sub-navigation ---------- */
  /* Sections of the active page, listed under its nav row so they can be
     reached without scrolling for them. Built from the rendered DOM in
     buildSubnav(), so a view gets one for free by tagging cards data-sec. */
  /* Text aligns under the parent item's label (10px rail padding + 9px button
     padding + 3px mark + 9px gap = 31px), so the list reads as that item's
     contents. An earlier version indented off a vertical rule, which sat
     awkwardly against both the rail border and the active item's block. */
  .subnav{display:flex;flex-direction:column;padding:1px 10px 6px}
  .subnav button{display:block;width:100%;text-align:left;border:0;background:transparent;
                 cursor:pointer;font:inherit;font-size:12.5px;
                 padding:5px 10px 5px 21px;border-radius:var(--radius-md);
                 color:color-mix(in srgb, var(--color-text) 42%, transparent)}
  .subnav button:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent);
                       color:color-mix(in srgb, var(--color-text) 85%, transparent)}
  .subnav button:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}

  /* ---------- walkthrough ---------- */
  /* The help icon sits over .main rather than in the rail, so it stays put
     while the page scrolls. */
  .help-btn{position:fixed;top:18px;right:26px;z-index:40;width:34px;height:34px;
            border-radius:50%;border:0;cursor:pointer;background:var(--color-surface);
            box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--color-divider);
            color:var(--color-accent-400);font-size:15px;font-weight:600;
            display:grid;place-items:center;font-family:inherit}
  .help-btn:hover{color:var(--color-accent-300)}
  .help-btn:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

  @keyframes tourPulse{
    0%,100%{box-shadow:0 0 0 1px var(--color-accent),
                       0 0 0 0 color-mix(in srgb, var(--color-accent) 45%, transparent)}
    50%    {box-shadow:0 0 0 1px var(--color-accent),
                       0 0 0 6px color-mix(in srgb, var(--color-accent) 22%, transparent)}
  }
  /* position/z-index so the ring is not clipped by a neighbouring card. */
  .tour-hi{position:relative;z-index:41;border-radius:var(--radius-md);
           animation:tourPulse 1.9s ease-in-out infinite}
  .tour-pop{position:fixed;z-index:95;width:300px;background:var(--color-surface);
            border-radius:var(--radius-md);padding:16px 18px;
            box-shadow:var(--shadow-lg),0 0 0 1px var(--color-divider);
            animation:rise .18s ease both}
  .tour-pop .step{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--color-accent-400);margin-bottom:6px}
  .tour-pop .tt{font-size:14px;font-weight:500;margin-bottom:6px}
  .tour-pop .tx{font-size:13px;line-height:1.55;
                color:color-mix(in srgb, var(--color-text) 85%, transparent)}
  .tour-pop .acts{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .tour-pop .acts .btn{font-size:12px;padding:4px 10px}
  @media (prefers-reduced-motion:reduce){
    .tour-hi{animation:none;box-shadow:0 0 0 2px var(--color-accent)}
    .tour-pop{animation:none}
  }

  @media (max-width:820px){
    .shell{flex-direction:column;height:auto;min-height:100vh}
    .rail{width:100%;flex-direction:row;align-items:center;padding:10px;overflow-x:auto}
    .brand{border:0;padding:0 14px 0 6px;margin:0}
    .nav{flex-direction:row;flex:1}
    .subnav{display:none}
    .readout{grid-template-columns:repeat(2,1fr)}
    .main{padding:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ------------------------------------------------------------------ *
 * GroundedOps Console (v13.0 — Nocturne)
 *
 * One self-contained file, served by the backend at /admin. No build
 * step: replace the file, reload the page. Ship the sibling
 * nocturne/styles.css alongside it.
 *
 * The organising idea is that the console should answer "what do I do
 * next?" without anyone reading a manual. The Overview reads live state
 * and turns it into a short list of actions, so an unassigned document
 * or an empty FAQ announces itself instead of waiting to be discovered.
 * ------------------------------------------------------------------ */

const API = location.origin;
// A session token, not a password — the header it travels in is still
// called x-admin-password for wire compatibility (see main.py's auth block).
let tok = sessionStorage.getItem("go_admin_token") || "";
// The signed-in account: {id, email, name, level, must_change_password}.
// `level` decides which nav rows exist, so it is held rather than re-fetched.
let me = JSON.parse(sessionStorage.getItem("go_admin_me") || "null");

const LEVEL_LABEL = { root: "Root", support: "Support", basic: "Basic" };
const isRoot = () => me && me.level === "root";
const isStaff = () => me && (me.level === "root" || me.level === "support");

function signOut(msg) {
  tok = ""; me = null;
  sessionStorage.removeItem("go_admin_token");
  sessionStorage.removeItem("go_admin_me");
  if (msg) toast(msg, true);
  render();
}
let view = "overview";
// Set by the Unanswered page's "Answer this" so the Answers page opens
// with the question prefilled and scrolled into view.
let pendingAnswer = null;
let cache = { catalog: null, sources: [], faq: [], gaps: [], providers: [],
              widget: null, leads: [], leadStats: {} };

// Sentinel for "answers carrying no product tag at all" in the answers-page
// picker, kept distinct from "" which means nothing chosen yet.
const NO_SCOPE = "__none__";
// One button metric for the console, so rows of mixed .btn variants line up.
const BTN = "font-size:12.5px;padding:5px 11px";

const randId = (prefix) => {
  // crypto.getRandomValues, not Math.random: these are identifiers, and one of
  // them (the chat session id) is sent to the backend. Math.random is
  // predictable, and a scanner cannot tell a "harmless" id from a security
  // token -- neither can the next person to reuse this helper.
  const b = new Uint8Array(9);
  (self.crypto || window.crypto).getRandomValues(b);
  return prefix + Array.from(b, x => x.toString(36).padStart(2, "0")).join("").slice(0, 14);
};

const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  // flat(Infinity), not flat(): a view returning [h1, lede, rows] where
  // `rows` is itself an array of cards nests two deep, and a single-level
  // flatten leaves that inner array to be passed to createTextNode —
  // which renders the literal string "[object HTMLDivElement]" instead of
  // the list. Depth-1 happened to work only while every view returned a
  // flat list of elements.
  kids.flat(Infinity).forEach(c => c && n.append(c.nodeType ? c : document.createTextNode(c)));
  return n;
};

function toast(msg, bad) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = el("div", { class: "toast" + (bad ? " bad" : "") }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

// Provider pickers are built from what the server says it can actually reach
// (/admin/providers: key present in the environment, or Ollama warmed) rather
// than a hardcoded list of all four. Offering DeepSeek with no key set failed
// with "returned nothing", which reads as a broken model rather than as
// missing configuration.
function providerBox(extra) {
  return el("select", Object.assign({ class: "input" }, extra || {}),
    el("option", { value: "" },
      cache.providers.length ? "Server default" : "Server default (none configured)"),
    cache.providers.map(p => el("option", { value: p.key }, p.label)));
}

const defaultModelFor = key =>
  (cache.providers.find(p => p.key === key) || {}).default_model || "";

// The model box means nothing until a provider is chosen, and showing that
// provider's current default as the placeholder saves guessing a model name
// -- which is how a retired one went unnoticed.
function linkModelBox(sel, box) {
  const sync = () => {
    const d = defaultModelFor(sel.value);
    box.placeholder = d ? d + "  (default)" : "model (optional)";
    box.disabled = !sel.value;
  };
  sel.addEventListener("change", sync);
  sync();
  return box;
}

// Answers come back as markdown-ish text: "- 13: USB power (+5V)" lines, the
// occasional **bold**, sometimes a pipe table. Rendered as a single text node
// they were a wall of characters -- a pinout list being the worst case. This
// is a deliberately small renderer: escape everything first, then allow only
// bullets, ordered lists, tables, bold, code and paragraphs. No library, and
// nothing that can inject markup.
function mdEscape(t) {
  return (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function mdInline(t) {
  return mdEscape(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

const MD_BULLET = /^\s*[-*•]\s+(.*)$/;
const MD_NUM = /^\s*\d+[.)]\s+(.*)$/;
const MD_ROW = /^\s*\|.*\|\s*$/;
const MD_SEP = /^[\s|:-]+$/;

function renderMarkdown(text) {
  const box = el("div", { class: "md" });
  const lines = String(text || "").split(/\r?\n/);
  let i = 0;

  const flushList = (ordered) => {
    const list = el(ordered ? "ol" : "ul", {});
    while (i < lines.length) {
      const m = lines[i].match(ordered ? MD_NUM : MD_BULLET);
      if (!m) break;
      list.append(el("li", { html: mdInline(m[1]) }));
      i++;
    }
    box.append(list);
  };

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    // A pipe table, which is how spec rows arrive now parsing keeps them.
    if (MD_ROW.test(line)) {
      const tbl = el("table", { class: "md-table" });
      while (i < lines.length && MD_ROW.test(lines[i])) {
        if (!MD_SEP.test(lines[i])) {          // the |---|---| row carries no data
          const tr = el("tr", {});
          lines[i].trim().replace(/^\||\|$/g, "").split("|")
            .forEach(c => tr.append(el("td", { html: mdInline(c.trim()) })));
          tbl.append(tr);
        }
        i++;
      }
      box.append(tbl);
      continue;
    }

    if (MD_BULLET.test(line)) { flushList(false); continue; }
    if (MD_NUM.test(line)) { flushList(true); continue; }

    const para = [];
    while (i < lines.length && lines[i].trim()
           && !MD_BULLET.test(lines[i]) && !MD_NUM.test(lines[i])
           && !MD_ROW.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    box.append(el("p", { html: mdInline(para.join(" ")) }));
  }
  return box;
}

async function api(path, opts = {}) {
  const o = Object.assign({ headers: {} }, opts);
  o.headers["x-admin-password"] = tok;
  if (o.body && !(o.body instanceof FormData)) o.headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, o);
  // 401 and 403 mean different things and must not be collapsed: 401 is
  // "your session is gone" (sign in again), 403 is "your account is fine
  // but this level may not do that" (signing in again changes nothing, and
  // bouncing to the gate would look like a broken login).
  if (r.status === 401) { signOut(); throw new Error("Session expired"); }
  if (r.status === 403) {
    let d; try { d = (await r.json()).detail; } catch (e) { d = "Not permitted"; }
    throw new Error(typeof d === "string" ? d : "Not permitted");
  }
  if (!r.ok) {
    let d; try { d = (await r.json()).detail; } catch (e) { d = r.statusText; }
    throw new Error(typeof d === "string" ? d : JSON.stringify(d));
  }
  return r.status === 204 ? null : r.json();
}

/* ---------------- data ---------------- */
async function refresh() {
  // All independent reads — run them together rather than in series, so
  // opening the console is one round trip's worth of latency, not six.
  const [cat, src, faq, gaps, widget, leads, prov] = await Promise.all([
    api("/catalog").catch(() => ({ categories: [] })),
    api("/admin/sources").catch(() => ({ sources: [] })),
    api("/faq").catch(() => ({ faq: [] })),
    api("/faq/gaps").catch(() => ({ gaps: [], stats: {} })),
    api("/admin/widget/config").catch(() => null),
    api("/admin/leads").catch(() => ({ leads: [], stats: {} })),
    api("/admin/providers").catch(() => ({ providers: [] })),
  ]);
  cache.catalog = cat.categories || [];
  cache.sources = src.sources || src || [];
  cache.faq = faq.faq || [];
  cache.gaps = gaps.gaps || [];
  cache.gapStats = gaps.stats || {};
  // Kept as null on failure rather than defaulted: the Widget page needs
  // to tell the difference between "not loaded" and "loaded and empty",
  // or a failed read would render as a blank config the admin could
  // accidentally save over their real one.
  cache.widget = widget;
  cache.providers = prov.providers || [];
  cache.leads = leads.leads || [];
  cache.leadStats = leads.stats || {};
}

const unassigned = () => cache.sources.filter(s => !(s.product || s.products));

async function changeOwnPassword() {
  const cur = prompt("Your current password:");
  if (!cur) return;
  const next = prompt("New password (at least 12 characters):");
  if (!next) return;
  if (next !== prompt("Type the new password again:"))
    return toast("Those did not match", true);
  try {
    // The server bumps this account's token epoch, killing every session it
    // had — including this one. It hands back a replacement so the person
    // who just changed their own password is not signed out for doing it.
    const r = await api("/admin/auth/password", { method: "POST",
      body: JSON.stringify({ current_password: cur, new_password: next }) });
    tok = r.token;
    sessionStorage.setItem("go_admin_token", tok);
    if (me.must_change_password) {
      me.must_change_password = false;
      sessionStorage.setItem("go_admin_me", JSON.stringify(me));
      render();
    }
    toast("Password changed");
  } catch (e) { toast(e.message, true); }
}

}

/* ---------------- gate ---------------- */
// `firstRun` is null until /admin/auth/state answers, so the card can say
// "checking" rather than flashing a sign-in form at someone who has no
// account to sign in with yet.
let firstRun = null;
let gateDomain = "";

function gate() {
  const emailIn = el("input", { class: "input", type: "email",
                                placeholder: "you@company.com", autofocus: "true" });
  const pwIn = el("input", { class: "input", type: "password", placeholder: "Password" });
  const status = el("p", { class: "sec-hint", style: "margin-bottom:16px" },
                    "Checking this install\u2026");
  const btn = el("button", { class: "btn btn-primary", disabled: "true" }, "Sign in");
  const nameIn = el("input", { class: "input", placeholder: "Your name (optional)" });
  const nameField = el("div", { class: "field", style: "display:none" }, nameIn);

  // Every failure here used to surface as "that password was not accepted" --
  // a wrong password, a server that was not running, a proxy swallowing the
  // request and a 404 from the private-surface middleware all looked
  // identical. Only a 401 is actually about the credentials; say what the
  // others were, because from another PC on the LAN the difference is the
  // whole diagnosis.
  const fail = (e, verb) => {
    if (e instanceof TypeError) {
      // fetch() rejects with a TypeError when the request never got a
      // response at all: server down, wrong host, blocked in transit.
      toast("Could not reach the server at " + API + " \u2014 " + e.message, true);
    } else {
      toast(verb + " failed: " + e.message, true);
    }
  };

  const enter = async (r) => {
    tok = r.token;
    me = r.user;
    sessionStorage.setItem("go_admin_token", tok);
    sessionStorage.setItem("go_admin_me", JSON.stringify(me));
    // A basic account cannot call any of refresh()'s reads \u2014 they are all
    // admin endpoints \u2014 so skip it rather than firing six 403s and
    // reporting them as errors. It needs no console data at all: its whole
    // page is the widget in an iframe, which fetches its own config and
    // catalog from the public /widget/* routes.
    if (isStaff()) {
      // A 401 during refresh() signs out from inside api(), which would
      // land you back at the gate with nothing said. Check for it instead
      // of letting it look like the credentials failed.
      try { await refresh(); } catch (e) { toast("Loaded with errors: " + e.message, true); }
      if (!tok) return toast("Signed in, but a follow-up request was rejected", true);
    }
    render();
    if (me.must_change_password)
      toast("This password was set for you \u2014 please change it", true);
  };

  const signIn = async () => {
    if (!emailIn.value.trim() || !pwIn.value) return toast("Email and password, please", true);
    btn.disabled = true;
    try {
      await enter(await api("/admin/login", { method: "POST",
        body: JSON.stringify({ email: emailIn.value.trim(), password: pwIn.value }) }));
    } catch (e) { fail(e, "Sign-in"); btn.disabled = false; }
  };

  const createRoot = async () => {
    if (!emailIn.value.trim() || !pwIn.value) return toast("Email and password, please", true);
    if (pwIn.value.length < 12)
      return toast("Use at least 12 characters for the first account", true);
    btn.disabled = true;
    try {
      await enter(await api("/admin/auth/bootstrap", { method: "POST",
        body: JSON.stringify({ email: emailIn.value.trim(), password: pwIn.value,
                               name: nameIn.value.trim() }) }));
      toast("Root account created \u2014 you can now add others under Accounts");
    } catch (e) { fail(e, "Setup"); btn.disabled = false; }
  };

  // Asked unauthenticated, because deciding which form to show is exactly
  // the thing that cannot require being signed in.
  (async () => {
    try {
      const s = await (await fetch(API + "/admin/auth/state")).json();
      firstRun = !s.initialised;
      gateDomain = s.email_domain || "";
    } catch (e) {
      status.textContent = "Could not reach the server at " + API + ".";
      return;
    }
    btn.disabled = false;
    if (firstRun) {
      status.textContent = "No accounts exist yet. Create the first one \u2014 it "
        + "will be the root account, the only level that can add others.";
      btn.textContent = "Create root account";
      btn.onclick = createRoot;
      nameField.style.display = "";
      pwIn.placeholder = "Password (at least 12 characters)";
    } else {
      status.textContent = gateDomain
        ? "Sign in with your @" + gateDomain + " account."
        : "Sign in to manage the documents and answers behind the support widget.";
      btn.onclick = signIn;
    }
  })();

  const onEnter = e => { if (e.key === "Enter" && !btn.disabled) btn.onclick(); };
  emailIn.addEventListener("keydown", onEnter);
  pwIn.addEventListener("keydown", onEnter);

  return el("div", { class: "gate" },
    el("div", { class: "card elev-md", style: "padding:22px" },
      el("h2", {}, "GroundedOps console"),
      status,
      el("div", { class: "field" }, emailIn),
      nameField,
      el("div", { class: "field" }, pwIn),
      el("div", { style: "margin-top:14px" }, btn)));
}

/* ---------------- backup (export: support+, import: root) ---------------- */
function viewBackup() {
  const inclDocs = el("input", { type: "checkbox" }); inclDocs.checked = true;
  const inclIndex = el("input", { type: "checkbox" }); inclIndex.checked = true;

  // Downloaded via fetch rather than a plain link: the credential travels in
  // a header, and an <a href> cannot carry one.
  const doExport = async () => {
    const pw = pwIn.value;
    const again = pwAgain.value;
    if (pw.length < 12)
      return toast("Use a passphrase of at least 12 characters", true);
    if (pw !== again) return toast("Those passphrases do not match", true);
    if (!confirm("The passphrase cannot be recovered.\n\nIf you lose it, this "
      + "backup is unreadable \u2014 there is no way back in, by design. Store it "
      + "with your other secrets, NOT next to the backup file.\n\nContinue?"))
      return;
    exportBtn.disabled = true; exportBtn.textContent = "Preparing\u2026";
    try {
      // POST, not GET: a passphrase in a query string ends up in proxy and
      // server access logs.
      const r = await fetch(API + "/admin/backup/export", {
        method: "POST",
        headers: { "x-admin-password": tok, "Content-Type": "application/json" },
        body: JSON.stringify({ documents: inclDocs.checked,
                               index: inclIndex.checked, passphrase: pw }) });
      if (!r.ok) {
        let d; try { d = (await r.json()).detail; } catch (e) { d = r.statusText; }
        throw new Error(typeof d === "string" ? d : "Export failed (" + r.status + ")");
      }
      const blob = await r.blob();
      const cd = r.headers.get("content-disposition") || "";
      const m = cd.match(/filename="([^"]+)"/);
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: m ? m[1] : "groundedops-backup.zip" });
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast("Backup downloaded and encrypted \u2014 keep the passphrase safe");
      pwIn.value = ""; pwAgain.value = "";
    } catch (e) { toast(e.message, true); }
    finally { exportBtn.disabled = false; exportBtn.textContent = "Download backup"; }
  };
  const exportBtn = el("button", { class: "btn btn-primary", onclick: doExport },
                       "Download backup");
  const pwIn = el("input", { class: "input", type: "password",
                             placeholder: "Passphrase (12+ characters)",
                             autocomplete: "new-password" });
  const pwAgain = el("input", { class: "input", type: "password",
                                placeholder: "Passphrase again",
                                autocomplete: "new-password" });

  const exportCard = el("div", { class: "card elev-sm",
      style: "padding:18px 20px;gap:0;margin-bottom:14px",
      "data-sec": "Export", "data-tour": "backup-export" },
    el("h3", {}, "Download a backup"),
    el("p", { class: "sec-hint" },
      "Encrypted with a passphrase you choose. The file cannot be opened "
      + "without it \u2014 not by a spreadsheet, not by an unzip tool, and not "
      + "by this console."),
    el("p", { class: "sec-hint" },
      isRoot()
        ? "Everything: documents, the search index, FAQs, catalogue, widget "
          + "design, enquiries, accounts and limits."
        : "Documents, the search index, FAQs, catalogue, widget design and "
          + "enquiries. Accounts and limits are in a root backup only."),
    el("label", { style: "display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:12px;cursor:pointer" },
      inclDocs, "Include the documents (the bulk of the file, ~100MB)"),
    el("label", { style: "display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;cursor:pointer" },
      inclIndex, "Include the search index (so a restore needs no re-ingesting)"),
    el("label", { class: "flabel", style: "margin-top:14px" },
      "Passphrase to encrypt the file"),
    pwIn,
    el("div", { style: "margin-top:8px" }, pwAgain),
    el("p", { class: "sec-hint", style: "margin:6px 0 0" },
      "The archive is encrypted with this. It cannot be recovered \u2014 lose it "
      + "and the backup is unreadable, which is the point. Store it with your "
      + "other secrets, not beside the file."),
    el("div", { style: "margin-top:14px" }, exportBtn),
    isRoot()
      ? el("div", { style: "margin-top:12px;padding:10px 12px;border-radius:var(--radius-md);"
                  + "font-size:12.5px;line-height:1.5;"
                  + "background:color-mix(in srgb,var(--color-warn,#c98a00) 14%,transparent)" },
          "A root backup contains staff password hashes and customer contact "
          + "details. Treat the file like a password database \u2014 anyone holding "
          + "it can attempt to crack account passwords offline.")
      : null);

  if (!isRoot()) {
    return [
      el("h1", {}, "Backup"),
      el("p", { class: "lede" },
        "Take a copy of everything, so nothing has to be rebuilt or "
        + "re-ingested. Restoring is a root-only action."),
      exportCard,
    ];
  }

  // ---- restore, root only ----
  const fileIn = el("input", { type: "file", accept: ".gobk,.zip", class: "input" });
  const rPw = el("input", { class: "input", type: "password",
                            placeholder: "Passphrase for this backup",
                            autocomplete: "off" });
  const info = el("div", { style: "margin-top:12px" });
  const rAccounts = el("input", { type: "checkbox" });
  const rDocs = el("input", { type: "checkbox" }); rDocs.checked = true;
  const rIndex = el("input", { type: "checkbox" }); rIndex.checked = true;
  const rConvo = el("input", { type: "checkbox" }); rConvo.checked = true;
  let picked = null;

  const restoreBtn = el("button", { class: "btn btn-primary", disabled: "true" },
                        "Restore from this file");

  fileIn.addEventListener("change", async () => {
    info.innerHTML = ""; picked = null; restoreBtn.disabled = true;
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;
    const fd = new FormData(); fd.append("file", f);
    if (rPw.value) fd.append("passphrase", rPw.value);
    try {
      // Inspected before anything is offered: nobody should agree to a
      // restore without seeing what the file actually holds. A sealed file
      // still identifies itself without its passphrase, so this works
      // before one has been typed.
      const r = await api("/admin/backup/inspect", { method: "POST", body: fd });
      picked = f;
      const m = r.manifest, inc = m.includes || {}, c = m.counts || {};
      info.append(el("div", { class: "card elev-sm", style: "padding:12px 14px;gap:0" },
        el("div", { style: "font-size:13px" },
          el("b", {}, "Made " + shortDate(m.created_at)),
          m.created_by ? el("span", { class: "sec-hint" }, " by " + m.created_by) : null),
        el("div", { class: "sec-hint", style: "margin-top:6px" },
          [inc.accounts ? "accounts + limits" : null,
           (c.documents || 0) + " documents",
           (c.index_files || 0) + " index files",
           (c.stores || 0) + " settings files"].filter(Boolean).join(" \u00b7 ")),
        m.sensitive
          ? el("div", { class: "sec-hint", style: "margin-top:6px;color:var(--color-warn,#c98a00)" },
              "Contains password hashes and customer details.")
          : null,
        r.passphrase_required
          ? el("div", { class: "sec-hint", style: "margin-top:6px" },
              "Encrypted \u2014 enter its passphrase below to restore.")
          : null));
      rAccounts.disabled = !inc.accounts;
      restoreBtn.disabled = false;
    } catch (e) {
      info.append(el("div", { class: "sec-hint", style: "color:#b3261e" }, e.message));
    }
  });

  restoreBtn.onclick = async () => {
    if (!picked) return;
    if (!confirm("Restore from this file? It overwrites what is here now.\n\n"
      + "A snapshot of the current state is saved first, so this can be undone."))
      return;
    if (rAccounts.checked && !confirm(
      "You also chose to restore ACCOUNTS.\n\nIf your own account is not in "
      + "that backup you will be signed out and unable to sign back in, and "
      + "would have to use manage_accounts.py on the server. Continue?"))
      return;
    restoreBtn.disabled = true; restoreBtn.textContent = "Restoring\u2026";
    const fd = new FormData(); fd.append("file", picked);
    if (rPw.value) fd.append("passphrase", rPw.value);
    const qs = "?restore_accounts=" + rAccounts.checked
             + "&restore_documents=" + rDocs.checked
             + "&restore_index=" + rIndex.checked
             + "&restore_conversations=" + rConvo.checked;
    try {
      const r = await api("/admin/backup/import" + qs, { method: "POST", body: fd });
      let msg = "Restored. ";
      if (r.restart_required) msg += "Restart the server for the search index to load. ";
      if ((r.skipped || []).length) msg += "Skipped: " + r.skipped.join(", ") + ".";
      toast(msg);
      info.append(el("div", { class: "sec-hint", style: "margin-top:8px" },
        "Snapshot of the previous state: " + (r.safety_snapshot || "not written")
        + " in " + r.safety_snapshot_dir));
      if (rAccounts.checked) signOut("Accounts were restored \u2014 sign in again");
    } catch (e) { toast(e.message, true); }
    finally { restoreBtn.disabled = false; restoreBtn.textContent = "Restore from this file"; }
  };

  const opt = (box, label) =>
    el("label", { style: "display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;cursor:pointer" },
      box, label);

  const importCard = el("div", { class: "card elev-sm",
      style: "padding:18px 20px;gap:0", "data-sec": "Restore",
      "data-tour": "backup-import" },
    el("h3", {}, "Restore from a backup"),
    el("p", { class: "sec-hint" },
      "Overwrites what is here now. A snapshot of the current state is taken "
      + "first, automatically, so a bad restore can be undone."),
    el("div", { style: "margin-top:12px" }, fileIn),
    info,
    el("label", { class: "flabel", style: "margin-top:12px" },
      "Passphrase (for an encrypted backup)"),
    rPw,
    opt(rDocs, "Restore the documents"),
    opt(rIndex, "Restore the search index (avoids re-ingesting)"),
    opt(rConvo, "Restore saved conversations"),
    opt(rAccounts, "Restore accounts and limits \u2014 signs you out"),
    el("div", { style: "margin-top:14px" }, restoreBtn));

  return [
    el("h1", {}, "Backup"),
    el("p", { class: "lede" },
      "Take a copy of everything, so nothing has to be rebuilt or re-ingested. "
      + "Anyone from support up can download one; only root can restore."),
    exportCard,
    importCard,
  ];
}

/* ---------------- access & limits (root only) ---------------- */
let polCache = null;

async function loadPolicy() {
  try { polCache = await api("/admin/policy"); }
  catch (e) { polCache = { policy: {}, error: e.message }; }
  render();
}

function viewPolicy() {
  if (!polCache) { loadPolicy(); return [el("h1", {}, "Access & limits"),
    el("p", { class: "lede" }, "Loading\u2026")]; }
  if (polCache.error) return [el("h1", {}, "Access & limits"),
    el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
      el("b", {}, "Could not load settings"), polCache.error))];

  // Staged locally; nothing is applied until Save, so a half-typed number
  // never becomes a live limit.
  const p = Object.assign({}, polCache.policy);

  const mk = [];
  const numRow = (key, label, hint, unit) => {
    const inp = el("input", { class: "input", type: "number", min: "0",
                              value: String(p[key] === undefined ? 0 : p[key]),
                              style: "max-width:140px" });
    inp.addEventListener("input", () => { p[key] = inp.value; });
    mk.push(el("div", { class: "item", style: "align-items:flex-start" },
      el("div", { style: "flex:1 1 260px" },
        el("div", { style: "font-size:13.5px" }, label),
        el("div", { style: "font-size:12px;margin-top:2px;color:color-mix(in srgb,var(--color-text) 55%,transparent)" }, hint)),
      el("div", { style: "flex:0 0 auto;display:flex;align-items:center;gap:8px" },
        inp,
        el("span", { style: "font-size:12px;color:color-mix(in srgb,var(--color-text) 50%,transparent)" }, unit || ""))));
  };

  const anonWarn = el("div", {
    style: "margin-top:10px;padding:10px 12px;border-radius:var(--radius-md);"
         + "font-size:12.5px;line-height:1.5;"
         + "background:color-mix(in srgb,var(--color-warn,#c98a00) 14%,transparent);"
         + "display:" + (p.anon_llm_enabled ? "" : "none") },
    "With this on, anyone on the internet can spend model credits without an "
    + "account. That is a real bill and a real prompt-injection surface \u2014 the "
    + "guest allowance below is the only thing bounding it. Keep it small.");

  const anonToggle = el("input", { type: "checkbox" });
  anonToggle.checked = !!p.anon_llm_enabled;
  anonToggle.addEventListener("change", () => {
    p.anon_llm_enabled = anonToggle.checked;
    anonWarn.style.display = anonToggle.checked ? "" : "none";
  });

  const notice = el("textarea", { class: "input", rows: "2" }, p.anon_notice || "");
  notice.addEventListener("input", () => { p.anon_notice = notice.value; });

  const guestCard = el("div", { class: "card elev-sm",
                                style: "padding:18px 20px;gap:0;margin-bottom:14px",
                                "data-sec": "Guest access", "data-tour": "pol-guest" },
    el("h3", {}, "Visitors without an account"),
    el("p", { class: "sec-hint" },
      "By default guests get the reviewed FAQs only, and no model call is "
      + "reachable without an account. That is what keeps public cost and "
      + "prompt-injection exposure at zero."),
    el("label", { style: "display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;cursor:pointer" },
      anonToggle, "Let guests use AI answers"),
    anonWarn,
    el("label", { class: "flabel", style: "margin-top:14px" },
      "What guests are told when AI is account-only"),
    notice);

  numRow("anon_llm_credits", "Guest daily allowance",
         "Only used when guest AI is switched on above. Small on purpose.", "credits/day");
  numRow("anon_faq_daily", "Guest FAQ lookups",
         "Ceiling on reviewed-answer lookups. No model involved, so this can be generous.", "per day");
  numRow("anon_ip_daily", "Guest ceiling per IP",
         "Counted per address as well as per browser, so clearing cookies does not mint a fresh allowance.", "per day");
  const guestLimits = el("div", { class: "card elev-sm",
                                  style: "padding:18px 20px;gap:0;margin-bottom:14px",
                                  "data-sec": "Guest limits" },
    el("h3", {}, "Guest limits"), mk.splice(0, 3));

  numRow("member_daily_credits", "Customer allowance",
         "Credits a signed-in customer may spend each day. A standard answer costs 1, a detailed one 4.", "credits/day");
  numRow("staff_daily_credits", "Staff allowance",
         "For tokens issued to your own team.", "credits/day");
  const acctCard = el("div", { class: "card elev-sm",
                               style: "padding:18px 20px;gap:0;margin-bottom:14px",
                               "data-sec": "Account holders" },
    el("h3", {}, "Account holders"), mk.splice(0, 2));

  numRow("questions_per_session", "Questions per conversation",
         "0 means no limit. Bounds one sitting, so a single runaway thread cannot spend a whole day of allowance.", "questions");
  numRow("tokens_per_session", "Tokens per conversation",
         "0 means no limit. Counted from what the provider actually reports.", "tokens");
  const sessCard = el("div", { class: "card elev-sm",
                               style: "padding:18px 20px;gap:0;margin-bottom:14px",
                               "data-sec": "Per conversation", "data-tour": "pol-session" },
    el("h3", {}, "Per conversation"),
    el("p", { class: "sec-hint" },
      "Separate from the daily allowances above: these bound a single chat. "
      + "A session id comes from the visitor's browser, so treat these as a "
      + "cost guard rather than a hard boundary \u2014 the daily and per-IP "
      + "ceilings are what really bound a determined caller."),
    mk.splice(0, 2));

  const saveBtn = el("button", { class: "btn btn-primary", onclick: async () => {
    saveBtn.disabled = true; saveBtn.textContent = "Saving\u2026";
    try {
      await api("/admin/policy", { method: "PUT",
        body: JSON.stringify({ changes: p }) });
      toast("Saved \u2014 applies to the next request, no restart");
      polCache = null;
      await loadPolicy();
    } catch (e) { toast(e.message, true); }
    finally { saveBtn.disabled = false; saveBtn.textContent = "Save changes"; }
  } }, "Save changes");

  // \u2500\u2500 One caller, unstuck right now \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  // The limits above change the ceiling for everyone, going forward. This
  // clears one caller's usage back to zero immediately, for the visitor
  // who is stuck mid-conversation right now and does not want to wait for
  // the daily window (or the per-conversation cap) to roll over.
  const sessIn = el("input", { class: "input", placeholder: "Session ID" });
  const sessBtn = el("button", { class: "btn btn-secondary", onclick: async () => {
    const v = sessIn.value.trim();
    if (!v) return toast("Paste the conversation's session ID first", true);
    try {
      await api("/admin/quota/reset", { method: "POST",
        body: JSON.stringify({ session_id: v }) });
      toast("Conversation limit cleared \u2014 they can carry on now");
      sessIn.value = "";
    } catch (e) { toast(e.message, true); }
  } }, "Reset conversation");

  const uidIn = el("input", { class: "input", placeholder: "Account ID (uid)" });
  const uidBtn = el("button", { class: "btn btn-secondary", onclick: async () => {
    const v = uidIn.value.trim();
    if (!v) return toast("Enter the account's uid first", true);
    try {
      await api("/admin/quota/reset", { method: "POST",
        body: JSON.stringify({ uid: v }) });
      toast("Daily allowance cleared for that account");
      uidIn.value = "";
    } catch (e) { toast(e.message, true); }
  } }, "Reset account");

  const visIn = el("input", { class: "input", placeholder: "Visitor ID" });
  const ipIn = el("input", { class: "input", placeholder: "IP address (if known)" });
  const visBtn = el("button", { class: "btn btn-secondary", onclick: async () => {
    const v = visIn.value.trim();
    if (!v) return toast("Enter the visitor ID first", true);
    try {
      await api("/admin/quota/reset", { method: "POST",
        body: JSON.stringify({ visitor_id: v, client_ip: ipIn.value.trim() }) });
      toast("Daily allowance cleared for that guest");
      visIn.value = ""; ipIn.value = "";
    } catch (e) { toast(e.message, true); }
  } }, "Reset guest");

  const resetCard = el("div", { class: "card elev-sm",
                               style: "padding:18px 20px;gap:0;margin-bottom:14px",
                               "data-sec": "Reset one caller" },
    el("h3", {}, "Unstick one caller"),
    el("p", { class: "sec-hint" },
      "Clears one caller's usage back to zero immediately, without waiting "
      + "for the daily window or the per-conversation cap to roll over. IDs "
      + "come from a support ticket, the browser console, or the widget's "
      + "own quota_exceeded error \u2014 not something to guess at."),
    el("div", { class: "item", style: "align-items:flex-start;margin-top:12px" },
      el("div", { style: "flex:1 1 260px" },
        el("div", { style: "font-size:13.5px" }, "By conversation"),
        el("div", { style: "font-size:12px;margin-top:2px;color:color-mix(in srgb,var(--color-text) 55%,transparent)" },
          "Clears the per-conversation question/token cap for one session id.")),
      el("div", { style: "flex:0 0 auto;display:flex;gap:8px" }, sessIn, sessBtn)),
    el("div", { class: "item", style: "align-items:flex-start" },
      el("div", { style: "flex:1 1 260px" },
        el("div", { style: "font-size:13.5px" }, "By account"),
        el("div", { style: "font-size:12px;margin-top:2px;color:color-mix(in srgb,var(--color-text) 55%,transparent)" },
          "Clears a signed-in customer or staff member's daily credits.")),
      el("div", { style: "flex:0 0 auto;display:flex;gap:8px" }, uidIn, uidBtn)),
    el("div", { class: "item", style: "align-items:flex-start" },
      el("div", { style: "flex:1 1 260px" },
        el("div", { style: "font-size:13.5px" }, "By guest"),
        el("div", { style: "font-size:12px;margin-top:2px;color:color-mix(in srgb,var(--color-text) 55%,transparent)" },
          "Clears an anonymous visitor's daily credits and FAQ lookups. The IP is optional but "
          + "needed to also clear their per-IP ceiling \u2014 without it only their own allowance is reset.")),
      el("div", { style: "flex:0 0 auto;display:flex;gap:8px;flex-wrap:wrap" }, visIn, ipIn, visBtn)));

  return [
    el("h1", {}, "Access & limits"),
    el("p", { class: "lede" },
      "Who may use the assistant and how much of it. Changes apply on the "
      + "next request \u2014 no restart. Only root accounts see this page."),
    guestCard, guestLimits, acctCard, sessCard,
    el("div", { style: "display:flex;gap:8px;align-items:center" },
      saveBtn,
      el("button", { class: "btn btn-ghost", onclick: async () => {
        if (!confirm("Put every limit back to its installed default?")) return;
        try {
          await api("/admin/policy/reset", { method: "POST" });
          toast("Reset to defaults");
          polCache = null; await loadPolicy();
        } catch (e) { toast(e.message, true); }
      } }, "Reset to defaults")),
    resetCard,
  ];
}

/* ---------------- advanced (root only) ---------------- */
// Everything here changes HOW an answer is produced or verified, rather than
// who may ask. Each switch is written for someone who has to decide whether
// to flip it at 4pm with a customer waiting, so the hint says what happens
// and what it costs -- not what the code does.
function viewAdvanced() {
  if (!polCache) { loadPolicy(); return [el("h1", {}, "Advanced"),
    el("p", { class: "lede" }, "Loading…")]; }
  if (polCache.error) return [el("h1", {}, "Advanced"),
    el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
      el("b", {}, "Could not load settings"), polCache.error))];

  const p = Object.assign({}, polCache.policy);

  const card = (title, hint, ...rows) =>
    el("div", { class: "card elev-sm",
                style: "padding:18px 20px;gap:0;margin-bottom:14px",
                "data-sec": title },
      el("h3", {}, title),
      hint ? el("p", { class: "sec-hint" }, hint) : null,
      rows);

  const hintLine = t => el("div", { style: "font-size:12px;margin-top:4px;"
    + "color:color-mix(in srgb,var(--color-text) 55%,transparent)" }, t);

  const toggleRow = (key, label, hint) => {
    const box = el("input", { type: "checkbox" });
    box.checked = !!p[key];
    box.addEventListener("change", () => { p[key] = box.checked; });
    return el("div", { style: "margin-top:14px" },
      el("label", { style: "display:flex;align-items:center;gap:8px;"
        + "font-size:13.5px;cursor:pointer" }, box, label),
      hintLine(hint));
  };

  const numRow = (key, label, hint, unit, max) => {
    const inp = el("input", { class: "input", type: "number", min: "0",
      max: String(max), value: String(p[key] === undefined ? 0 : p[key]),
      style: "max-width:110px" });
    inp.addEventListener("input", () => { p[key] = inp.value; });
    return el("div", { class: "item", style: "align-items:flex-start;margin-top:14px" },
      el("div", { style: "flex:1 1 260px" },
        el("div", { style: "font-size:13.5px" }, label), hintLine(hint)),
      el("div", { style: "flex:0 0 auto;display:flex;align-items:center;gap:8px" },
        inp, el("span", { style: "font-size:12px;color:color-mix(in srgb,"
          + "var(--color-text) 50%,transparent)" }, unit || "")));
  };

  // ── verification ──
  const verifyCard = card("Checking answers before they are sent",
    "Every answer is checked against the documents it came from, and held "
    + "back if it cannot be verified. That protects customers from confident "
    + "wrong answers — but the checker is strict about tables, and most "
    + "of these manuals keep their facts in tables.",
    toggleRow("llm_verify", "Second opinion on held-back answers",
      "When the first check cannot verify an answer, ask the AI to read the "
      + "page and decide. Measured on 57 questions: 68% answered without "
      + "this, 96% with it, and nothing wrong slipped through. Costs one "
      + "extra AI call, but only for answers that would otherwise be "
      + "refused — in testing it was slightly faster overall, because "
      + "fewer answers fall through to retrying."),
    numRow("grounding_retries", "Retries before giving up",
      "If an answer cannot be verified, write it again and re-check. Useful "
      + "because the same question sometimes verifies on a second attempt. "
      + "Each retry is a full AI call, so keep it low — 1 is plenty "
      + "with the second opinion switched on. 0 means never retry.",
      "attempts", 5));

  // ── sales ──
  const salesReply = el("textarea", { class: "input", rows: "3" },
                        p.sales_reply || "");
  salesReply.addEventListener("input", () => { p.sales_reply = salesReply.value; });
  const salesReplyWrap = el("div", { style: "margin-top:14px;display:"
      + (p.sales_mode === "deflect" ? "" : "none") },
    el("label", { class: "flabel" }, "What a sales question is answered with"),
    salesReply,
    hintLine("Shown on its own, word for word, so put the phone number or "
      + "address you want people to use directly in the text."));
  const salesSel = el("select", { class: "input", onchange: e => {
      p.sales_mode = e.target.value;
      salesReplyWrap.style.display = e.target.value === "deflect" ? "" : "none";
    } },
    el("option", { value: "answer" }, "Answer them from the product list"),
    el("option", { value: "deflect" }, "Reply with a fixed message"),
    el("option", { value: "documents" }, "Treat them as ordinary questions"));
  salesSel.value = p.sales_mode || "answer";

  const salesCard = card("Sales questions",
    "Questions that span the whole range rather than one product — "
    + "“which products run on 24V?”, “do you have anything "
    + "that sorts coins?”. Answering from the product list is safe "
    + "(every name and figure is copied, never invented), but a fixed reply "
    + "hands every sales enquiry to a person instead.",
    el("label", { class: "flabel", style: "margin-top:14px" }, "How to handle them"),
    salesSel, salesReplyWrap,
    hintLine("To answer from a brochure or price list instead, upload it on "
      + "the Documents page and attach it to a product — it is then "
      + "searched like any other manual, whichever option is chosen here."));

  // ── indexing ──
  const indexCard = card("Reading uploaded documents",
    "How a PDF is broken up when it is uploaded. These affect documents "
    + "uploaded from now on — existing ones keep the settings they were "
    + "uploaded with.",
    toggleRow("dedupe_shadowed_chunks", "Drop duplicate scraps of a page",
      "When a page introduces a table, the sentence above the table often "
      + "gets stored twice — once on its own, once with the table. The "
      + "copy without the table matches the question but holds none of the "
      + "answer, and can crowd out the copy that does. Leaving this on "
      + "discards it; nothing is lost, because every word is still in the "
      + "copy that kept the table."));

  const saveBtn = el("button", { class: "btn btn-primary", onclick: async () => {
    saveBtn.disabled = true; saveBtn.textContent = "Saving…";
    try {
      await api("/admin/policy", { method: "PUT",
        body: JSON.stringify({ changes: p }) });
      toast("Saved — applies to the next question, no restart");
      polCache = null; await loadPolicy();
    } catch (e) { toast(e.message, true); }
    finally { saveBtn.disabled = false; saveBtn.textContent = "Save changes"; }
  } }, "Save changes");

  return [
    el("h1", {}, "Advanced"),
    el("p", { class: "lede" },
      "How answers are produced and checked. Changes apply to the next "
      + "question — no restart. Only root accounts see this page."),
    verifyCard, salesCard, indexCard, saveBtn,
  ];
}

/* ---------------- API keys (root only) ---------------- */
// Not held in `cache` for the same reason acctCache isn't: refresh() runs
// for every staff account on every render, and this is root-only.
let keysCache = null;

async function loadKeys() {
  try { keysCache = await api("/admin/keys"); }
  catch (e) { keysCache = { providers: [], error: e.message }; }
  render();
}

function viewKeys() {
  if (!keysCache) { loadKeys(); return [el("h1", {}, "API keys"),
    el("p", { class: "lede" }, "Loading…")]; }
  if (keysCache.error) return [el("h1", {}, "API keys"),
    el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
      el("b", {}, "Could not load key status"), keysCache.error))];

  const rows = keysCache.providers.map(p => {
    const input = el("input", { class: "input", type: "password",
      placeholder: p.configured ? "Enter a new key to replace it" : "Paste the key",
      autocomplete: "new-password" });

    const save = async () => {
      const v = input.value.trim();
      if (!v) return toast("Paste a key first", true);
      try {
        await api("/admin/keys/" + p.key, { method: "POST",
          body: JSON.stringify({ value: v }) });
        toast(p.label + " key saved — usable immediately, no restart needed");
        keysCache = null;
        await loadKeys();
      } catch (e) { toast(e.message, true); }
    };

    const clear = async () => {
      if (!confirm("Remove the " + p.label + " key? Anything set to use "
        + p.label + " will fall back to whatever else is configured.")) return;
      try {
        await api("/admin/keys/" + p.key, { method: "DELETE" });
        toast(p.label + " key removed");
        keysCache = null;
        await loadKeys();
      } catch (e) { toast(e.message, true); }
    };

    input.addEventListener("keydown", e => { if (e.key === "Enter") save(); });

    return el("div", { class: "card elev-sm",
                       style: "padding:14px 18px;gap:0;margin-bottom:10px" },
      el("div", { style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap" },
        el("b", {}, p.label),
        p.configured
          ? el("span", { class: "tag tag-accent" }, "configured")
          : el("span", { class: "tag tag-neutral" }, "not set"),
        p.masked ? el("span", { class: "mono", style: "font-size:12px;"
          + "color:color-mix(in srgb,var(--color-text) 55%,transparent)" }, p.masked) : null),
      el("div", { class: "row", style: "margin-top:10px" },
        el("div", { class: "grow" }, input),
        el("div", { style: "flex:0 0 auto;display:flex;gap:6px" },
          el("button", { class: "btn btn-primary", onclick: save }, "Save"),
          p.configured
            ? el("button", { class: "btn btn-ghost", onclick: clear }, "Remove")
            : null)));
  });

  return [
    el("h1", {}, "API keys"),
    el("p", { class: "lede" },
      "Keys for the online answer providers. Saved keys take effect "
      + "immediately — no restart — and only root accounts can see this "
      + "page or the keys' status. A key is never shown again once saved, "
      + "only a masked form for recognising it."),
    el("div", { "data-sec": "Providers", "data-tour": "keys-list" }, rows),
  ];
}

/* ---------------- overview ---------------- */
function viewOverview() {
  const prods = products(), un = unassigned(), ans = answered();

  const stat = (label, value, tone) =>
    el("div", { class: tone || "" }, el("div", { class: "lbl" }, label), el("b", {}, String(value)));

  const step = (state, title, desc, actions) =>
    el("div", { class: "step" },
      el("div", { class: "mark-dot " + state }, state === "done" ? "\u2713" : state === "todo" ? "!" : "\u00b7"),
      el("div", { class: "step-b" },
        el("b", {}, title), el("p", {}, desc),
        actions && actions.length ? el("div", { class: "acts" }, actions) : null));

  const goTo = (id, label, primary) =>
    el("button", { class: "btn " + (primary ? "btn-primary" : "btn-secondary"), style: "font-size:12.5px;padding:4px 10px",
                   onclick: () => { view = id; render(); } }, label);

  const steps = [];

  steps.push(prods.length
    ? step("done", "Products are set up",
        prods.length + " product" + (prods.length === 1 ? "" : "s") +
        " across " + cache.catalog.length + " range" + (cache.catalog.length === 1 ? "" : "s") + ".",
