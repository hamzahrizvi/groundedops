    { ref: "cat-range", title: "Start with a range",
      text: "A range is a family of products \u2014 Coin hoppers, Note validators. It is the first thing a visitor picks in the widget." },
    { ref: "cat-product", title: "Then add products",
      text: "Every product added here becomes something the widget can be asked about, and something a document can be filed against." },
    { ref: "cat-list", title: "Your catalogue",
      text: "Each range with its products, and how many documents back each one. A product with no documents cannot be answered about." },
  ],
  widget: [
    { ref: "wd-preview", title: "Live preview",
      text: "Exactly what a visitor sees. Every change on this page updates it as you type." },
    { ref: "wd-branding", title: "Branding",
      text: "Name the assistant, write its greeting, and pick the accent colour used through the widget." },
    { ref: "wd-options", title: "Opening options",
      text: "The buttons a visitor is offered first. If you offer \u201cTalk to sales\u201d or \u201cTalk to support\u201d, set up what that form asks for." },
  ],
  leads: [
    { ref: "leads-list", title: "Enquiries arrive here and nowhere else",
      text: "The sales and support forms visitors submit. Nothing is emailed out, so this console is the only place they land \u2014 worth building a habit of checking." },
  ],
  test: [
    { ref: "test-widget", title: "The actual widget, not a copy of it",
      text: "This is the same file customers load, on a stand-in page, reading the same Widget design settings. Change the branding, opening options or the sales/support forms and they change here too — hit Reload after saving. Submitting a form here creates a real enquiry, so you can check the whole path end to end." },
    { ref: "test-chat", title: "Comparing models",
      text: "A separate tool: asks the pipeline directly and lets you force a provider or model. The widget never does that — the server picks the model so a browser cannot choose an expensive one — so treat this as a bench test, not as what a visitor gets." },
  ],
};

let tourOn = false, tourStep = 0, tourSteps = [];
let tourPop = null, tourHi = null, tourKeys = null, tourReflow = null;

const tourTarget = ref => document.querySelector('[data-tour="' + ref + '"]');

function startTour() {
  const live = (tourStepsByView[view] || []).filter(s => tourTarget(s.ref));
  if (!live.length) return toast("No walkthrough for this page yet");
  endTour();
  tourSteps = live; tourOn = true; tourStep = 0;

  tourKeys = e => {
    if (!tourOn) return;
    if (e.key === "Escape") endTour();
    else if (e.key === "ArrowRight") tourGo(1);
    else if (e.key === "ArrowLeft") tourGo(-1);
  };
  document.addEventListener("keydown", tourKeys);

  // .main is the scroll container, not the window, so the popover has to
  // follow its scroll to stay beside the element it points at.
  tourReflow = () => { if (tourOn) placeTour(); };
  window.addEventListener("resize", tourReflow);
  const main = document.querySelector(".main");
  if (main) main.addEventListener("scroll", tourReflow);

  drawTour();
}

function endTour() {
  tourOn = false; tourStep = 0; tourSteps = [];
  if (tourPop) { tourPop.remove(); tourPop = null; }
  if (tourHi) { tourHi.classList.remove("tour-hi"); tourHi = null; }
  if (tourKeys) { document.removeEventListener("keydown", tourKeys); tourKeys = null; }
  if (tourReflow) {
    window.removeEventListener("resize", tourReflow);
    const main = document.querySelector(".main");
    if (main) main.removeEventListener("scroll", tourReflow);
    tourReflow = null;
  }
}

function tourGo(delta) {
  if (!tourOn) return;
  const n = tourStep + delta;
  if (n < 0) return;
  if (n >= tourSteps.length) return endTour();
  tourStep = n; drawTour();
}

function drawTour() {
  const s = tourSteps[tourStep];
  if (!s) return endTour();

  if (tourHi) tourHi.classList.remove("tour-hi");
  tourHi = tourTarget(s.ref);
  if (!tourHi) return endTour();
  tourHi.classList.add("tour-hi");
  tourHi.scrollIntoView({ behavior: "smooth", block: "center" });

  const last = tourStep === tourSteps.length - 1;
  if (tourPop) tourPop.remove();
  tourPop = el("div", { class: "tour-pop", role: "dialog", "aria-label": "Walkthrough" },
    el("div", { class: "step mono" }, "Step " + (tourStep + 1) + " of " + tourSteps.length),
    el("div", { class: "tt" }, s.title),
    el("div", { class: "tx" }, s.text),
    el("div", { class: "acts" },
      el("button", { class: "btn btn-ghost", onclick: endTour }, "Skip"),
      el("div", { style: "display:flex;gap:8px" },
        el("button", { class: "btn btn-secondary", disabled: tourStep === 0 ? "true" : null,
                       onclick: () => tourGo(-1) }, "Back"),
        el("button", { class: "btn btn-primary", onclick: () => tourGo(1) }, last ? "Done" : "Next"))));
  document.body.append(tourPop);
  placeTour();
}

// Beside the highlighted element, per the design, flipped to its other side
// when there is no room -- so the popover never lands on top of the thing it
// is describing.
function placeTour() {
  if (!tourPop || !tourHi) return;
  const r = tourHi.getBoundingClientRect();
  const w = tourPop.offsetWidth || 300, h = tourPop.offsetHeight || 190;
  const gap = 16, pad = 12;

  let left = r.right + gap;
  if (left + w + pad > window.innerWidth) {
    left = r.left - gap - w;
    if (left < pad) left = Math.max(pad, window.innerWidth - w - pad);
  }
  const top = Math.max(pad, Math.min(r.top, window.innerHeight - h - pad));

  tourPop.style.left = Math.round(left) + "px";
  tourPop.style.top = Math.round(top) + "px";
}


/* ---------------- boot ---------------- */
(async () => {
  // Re-establish who the held token belongs to rather than trusting the
  // cached copy: a level change made by root while this tab sat open must
  // take effect on reload, not whenever the token expires.
  if (tok) {
    try {
      me = (await api("/admin/auth/me")).user;
      sessionStorage.setItem("go_admin_me", JSON.stringify(me));
      if (isStaff()) await refresh();
    } catch (e) { tok = ""; me = null; }
  }
  render();
})();
</script>
