        f.fields.push({ id: uid(), label: "New field", type: "text", required: false });
        draw();
      } }, "Add field"),
      el("label", { style: "display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:14px;cursor:pointer" },
        summ, "Let the visitor attach a summary of their chat"),
      el("label", { style: "display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;cursor:pointer" },
        ccIn, "Copy the visitor in on the reply"),
      el("div", { style: "margin-top:12px" },
        el("label", { class: "flabel" }, "Phone number to offer"),
        phoneIn,
        el("p", { class: "sec-hint", style: "margin:6px 0 0" },
          "Optional, and shown to visitors \u2014 unlike the address below. The "
          + "assistant offers it by name when it cannot answer something, so "
          + "someone who would rather call is not left filling in a form.")),
      el("div", { style: "margin-top:12px" },
        el("label", { class: "flabel" }, "Send to"), notify,
        notifyWarn,
        el("p", { class: "sec-hint", style: "margin:6px 0 0" },
          "Where this form's submissions belong. \u26a0 Not emailed yet \u2014 there is no mail server configured, so enquiries are collected under Enquiries in this console and this address is stored ready for when sending is wired up. It is never shown to visitors.")));
  }

  /* Builds the WordPress plugin zip with this deployment's backend address
     already in it, so nobody has to hand-edit wp-config.php and get the
     secret subtly wrong. Branding is NOT in the zip -- it is fetched at page
     load -- so a colour change never needs a re-export. */
  const installCard = () => {
    // The console is served by the backend, so its own origin is the address
    // the widget should call. Wrong only when the widget API is published on
    // a different hostname, which is why it stays editable -- and wrong in
    // one very common local-dev case: a run.cmd Cloudflare quick tunnel
    // makes the console reachable over the LAN while the address the WIDGET
    // needs is the tunnel's, and those are two different hostnames. That is
    // what detectUrl below is for.
    const urlIn = el("input", { class: "input", value: location.origin,
                                placeholder: "https://support.yourcompany.com" });
    const detectHint = el("div", { style: "font-size:11.5px;margin-top:6px;"
                                        + "color:color-mix(in srgb,var(--color-text) 50%,transparent)" });
    const secretCb = el("input", { type: "checkbox", disabled: !isRoot() });
    const dlBtn = el("button", { class: "btn btn-primary" }, "Download plugin zip");

    const fmtAge = (s) => s == null ? "" :
      s < 5 ? " — just started" :
      s < 120 ? ` — started ${s}s ago` :
      ` — started ${Math.round(s / 60)}m ago`;

    // auto=true only overwrites the field while it still holds the plain
    // page-origin default, so an admin who has already typed (or already
    // been auto-filled once) is never silently overwritten a second time by
    // a later poll or by re-opening this page.
    const detectUrl = async (auto) => {
      try {
        const r = await api("/admin/widget/detect_url");
        if (r && r.url) {
          if (auto && urlIn.value === location.origin) urlIn.value = r.url;
          detectHint.textContent =
            `Detected a local run.cmd tunnel${fmtAge(r.age_seconds)} — `
            + "this address is random and changes on every restart.";
        } else if (!auto) {
          detectHint.textContent = "No local tunnel detected — using this page's own address.";
        }
      } catch (e) { /* best-effort convenience only; never block the card on it */ }
    };
    detectUrl(true);
    const redetectBtn = el("button", { class: "btn btn-ghost",
                                       style: "font-size:11px;padding:1px 8px;margin-left:8px",
                                       onclick: () => detectUrl(false) }, "Re-check");

    dlBtn.onclick = async () => {
      const withSecret = secretCb.checked;
      if (withSecret && !confirm(
          "This zip will contain the signing secret.\n\n"
        + "Anyone who has the file can impersonate a signed-in customer and "
        + "spend your API budget. Send it only to the person installing it, "
        + "over something private \u2014 not a shared drive, not a mailing list.\n\n"
        + "Continue?")) return;
      dlBtn.disabled = true; dlBtn.textContent = "Building\u2026";
      try {
        // fetch, not a plain link: the endpoint needs an auth header, and an
        // <a href> cannot carry one. Same reason as the backup download.
        const r = await fetch(API + "/admin/widget/export_plugin", {
          method: "POST",
          headers: { "x-admin-password": tok, "Content-Type": "application/json" },
          body: JSON.stringify({ api_url: urlIn.value, include_secret: withSecret }) });
        if (!r.ok) {
          let d2; try { d2 = (await r.json()).detail; } catch (e) { d2 = r.statusText; }
          throw new Error(typeof d2 === "string" ? d2 : "Export failed (" + r.status + ")");
        }
        const blob = await r.blob();
        const cd = r.headers.get("content-disposition") || "";
        const m = cd.match(/filename="([^"]+)"/);
        const url = URL.createObjectURL(blob);
        const a = el("a", { href: url, download: m ? m[1] : "groundedops-widget.zip" });
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        toast(withSecret
          ? "Downloaded \u2014 this file is a credential, share it carefully"
          : "Downloaded \u2014 safe to pass on; the installer adds the secret");
      } catch (e) { toast(e.message, true); }
      finally { dlBtn.disabled = false; dlBtn.textContent = "Download plugin zip"; }
    };

    return el("div", { class: "card elev-sm",
                       style: "padding:18px 20px;gap:0;margin-top:16px",
                       "data-sec": "Install on WordPress" },
      el("div", { class: "sec-title" }, "Install on WordPress"),
      el("div", { class: "sec-hint" },
        "Builds a plugin zip with this server's address already set. Upload it "
        + "under Plugins \u2192 Add New \u2192 Upload Plugin, and activate. The "
        + "branding above is fetched at page load, so changing it never needs a "
        + "new zip \u2014 re-export only if this address or the secret changes."),
      el("div", { style: "margin-top:10px" },
        el("label", { class: "flabel" }, "Address visitors' browsers will use"),
        urlIn,
        el("div", { style: "display:flex;align-items:baseline" }, detectHint, redetectBtn)),
      el("label", { style: "display:flex;gap:9px;align-items:flex-start;margin-top:12px;"
                         + "cursor:" + (isRoot() ? "pointer" : "default")
                         + ";opacity:" + (isRoot() ? "1" : ".55") },
        secretCb,
        el("div", {},
          el("div", { style: "font-size:13px" }, "Embed the signing secret"),
          el("div", { style: "font-size:12px;line-height:1.45;margin-top:2px;"
                           + "color:color-mix(in srgb,var(--color-text) 55%,transparent)" },
            isRoot()
              ? "Zero-config: upload and activate, nothing to edit. But the zip "
                + "then IS a credential \u2014 whoever holds it can pose as a "
                + "signed-in customer. Leave it off and the installer adds one "
                + "line to wp-config.php instead."
              : "Only a root account can embed the secret. Exported without it, "
                + "the installer adds one line to wp-config.php."))),
      el("div", { style: "margin-top:14px" }, dlBtn));
  };

  const saveBtn = el("button", { class: "btn btn-primary", onclick: async () => {
    saveBtn.disabled = true; saveBtn.textContent = "Saving\u2026";
    try {
      const saved = await api("/admin/widget/config", { method: "PUT", body: JSON.stringify(d) });
      cache.widget = saved;
      toast("Saved \u2014 the widget picks this up on its next load");
    } catch (e) { toast(e.message, true); }
    finally { saveBtn.disabled = false; saveBtn.textContent = "Save changes"; }
  } }, "Save changes");

  return [
    el("h1", {}, "Widget design"),
    el("p", { class: "lede" }, "How the widget looks and opens for a visitor. The preview updates as you type; nothing is published until you save."),
    el("div", { style: "display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start" },
      el("div", { style: "min-width:0" },
        el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                    "data-tour": "wd-branding", "data-sec": "Branding" },
          el("div", { class: "sec-title" }, "Branding"),
          el("div", { class: "sec-hint" }, "The name, greeting and accent colour used throughout the widget."),
          el("div", { class: "row" },
            el("div", {}, el("label", { class: "flabel" }, "Assistant name"), nameIn)),
          el("div", { style: "margin-top:10px" },
            el("label", { class: "flabel" }, "Welcome message"), welcomeIn),
          el("div", { style: "margin-top:10px" },
            el("label", { class: "flabel" }, "Icon URL (optional)"), iconIn),
          el("div", { style: "margin-top:12px" },
            el("label", { class: "flabel" }, "Accent colour"), swatchRow)),
        el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                    "data-tour": "wd-options", "data-sec": "Opening options" },
          el("div", { class: "sec-title" }, "Opening options"),
          el("div", { class: "sec-hint" }, "Shown as buttons on the first message. Each starts a different path."),
          optBox,
          el("button", { class: "btn btn-secondary", style: "margin-top:6px", onclick: () => {
            if (d.intro_options.length >= 6) return toast("Six options is the maximum", true);
            d.intro_options.push({ id: uid(), label: "New option", action: "general" });
            drawOpts(); drawPreview();
          } }, "Add option")),
        // Tagged so the section bar covers the whole page: an untagged card
        // stays on screen under every tab, which reads as a bug once the
        // tabs are switching pages rather than scrolling to them.
        el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:16px",
                    "data-sec": "Contact forms" },
          formCard("sales_form", "Talk to sales form",
                   "Appears in chat when a visitor picks \u201cTalk to sales\u201d."),
          formCard("support_form", "Talk to support form",
                   "Appears when a visitor picks \u201cTalk to support\u201d, or escalates an unanswered question.")),
        el("div", { style: "margin-top:18px;display:flex;gap:10px;align-items:center" },
          saveBtn,
          el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
            if (!confirm("Reset the widget design back to its defaults?")) return;
            try { await api("/admin/widget/config/reset", { method: "POST" });
                  toast("Reset to defaults"); await refresh(); render(); }
            catch (e) { toast(e.message, true); }
          } }, "Reset to defaults")),
        installCard()),
      el("div", { style: "position:sticky;top:0", "data-tour": "wd-preview" }, preview)),
  ];
}

/* ---------------- enquiries (leads) ---------------- */
function viewLeads() {
  const rows = cache.leads.length ? cache.leads.map(l => {
    const vals = Object.values(l.values || {});
    return el("div", { class: "card elev-sm", style: "padding:14px 18px;gap:0;margin-bottom:10px" +
                (l.handled ? ";opacity:.6" : "") },
      el("div", { style: "display:flex;align-items:center;gap:10px;margin-bottom:8px" },
        el("span", { class: "tag " + (l.kind === "sales" ? "tag-accent" : "tag-neutral") }, l.kind),
        l.product ? el("span", { class: "tag tag-neutral mono" }, l.product) : null,
        el("span", { style: "flex:1" }),
        el("span", { style: "font-size:11.5px;color:color-mix(in srgb,var(--color-text) 45%,transparent)" },
          shortDate(l.created_at))),
      vals.map(v => el("div", { class: "item" },
        el("div", { style: "flex:0 0 150px;font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)" }, v.label),
        el("div", { class: "grow", style: "white-space:pre-wrap;font-size:13.5px" }, v.value))),
      // The written-up enquiry. Flagged when a model drafted it, because
      // someone about to reply needs to know they are reading a summary
      // rather than the visitor's own words.
      (l.enquiry || "").trim()
        ? el("div", { style: "margin-top:10px;padding:10px 12px;border-radius:var(--radius-md);"
                           + "background:color-mix(in srgb,var(--color-text) 5%,transparent)" },
            el("div", { style: "font-size:11px;text-transform:uppercase;letter-spacing:.05em;"
                             + "margin-bottom:5px;color:color-mix(in srgb,var(--color-text) 50%,transparent)" },
              l.summary_source === "chat" ? "Summary of their chat"
                : l.summary_source === "written" ? "In their own words" : "Summary"),
            el("div", { style: "white-space:pre-wrap;font-size:13.5px;line-height:1.5" }, l.enquiry))
        : null,
      // Recorded by widget_config.add_lead so the console can be honest that
      // nothing was emailed. Says so plainly rather than letting someone
      // assume the destination address means it was delivered.
      l.notify_email
        ? el("div", { style: "margin-top:8px;font-size:11.5px;color:color-mix(in srgb,var(--color-text) 50%,transparent)" },
            l.notified ? "Emailed to " + l.notify_email
                       : "For " + l.notify_email + " — not emailed (no mail server configured yet)")
        : el("div", { style: "margin-top:8px;font-size:11.5px;color:var(--color-warn,#c98a00)" },
            "No destination set for this form — add one under Widget design"),
      (l.transcript || []).length
        ? el("details", { style: "margin-top:10px" },
            el("summary", { style: "cursor:pointer;font-size:12.5px;color:var(--color-accent-ink)" },
              "Chat summary (" + l.transcript.length + " messages)"),
            el("div", { style: "margin-top:8px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;color:color-mix(in srgb,var(--color-text) 70%,transparent)" },
              l.transcript.map(t => (t.role === "user" || t.q ? "Visitor: " : "Assistant: ") +
                                    (t.text || t.q || t.a || "")).join("\n")))
        : null,
      el("div", { style: "margin-top:12px;display:flex;gap:8px" },
        el("button", { class: "btn btn-secondary", style: "font-size:12.5px;padding:5px 11px", onclick: async () => {
          try { await api("/admin/leads/" + l.id + "/handled?handled=" + (!l.handled),
                          { method: "POST" });

// Product champion: who owns this product's unanswered questions, and how
// often they hear about them.
//
// The person is picked from existing console accounts rather than typed. A
// digest is a link into this console, so sending one to an address that
// cannot sign in here is a dead end, and a typed address fails silently --
// the worst kind of failure for something that runs on a schedule.
function championPicker(p) {
  const users = (acctCache && acctCache.users) || [];
  const save = async (email, digest) => {
    try {
      await api("/admin/product/champion", { method: "POST", body: JSON.stringify({
        product_key: p.key, email, digest }) });
      toast(email ? "Champion set" : "Champion cleared");
      await refresh(); render();
    } catch (e) { toast(e.message, true); }
  };

  const who = el("select", { class: "input", style: "width:auto;font-size:12.5px",
    title: "Who owns this product's unanswered questions",
    onchange: () => save(who.value, who.value
                           ? (when.value === "off" ? "weekly" : when.value)
                           : "off") },
    el("option", { value: "" }, "No champion"),
    users.filter(u => !u.disabled).map(u =>
      el("option", { value: u.email, selected: u.email === p.champion ? "true" : null },
         u.name || u.email)));

  const when = el("select", { class: "input", style: "width:auto;font-size:12.5px",
    title: "How often they are sent this product's new questions",
    disabled: p.champion ? null : "true",
    onchange: () => save(p.champion || "", when.value) },
    [["off", "No updates"], ["daily", "Daily"], ["weekly", "Weekly"]].map(([v, t]) =>
      el("option", { value: v, selected: (p.digest || "off") === v ? "true" : null }, t)));

  // The account list is root-only and loaded lazily, so without this the
  // picker would render empty for a root who has not opened Accounts yet.
  if (!acctCache && isRoot()) loadAccounts();

  return el("div", { style: "display:flex;gap:6px;flex:0 0 auto;align-items:center" },
    who, when);
}

function widgetPreviewCard(withEdit) {
  const frame = el("iframe", {

         + "background:var(--color-bg-alt,#f6f7f9);display:block",

  // Guest is the default because that is what most real visitors are, and
  // it is the mode where the account-required wording and the FAQ-only
  // limits actually show up. "Signed in" needs a real widget token, minted
  // server-side and short-lived — see /admin/widget/preview_token.
  let asMember = false;
  const load = async () => {
    let qs = "?t=" + Date.now();
    if (asMember) {
      try {
        const r = await api("/admin/widget/preview_token", { method: "POST" });

      } catch (e) {

        modeBtn.textContent = MODE_GUEST;
      }

  };

  const MODE_GUEST = "Viewing as guest";
  const MODE_MEMBER = "Viewing as signed-in";
  const modeBtn = el("button", { class: "btn btn-secondary", onclick: () => {
    asMember = !asMember;
    modeBtn.textContent = asMember ? MODE_MEMBER : MODE_GUEST;

  } }, MODE_GUEST);

  const card = el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0",
                           "data-sec": "As a customer sees it",
                           "data-tour": "test-widget" },

      el("div", {},
        el("h3", {}, "As a customer sees it"),

          withEdit
            ? "Branding, opening options and the sales/support forms all come "
              + "from Widget design. Reload after saving changes there."
            : "The assistant exactly as a customer sees it.")),
      el("div", { style: "flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap" },
        // Minting a preview token needs support or above, so a basic
        // account gets the guest view only rather than a button that 403s.

          ? el("button", { class: "btn btn-ghost",

// An assistant turn: the mark, then the bubble. Returns the BUBBLE, because
// every caller goes on to append to it, and hands back the row for removal.
function aiTurn(...kids) {
  const bub = el("div", { class: "bub a" }, ...kids);
  const row = el("div", { class: "chat-row" },
    brandMark(17, "chat-av"),
    bub);
  bub._row = row;
  return bub;
}

// What the wait says while it waits. A single frozen "Checking the
// documentation" told you nothing about whether anything was still happening;
// these move, and they move in the order the pipeline actually works in --
// find the pages, read them, then check the answer against them -- so the
// line is a rough progress report rather than decoration.
const WAIT_LINES = [
  "Sifting through the documentation",
  "Finding the pages that mention this",
  "Reading the ones that look right",
  "Linking the dots",
  "Checking the tables",
  "Following a cross-reference",
  "Matching the wording to your question",
  "Weighing two possible answers",
  "Drafting an answer",
  "Checking every figure against the page it came from",
  "Making sure nothing here was invented",
  "Confirming the part numbers",
  "Re-reading the fine print",
  "Looking for anything that contradicts this",
  "Tidying the wording",
  "Nearly there",
];

function typingBubble() {
  const line = el("span", { class: "wait-line" }, WAIT_LINES[0]);
  const dots = el("span", { class: "typing" }, el("i", {}), el("i", {}), el("i", {}));
  const box = el("span", { class: "wait-box" }, line, dots);
  box.setAttribute("role", "status");
  box.setAttribute("aria-live", "polite");
  const bub = aiTurn(box);
  // Self-terminating rather than cleared by the caller: the bubble is removed
  // in several places (answered, failed, chat reset) and an interval that
  // outlives its node would keep a detached tree alive.
  let i = 0;
  const t = setInterval(() => {
    if (!bub._row.isConnected) return clearInterval(t);
    i = (i + 1) % WAIT_LINES.length;
    line.textContent = WAIT_LINES[i];
  }, 2200);
  return bub;
}

function viewTest() {
  const prods = products();
  const sel = el("select", { class: "input" }, el("option", { value: "" }, "Whole knowledge base"),
    prods.map(p => el("option", { value: p.key }, p.categoryName + " \u203a " + p.name)));
  const provSel = providerBox();
  const modelIn = linkModelBox(provSel,
    el("input", { class: "input", type: "text", placeholder: "model (optional)" }));
  const log = el("div", { class: "chat" },
    aiTurn("Ask something a customer might ask. This uses the same pipeline as the widget, so what you see here is what they would get.")._row);
  const input = el("input", { class: "input", type: "text", placeholder: "Does it need an internet connection?" });
  const sid = randId("console-");

  // /query only honors force_provider when force_model is ALSO set, so fall
  // back to the provider's current default rather than silently dropping to
  // the default chain. That default now comes from the server (see
  // providerBox) -- it was a hardcoded map here, holding a DeepSeek alias
  // that had been retired, so every forced DeepSeek call failed.
  async function send(q, opts = {}) {
    q = (q === undefined ? input.value : q).trim();
    if (!q) return;
    if (q === input.value.trim()) input.value = "";

    // Choosing or rejecting a suggestion re-asks a question the assistant
    // itself put on screen, so it is not a new turn from the visitor.
    if (!opts.silent) log.append(el("div", { class: "bub u" }, q));
    const wait = typingBubble();
    log.append(wait._row); log.scrollTop = log.scrollHeight;

    const provider = provSel.value || null;
    const model = provider ? (modelIn.value.trim() || defaultModelFor(provider) || null) : null;
    try {
      const r = await api("/query", { method: "POST", body: JSON.stringify({
        q, session_id: sid, product: sel.value || null,
        force_provider: provider, force_model: model,
        faq_id: opts.faqId || null, skip_faq: !!opts.skipFaq }) });
      wait._row.remove();
      const bub = aiTurn();
      bub.append(renderMarkdown(r.answer || "No answer"));
      if (r.sources && r.sources.length) {
        // Collapsed, to match the widget. Provenance is something you go and
        // look at, so it should not sit open under every answer -- and this
        // is the pipeline check, so what it shows should be what a customer
        // sees. <details> gives the toggle, the keyboard handling and the
        // ARIA semantics with no state to manage.
        const det = el("details", { style: "margin-top:9px" });
        det.append(el("summary", { class: "lbl", style: "cursor:pointer;user-select:none" },
                      "Sources (" + r.sources.length + ")"));
        // The document is a link, and the pages are named, so the reader can
        // go and check. download_url and page_label already come from the
        // server -- they were being flattened into plain text here.
        r.sources.forEach(s => {
          const row = el("div", { style: "font-size:12px;margin-top:3px" });
          row.append(s.download_url
            ? el("a", { href: s.download_url, target: "_blank", rel: "noopener" }, s.source)
            : el("span", {}, s.source));
          if (s.page_label) {
            row.append(el("span", { style: "color:color-mix(in srgb, var(--color-text) 55%, transparent)" },
              "  \u2014 see " + s.page_label));
          }
          det.append(row);
        });
        bub.append(det);
      }

      // The conversation window holds a fixed number of turns, after which the
      // oldest is dropped silently -- the assistant appears to forget with
      // nothing on screen to explain it. Warn as the window fills, and once at
      // it, so a fresh chat is an obvious choice rather than a discovery.
      const _turns = r.turns || 0, _limit = r.turn_limit || 20;
      if (_turns >= _limit - 3 && !log.dataset.warnedAt) {
        log.dataset.warnedAt = String(_turns);
        const note = el("div", { class: "bub a", style: "font-size:12.5px" });
        note.append(el("div", {}, r.context_full
          ? "This chat has reached its " + _limit + "-question memory. The oldest "
            + "questions are now being dropped, so earlier answers can no longer "
            + "be referred back to."
          : "Approaching this chat's " + _limit + "-question memory ("
            + _turns + " of " + _limit + "). After that, the earliest questions "
            + "start dropping out."));
        note.append(el("div", { style: "margin-top:8px" },
          el("button", { class: "btn btn-secondary", style: BTN, onclick: () => {
            view = "test"; render();
          } }, "Start a new chat")));
        log.append(note);
      }
      // A refusal with no next step is a dead end. Offer the human.
      if (r.offer_support) {
        bub.append(el("div", { style: "margin-top:10px" },
          el("button", { class: "btn btn-secondary", style: BTN, onclick: () => {
            view = "leads"; render();
          } }, "Contact support about this")));
      }

      // Unscoped question spanning several products: let them pick, then
      // re-ask scoped rather than retyping.
      (r.product_options || []).forEach(o => {
        bub.append(el("div", { style: "margin-top:6px" },
          el("button", { class: "btn btn-secondary", style: BTN, onclick: () => {
            sel.value = o.key; send(q, { silent: true });
          } }, o.label)));
      });
      if (r.from_faq) bub.append(el("div", { class: "tag tag-outline", style: "margin-top:8px" }, "reviewed answer"));
      log.append(bub._row);

      // The widget shows these; this page did not, so a clarify turn arrived
      // as a bare "is this what you meant?" with nothing to answer it -- the
      // one place the test chat did NOT match what a customer sees.
      const cands = r.faq_candidates || [];
      if (cands.length) {
        const box = aiTurn();
        box.style.cssText = "display:flex;flex-direction:column;gap:6px;align-items:flex-start";
        cands.forEach(c => box.append(el("button", {
          class: "btn btn-secondary", style: "font-size:12.5px;padding:6px 11px;text-align:left;white-space:normal",
          onclick: () => { box._row.remove(); send(c.question, { faqId: c.id, silent: true }); },
        }, c.question)));
        box.append(el("button", {
          class: "btn btn-ghost", style: "font-size:12px;padding:4px 9px",
          onclick: () => { box._row.remove(); send(q, { skipFaq: true, silent: true }); },
        }, "None of these \u2014 answer from the documents"));
        log.append(box);
      }
    } catch (e) { wait.textContent = "Failed: " + e.message; wait.classList.add("bub", "a"); }
    log.scrollTop = log.scrollHeight;
  }
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  // One pill holding the field and the send control, the shape every current
  // chat uses. The button disables itself on an empty field rather than
  // accepting the click and doing nothing.
  const sendBtn = el("button", { class: "send", disabled: "true",
                                 title: "Send", "aria-label": "Send",
                                 onclick: () => send() });
  sendBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="2.1" stroke-linecap="round" '
    + 'stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
  const syncSend = () => { sendBtn.disabled = !input.value.trim(); };
  input.addEventListener("input", syncSend);
  const composer = el("div", { class: "composer" }, input, sendBtn);

  // The real widget, in an iframe. Not a second chat UI that imitates it:
  // this is the same groundedops-widget.js a customer loads, reading the
  // same /widget/config, so anything changed under Widget design shows up
  // here without this page knowing the setting exists. `key` is bumped on
  // reload so the iframe actually re-fetches rather than serving cache.
  const { card: previewCard, frame } = widgetPreviewCard(true);

  return [
    el("h1", {}, "Test chat"),
    el("p", { class: "lede" },
      "The real widget, on a stand-in customer page. This is the same file "
      + "customers load and it reads the same Widget design settings, so what "
      + "you see here is what they get — there is no second chat UI to drift."),

    previewCard,

    // Kept as a separate tool, and labelled as one. It is NOT "what the
    // customer sees" — it forces a specific provider/model, which the widget
    // never does (the model is chosen server-side precisely so a browser
    // cannot pick an expensive one). Useful for comparing models against the
    // same question; misleading if read as the customer path.
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-top:14px",
                "data-sec": "Pipeline check", "data-tour": "test-chat" },
      el("h3", {}, "Pipeline check"),
      el("p", { class: "sec-hint" },
        "Ask the pipeline directly and force a specific provider or model. "
        + "For comparing answers between models — the widget always lets the "
        + "server choose, so this path is not what a visitor gets."),
      el("div", { class: "row", style: "margin:12px 0" },
        el("div", {}, el("label", { class: "flabel" }, "Ask about"), sel),
        el("div", {}, el("label", { class: "flabel" }, "Provider"), provSel),
        el("div", {}, el("label", { class: "flabel" }, "Model"), modelIn)),
      log,
      composer),
  ];
}

/* ---------------- walkthrough ---------------- */
/* Replaces the old modal guide. Rather than describing the console in prose,
   this points at one real element at a time, on the page you are already on.
   Steps are per view: the tour is a tour of *this* page, and render() ends it
   on navigation (endTour() at the top) instead of trying to drive the user
   across pages mid-step.

   A step targets [data-tour="<ref>"]. Steps whose target is absent get dropped
   when the tour starts, so an empty-state page that renders fewer cards gets a
   correctly-numbered shorter tour rather than a step pointing at nothing. */
// The whole job, across the pages, in the order it happens. The per-page
// walkthrough below answers "what is on this page"; this answers "what do I
// do first", which is the question a new install actually has and the one no
// single page could answer -- each page's help stopped at its own edge.
//
// A step names the view it belongs to; the runner switches pages between
// steps and waits for the render before pointing at anything.
const GUIDED = [
  { view: "catalog", ref: "cat-range", title: "1. Set up a product",
    text: "Everything hangs off a product: documents are filed against one, and the widget asks a visitor to pick one before it answers. Add the range first, then the products inside it." },
  { view: "documents", ref: "doc-add", title: "2. Add its documents",
    text: "The manuals and datasheets answers are drawn from. Pick the range and product, then drop the files in — a document with no product is searchable but never offered to a visitor." },
  { view: "faq", ref: "ans-draft", title: "3. Draft the answers",
    text: "Reads a document you have added and writes the questions a customer would ask, answered from that document alone. Nothing goes live until you have read it: signed-out visitors see only these." },
  { view: "faq", ref: "ans-hand", title: "4. Or write one yourself",
    text: "Hand-written answers are protected — drafting never overwrites one. This is also where a question from the Unanswered page lands when you press Answer this." },
  { view: "test", ref: "test-widget", title: "5. Try it as a customer",
    text: "The real widget, on a stand-in page, reading the same settings a visitor gets. Ask it something you know the answer to, and check the sources it cites." },
  { view: "gaps", ref: "gaps-list", title: "6. Come back to what it could not answer",
    text: "Every question a visitor asked that the answers did not cover lands here, most asked first. Working down this list is the upkeep — answering one removes it automatically." },
];

let guidedOn = false;

function startGuided() {
  guidedOn = true;
  const live = GUIDED.slice();
  tourSteps = live; tourStep = 0; tourOn = true;
  bindTourKeys();
  goGuided(0);
}

// Switching pages between steps means the target does not exist yet when the
// step is drawn, so the render has to finish first. render() is synchronous,
// but the views that fetch on demand (products, gaps) paint a second time
// when their data lands -- hence the retry rather than a single timeout.
function goGuided(i) {
  const step = tourSteps[i];
  if (!step) return endTour();
  tourStep = i;
  if (view !== step.view) { view = step.view; render(); }
  let tries = 0;
  const tick = () => {
    if (!tourOn) return;
    if (tourTarget(step.ref)) return drawTour();
    // Out of patience: the step's anchor is not on this page at all. On an
    // empty install that is normal -- the Unanswered page has no list until a
    // visitor asks something -- so the step still gets said, pointed at the
    // page heading rather than at nothing.
    if (tries++ > 20) return drawTour(true);
    setTimeout(tick, 120);
  };
  tick();
}

const tourStepsByView = {

let tourOn = false, tourStep = 0, tourSteps = [];
let tourPop = null, tourHi = null, tourKeys = null, tourReflow = null;

const tourTarget = ref => document.querySelector('[data-tour="' + ref + '"]');

// Shared by the per-page walkthrough and the guided flow.
function bindTourKeys() {
  tourKeys = e => {
    if (!tourOn) return;
    if (e.key === "Escape") endTour();
    else if (e.key === "ArrowRight") tourGo(1);
    else if (e.key === "ArrowLeft") tourGo(-1);
  };
  document.addEventListener("keydown", tourKeys);
  tourReflow = () => { if (tourOn) placeTour(); };
  window.addEventListener("resize", tourReflow);
  const main = document.querySelector(".main");
  if (main) main.addEventListener("scroll", tourReflow);
}

function startTour() {
  const live = (tourStepsByView[view] || []).filter(s => tourTarget(s.ref));
  if (!live.length) return toast("No walkthrough for this page yet");
  endTour();
  tourSteps = live; tourOn = true; tourStep = 0;

  bindTourKeys();

  drawTour();
}

// Just the visuals, leaving the run in place.
function clearTourUI() {
  if (tourPop) { tourPop.remove(); tourPop = null; }
  if (tourHi) { tourHi.classList.remove("tour-hi"); tourHi = null; }
}

function endTour() {
  tourOn = false; guidedOn = false; tourStep = 0; tourSteps = [];
  clearTourUI();
  if (tourKeys) { document.removeEventListener("keydown", tourKeys); tourKeys = null; }
  if (tourReflow) {
    window.removeEventListener("resize", tourReflow);
    const main = document.querySelector(".main");
    if (main) main.removeEventListener("scroll", tourReflow);
    tourReflow = null;
  }
}

function tourGo(delta) {
  if (!tourOn) return;
  const n = tourStep + delta;
  if (n < 0) return;
  if (guidedOn) {
    if (n >= tourSteps.length) return endTour();
    return goGuided(n);
  }
  if (n >= tourSteps.length) return endTour();
  tourStep = n; drawTour();
}

function drawTour(fallback) {
  const s = tourSteps[tourStep];
  if (!s) return endTour();

  if (tourHi) tourHi.classList.remove("tour-hi");
  tourHi = tourTarget(s.ref);
  // Products and the gaps page fetch on demand and paint a SECOND time when
  // their data lands, which wipes the popover and, on the first paint, has
  // not drawn the target yet. Ending the run there stranded the guided flow
  // on its own first step. A missing target is now just "not yet".
  if (!tourHi && fallback) tourHi = document.querySelector(".main h1");
  if (!tourHi) { if (guidedOn) return; return endTour(); }
  // Its section may not be the one on screen.
  revealSection(tourHi);
  tourHi.classList.add("tour-hi");
  tourHi.scrollIntoView({ behavior: "smooth", block: "center" });

  const last = tourStep === tourSteps.length - 1;
  if (tourPop) tourPop.remove();
  tourPop = el("div", { class: "tour-pop", role: "dialog", "aria-label": "Walkthrough" },
    el("div", { class: "step mono" }, "Step " + (tourStep + 1) + " of " + tourSteps.length),
    el("div", { class: "tt" }, s.title),
    el("div", { class: "tx" }, s.text),
    el("div", { class: "acts" },
      el("button", { class: "btn btn-ghost", onclick: endTour }, "Skip"),
      el("div", { style: "display:flex;gap:8px" },
        el("button", { class: "btn btn-secondary", disabled: tourStep === 0 ? "true" : null,
                       onclick: () => tourGo(-1) }, "Back"),
        el("button", { class: "btn btn-primary", onclick: () => tourGo(1) }, last ? "Done" : "Next"))));
  document.body.append(tourPop);
  placeTour();
}

// Beside the highlighted element, per the design, flipped to its other side
// when there is no room -- so the popover never lands on top of the thing it
// is describing.
function placeTour() {
  if (!tourPop || !tourHi) return;
  const r = tourHi.getBoundingClientRect();
  const w = tourPop.offsetWidth || 300, h = tourPop.offsetHeight || 190;
  const gap = 16, pad = 12;

  let left = r.right + gap;
  if (left + w + pad > window.innerWidth) {
    left = r.left - gap - w;
    if (left < pad) left = Math.max(pad, window.innerWidth - w - pad);
  }
  const top = Math.max(pad, Math.min(r.top, window.innerHeight - h - pad));

  tourPop.style.left = Math.round(left) + "px";
  tourPop.style.top = Math.round(top) + "px";
}


/* ---------------- boot ---------------- */
(async () => {
  // Re-establish who the held token belongs to rather than trusting the
  // cached copy: a level change made by root while this tab sat open must
  // take effect on reload, not whenever the token expires.
  if (tok) {
    try {
      me = (await api("/admin/auth/me")).user;
      sessionStorage.setItem("go_admin_me", JSON.stringify(me));
      if (isStaff()) await refresh();
    } catch (e) { tok = ""; me = null; }
  }
  render();
})();
