server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirror the Vite dev proxy: /api/* -> backend, stripping the prefix
    # (frontend calls /api/query, backend serves /query).
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # long: local generation can be slow
        client_max_body_size 50m;  # PDF uploads
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
