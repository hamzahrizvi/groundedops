# nginx config for the standalone `widget` service — serves ONLY the
# embeddable widget bundle, nothing else. Kept separate from the app
# frontend so the widget can be cached, versioned and deployed
# independently of the React build (and stays reachable if the app
# frontend is down).
#
# No CORS headers are needed here: a cross-origin <script src> load is not
# a CORS request. The widget's own fetch to POST /query IS cross-origin and
# is covered by the backend's CORSMiddleware / WIDGET_ALLOWED_ORIGINS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/javascript;
    gzip_min_length 1024;

    # The canonical path stays /groundedops-widget.js at this origin's root,
    # so an embed snippet is just:
    #   <script src="https://widget.example.com/groundedops-widget.js"
    #           data-api="https://api.example.com"></script>
    location / {
        # Deliberately NOT `immutable` with a long max-age: this filename is
        # unversioned, so customers who cached it aggressively could be stuck
        # on a stale widget with no way to bust it. 5 minutes + ETag
        # revalidation keeps rollout fast while staying cheap (304s).
        #
        # For real CDN caching, ship a versioned copy alongside it
        # (groundedops-widget.v2.js) and give THAT the year-long immutable
        # header — versioned URLs are the only safe place for one.
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # This origin intentionally hosts ONE file, so the root path has no
    # index and used to return a bare 404 — which reads as "the widget is
    # broken" when you open http://localhost:8081/ to check on it. Serve a
    # small pointer page instead. Generated inline rather than added to
    # public/widget/ so the docroot stays exactly the bundle (and nothing
    # extra leaks into dist/widget/ via Vite's public/ copy).
    location = / {
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html><meta charset="utf-8"><title>GroundedOps widget origin</title><body style="font:14px/1.6 system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;color:#14201c"><h1 style="font-size:20px;margin:0 0 6px">GroundedOps widget origin</h1><p style="color:#5b6b64;margin:0 0 24px">This host serves the embeddable widget bundle and nothing else, so there is no page at this path.</p><p>Bundle: <a href="/groundedops-widget.js">/groundedops-widget.js</a></p><p style="font-size:13px;color:#5b6b64">Embed it on a customer page with:</p><pre style="background:#14201c;color:#e7f0ec;padding:14px;border-radius:8px;overflow:auto;font-size:13px">&lt;script src="/groundedops-widget.js" data-api="http://localhost:8000" data-title="Product support"&gt;&lt;/script&gt;</pre><p style="font-size:13px;color:#5b6b64">Use an absolute URL to this origin for <code>src</code> when embedding off-host. The <code>data-api</code> backend must allow the embedding page origin via <code>WIDGET_ALLOWED_ORIGINS</code>.</p></body>';
    }

    # Browsers request this automatically on any root visit; 204 keeps it
    # out of the error log rather than manufacturing a second 404.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Health/liveness for compose.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
