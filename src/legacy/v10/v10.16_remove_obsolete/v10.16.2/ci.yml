name: CI — test & build

# Runs on every push and PR to main. Real gates (a failure fails the run):
#   1. unit  — the pure-logic test suite (no ML deps, no corpus needed)
#   2. build — both Docker images must build
#
# Advisory (visible warning, does not fail the run):
#   3. eval-selfcheck — validates the eval suite schema. The locked
#      baseline is gitignored, so it can't be fully checked in CI; the
#      full eval runs locally where the corpus exists.
#
# Deployment is STAGE 2 below — commented out until a target exists.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Gate 1: unit tests ───────────────────────────────────────────────
  # Deliberately installs NO ML dependencies. The pure-logic modules
  # (chunking, structure, text_utils, memory) are fully testable without
  # them, and tests needing sentence-transformers raise SkipTest, which
  # run_tests.py reports as SKIP rather than disguising as a pass. This
  # keeps the gate meaningful and the run fast (seconds, not minutes).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run unit test suite
        run: |
          cd src
          python run_tests.py

  # ── Gate 2: images build ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t groundedops-backend ./src
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t groundedops-frontend ./src

  # ── Advisory: eval suite schema ──────────────────────────────────────
  # continue-on-error surfaces a visible warning instead of silently
  # swallowing the result with `|| echo`, which made the old workflow
  # green regardless of outcome.
  eval-selfcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install deps
        run: |
          cd src
          pip install -r requirements.txt
      - name: Validate eval suite schema
        env:
          GENERATION_MODE: local
        run: |
          cd src
          python eval.py --selfcheck

