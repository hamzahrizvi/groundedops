# DEV ONLY — Compose auto-merges this over docker-compose.yml.
# Bind-mounts source + hot-reload so code changes reflect WITHOUT a
# rebuild. Delete/rename this file for a production run.
# Rename to disable: mv docker-compose.override.yml override.disabled
services:
  backend:
    volumes:
      - ./src:/app
      - grounded-data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # v3.0.0: INGEST_PROVIDER removed — it only ever selected the model
    # for doc2query's ingest-time question generation, which no longer
    # exists. Ingest is now parse/chunk/embed only, with no LLM call.
    environment:
      # Wide-open CORS in dev so widget-demo.html works from file:// or
      # any local port. Never carry this into production.
      WIDGET_ALLOWED_ORIGINS: "*"

  frontend:
    # Vite dev server (hot module reload) instead of the built nginx image.
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run web -- --host --port 80"
    volumes:
      - ./src/frontend:/app
    ports:
      - "8080:80"
    # Vite serves public/ at the web root, so in dev the widget is at
    #   http://localhost:8080/widget/groundedops-widget.js
    # — same path as production, so embed snippets don't change.
