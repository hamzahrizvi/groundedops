<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GroundedOps Console</title>
<link rel="stylesheet" href="nocturne/styles.css" />
<style>
  /* ------------------------------------------------------------------
     Thin layer on top of the Nocturne design-system stylesheet: shell
     layout, the nav rail, and a handful of list/chat/dropzone patterns
     the system doesn't itself define. Every color, radius and spacing
     value here still comes from Nocturne's tokens.
     ------------------------------------------------------------------ */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--color-neutral-800);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
  /* uppercase micro-label, used for stat readouts */
  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
       color:color-mix(in srgb, var(--color-text) 45%, transparent)}
  /* plain-case label above a form field */
  .flabel{display:block;font-size:12px;margin-bottom:5px;
          color:color-mix(in srgb, var(--color-text) 70%, transparent)}

  /* ---------- shell ---------- */
  .shell{display:flex;height:100vh;overflow:hidden;background:var(--color-bg);color:var(--color-text);
         font-family:var(--font-body)}
  .rail{width:246px;flex:0 0 auto;display:flex;flex-direction:column;padding:18px 0 14px;
        border-right:1px solid var(--color-divider)}
  .brand{padding:0 18px 18px}
  .brand b{display:block;font-size:16px;font-weight:500;letter-spacing:-.01em;font-family:var(--font-heading)}
  .brand span{font-size:11.5px;color:color-mix(in srgb, var(--color-text) 45%, transparent)}
  .nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:2px}
  .nav button{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
              background:transparent;border:0;color:color-mix(in srgb, var(--color-text) 80%, transparent);
              padding:8px 10px 8px 9px;border-radius:var(--radius-md);cursor:pointer;font-size:13.5px}
  .nav button:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);color:var(--color-text)}
  .nav button .mark{width:3px;height:15px;border-radius:2px;flex:0 0 auto;background:transparent}
  .nav button[aria-current="page"]{background:color-mix(in srgb, var(--color-accent) 14%, transparent);
                                    color:var(--color-text);font-weight:500}
  .nav button[aria-current="page"] .mark{background:var(--color-accent)}
  .nav button:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
  .nav .badge{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;
              background:color-mix(in srgb, var(--color-text) 12%, transparent);
              padding:1px 7px;border-radius:99px}
  .nav button[aria-current="page"] .badge{background:var(--color-accent-800);color:var(--color-accent-100)}

  .main{flex:1;overflow-y:auto;padding:30px 34px 90px;position:relative}
  .wrap{max-width:1000px;animation:rise .18s ease both}
  h1{font-size:26px;letter-spacing:-.025em;margin:0 0 4px;font-family:var(--font-heading);font-weight:500}
  .lede{margin:0 0 22px;max-width:66ch;font-size:14px;
        color:color-mix(in srgb, var(--color-text) 60%, transparent)}

  /* section-header pattern used inside cards, matching the design's
     15px/500 title + 12.5px muted hint pairing */
  .sec-title{font-size:15px;font-weight:500;margin:0 0 2px;font-family:var(--font-heading)}
  .sec-hint{font-size:12.5px;margin:0 0 14px;max-width:60ch;
            color:color-mix(in srgb, var(--color-text) 55%, transparent)}

  /* ---------- readout: overview stat band ---------- */
  .readout{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .readout>div{background:var(--color-surface);border-radius:var(--radius-md);padding:15px 16px 13px;
               box-shadow:var(--shadow-sm)}
  .readout b{display:block;font-family:ui-monospace,monospace;font-size:29px;font-weight:500;
             letter-spacing:-.03em;line-height:1.15;margin-top:6px}
  .readout .warn b{color:var(--color-accent-300)}

  /* ---------- form rows ---------- */
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:170px}

  /* ---------- checklist (overview "what to do next") ---------- */
  .step{display:flex;gap:12px;padding:13px 0;border-top:1px solid color-mix(in srgb, var(--color-text) 9%, transparent)}
  .step:first-of-type{border-top:0}
  .mark-dot{width:21px;height:21px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
        justify-content:center;font-size:11px;font-weight:700}
  .mark-dot.done{background:var(--color-accent-800);color:var(--color-accent-100)}
  .mark-dot.todo{background:transparent;color:var(--color-accent);box-shadow:inset 0 0 0 1.5px var(--color-accent)}
  .mark-dot.idle{background:var(--color-neutral-800);color:var(--color-neutral-400)}
  .step-b{flex:1;min-width:0}
  .step-b b{display:block;font-size:13.5px;font-weight:500}
  .step-b p{margin:2px 0 0;font-size:12.5px;line-height:1.5;
            color:color-mix(in srgb, var(--color-text) 55%, transparent)}
  .step-b .acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- list rows (documents / answers / products) ---------- */
  .item{display:flex;gap:12px;align-items:center;padding:10px 0;
        border-top:1px solid color-mix(in srgb, var(--color-text) 9%, transparent)}
  .item:first-child{border-top:0}
  .item .grow{flex:1;min-width:0}
  .item .grow b{display:block;font-size:13.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .grow span{font-size:12px;color:color-mix(in srgb, var(--color-text) 50%, transparent)}
  .item.flagged{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 35%, transparent);
                border-radius:var(--radius-md);padding:10px 12px;border-top:0;margin-bottom:2px}

  .empty{text-align:center;padding:30px 20px;color:color-mix(in srgb, var(--color-text) 55%, transparent)}
  .empty b{display:block;color:var(--color-text);margin-bottom:4px;font-weight:500}

  /* ---------- drop zone ---------- */
  .drop{border:1.5px dashed var(--color-divider);border-radius:var(--radius-md);padding:26px;text-align:center;
        background:color-mix(in srgb, var(--color-text) 3%, transparent);
        color:color-mix(in srgb, var(--color-text) 55%, transparent);
        transition:border-color .12s,background .12s;cursor:pointer}
  .drop b{display:block;color:var(--color-text);font-weight:500}
  .drop.on{border-color:var(--color-accent);background:color-mix(in srgb, var(--color-accent) 10%, transparent)}
  .drop.off{opacity:.55;cursor:default}

  /* ---------- test chat ---------- */
  .chat{border-radius:var(--radius-md);height:340px;overflow-y:auto;padding:14px;
        background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-divider)}
  .bub{max-width:80%;padding:9px 13px;border-radius:var(--radius-md);margin-bottom:9px;font-size:13.5px;
       line-height:1.5;white-space:pre-wrap}
  .bub.u{margin-left:auto;background:var(--color-accent-800);color:var(--color-accent-100)}
  .bub.a{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-divider)}

  /* ---------- toast ---------- */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:var(--color-surface);box-shadow:var(--shadow-md);color:var(--color-text);
         padding:11px 18px;border-radius:var(--radius-md);font-size:13.5px;z-index:80;max-width:90vw}
  .toast.bad{box-shadow:var(--shadow-md), inset 0 0 0 1px var(--color-accent);color:var(--color-accent-200)}

  /* ---------- login gate ---------- */
  .gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
        background:var(--color-bg);color:var(--color-text)}
  .gate .card{max-width:380px;width:100%}

  .md p{margin:0 0 7px}
  .md p:last-child{margin-bottom:0}
  .md ul,.md ol{margin:4px 0 7px;padding-left:20px;display:flex;flex-direction:column;gap:3px}
  .md li{font-size:13.5px}
  .md code{font-family:ui-monospace,monospace;font-size:.88em;
           background:color-mix(in srgb, var(--color-text) 9%, transparent);
           padding:.1em .32em;border-radius:3px}
  .md-table{border-collapse:collapse;margin:5px 0 8px;font-size:12.5px;
            display:block;overflow-x:auto;max-width:100%}
  .md-table td{border:1px solid var(--color-divider);padding:4px 8px;
               vertical-align:top;font-variant-numeric:tabular-nums}
  /* ---------- in-page sub-navigation ---------- */
  /* Sections of the active page, listed under its nav row so they can be
     reached without scrolling for them. Built from the rendered DOM in
     buildSubnav(), so a view gets one for free by tagging cards data-sec. */
  /* Text aligns under the parent item's label (10px rail padding + 9px button
     padding + 3px mark + 9px gap = 31px), so the list reads as that item's
     contents. An earlier version indented off a vertical rule, which sat
     awkwardly against both the rail border and the active item's block. */
  .subnav{display:flex;flex-direction:column;padding:1px 10px 6px}
  .subnav button{display:block;width:100%;text-align:left;border:0;background:transparent;
                 cursor:pointer;font:inherit;font-size:12.5px;
                 padding:5px 10px 5px 21px;border-radius:var(--radius-md);
                 color:color-mix(in srgb, var(--color-text) 42%, transparent)}
  .subnav button:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent);
                       color:color-mix(in srgb, var(--color-text) 85%, transparent)}
  .subnav button:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}

  /* ---------- walkthrough ---------- */
  /* The help icon sits over .main rather than in the rail, so it stays put
     while the page scrolls. */
  .help-btn{position:fixed;top:18px;right:26px;z-index:40;width:34px;height:34px;
            border-radius:50%;border:0;cursor:pointer;background:var(--color-surface);
            box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--color-divider);
            color:var(--color-accent-400);font-size:15px;font-weight:600;
            display:grid;place-items:center;font-family:inherit}
  .help-btn:hover{color:var(--color-accent-300)}
  .help-btn:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

  @keyframes tourPulse{
    0%,100%{box-shadow:0 0 0 1px var(--color-accent),
                       0 0 0 0 color-mix(in srgb, var(--color-accent) 45%, transparent)}
    50%    {box-shadow:0 0 0 1px var(--color-accent),
                       0 0 0 6px color-mix(in srgb, var(--color-accent) 22%, transparent)}
  }
  /* position/z-index so the ring is not clipped by a neighbouring card. */
  .tour-hi{position:relative;z-index:41;border-radius:var(--radius-md);
           animation:tourPulse 1.9s ease-in-out infinite}
  .tour-pop{position:fixed;z-index:95;width:300px;background:var(--color-surface);
            border-radius:var(--radius-md);padding:16px 18px;
            box-shadow:var(--shadow-lg),0 0 0 1px var(--color-divider);
            animation:rise .18s ease both}
  .tour-pop .step{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--color-accent-400);margin-bottom:6px}
  .tour-pop .tt{font-size:14px;font-weight:500;margin-bottom:6px}
  .tour-pop .tx{font-size:13px;line-height:1.55;
                color:color-mix(in srgb, var(--color-text) 85%, transparent)}
  .tour-pop .acts{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .tour-pop .acts .btn{font-size:12px;padding:4px 10px}
  @media (prefers-reduced-motion:reduce){
    .tour-hi{animation:none;box-shadow:0 0 0 2px var(--color-accent)}
    .tour-pop{animation:none}
  }

  @media (max-width:820px){
    .shell{flex-direction:column;height:auto;min-height:100vh}
    .rail{width:100%;flex-direction:row;align-items:center;padding:10px;overflow-x:auto}
    .brand{border:0;padding:0 14px 0 6px;margin:0}
    .nav{flex-direction:row;flex:1}
    .subnav{display:none}
    .readout{grid-template-columns:repeat(2,1fr)}
    .main{padding:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ------------------------------------------------------------------ *
 * GroundedOps Console (v13.0 — Nocturne)
 *
 * One self-contained file, served by the backend at /admin. No build
 * step: replace the file, reload the page. Ship the sibling
 * nocturne/styles.css alongside it.
 *
 * The organising idea is that the console should answer "what do I do
 * next?" without anyone reading a manual. The Overview reads live state
 * and turns it into a short list of actions, so an unassigned document
 * or an empty FAQ announces itself instead of waiting to be discovered.
 * ------------------------------------------------------------------ */

const API = location.origin;
let pw = sessionStorage.getItem("go_admin_pw") || "";
let view = "overview";
// Set by the Unanswered page's "Answer this" so the Answers page opens
// with the question prefilled and scrolled into view.
let pendingAnswer = null;
let cache = { catalog: null, sources: [], faq: [], gaps: [], providers: [],
              widget: null, leads: [], leadStats: {} };

// Sentinel for "answers carrying no product tag at all" in the answers-page
// picker, kept distinct from "" which means nothing chosen yet.
const NO_SCOPE = "__none__";
// One button metric for the console, so rows of mixed .btn variants line up.
const BTN = "font-size:12.5px;padding:5px 11px";

const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  // flat(Infinity), not flat(): a view returning [h1, lede, rows] where
  // `rows` is itself an array of cards nests two deep, and a single-level
  // flatten leaves that inner array to be passed to createTextNode —
  // which renders the literal string "[object HTMLDivElement]" instead of
  // the list. Depth-1 happened to work only while every view returned a
  // flat list of elements.
  kids.flat(Infinity).forEach(c => c && n.append(c.nodeType ? c : document.createTextNode(c)));
  return n;
};

function toast(msg, bad) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = el("div", { class: "toast" + (bad ? " bad" : "") }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

// Provider pickers are built from what the server says it can actually reach
// (/admin/providers: key present in the environment, or Ollama warmed) rather
// than a hardcoded list of all four. Offering DeepSeek with no key set failed
// with "returned nothing", which reads as a broken model rather than as
// missing configuration.
function providerBox(extra) {
  return el("select", Object.assign({ class: "input" }, extra || {}),
    el("option", { value: "" },
      cache.providers.length ? "Server default" : "Server default (none configured)"),
    cache.providers.map(p => el("option", { value: p.key }, p.label)));
}

const defaultModelFor = key =>
  (cache.providers.find(p => p.key === key) || {}).default_model || "";

// The model box means nothing until a provider is chosen, and showing that
// provider's current default as the placeholder saves guessing a model name
// -- which is how a retired one went unnoticed.
function linkModelBox(sel, box) {
  const sync = () => {
    const d = defaultModelFor(sel.value);
    box.placeholder = d ? d + "  (default)" : "model (optional)";
    box.disabled = !sel.value;
  };
  sel.addEventListener("change", sync);
  sync();
  return box;
}

// Answers come back as markdown-ish text: "- 13: USB power (+5V)" lines, the
// occasional **bold**, sometimes a pipe table. Rendered as a single text node
// they were a wall of characters -- a pinout list being the worst case. This
// is a deliberately small renderer: escape everything first, then allow only
// bullets, ordered lists, tables, bold, code and paragraphs. No library, and
// nothing that can inject markup.
function mdEscape(t) {
  return (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function mdInline(t) {
  return mdEscape(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

const MD_BULLET = /^\s*[-*•]\s+(.*)$/;
const MD_NUM = /^\s*\d+[.)]\s+(.*)$/;
const MD_ROW = /^\s*\|.*\|\s*$/;
const MD_SEP = /^[\s|:-]+$/;

function renderMarkdown(text) {
  const box = el("div", { class: "md" });
  const lines = String(text || "").split(/\r?\n/);
  let i = 0;

  const flushList = (ordered) => {
    const list = el(ordered ? "ol" : "ul", {});
    while (i < lines.length) {
      const m = lines[i].match(ordered ? MD_NUM : MD_BULLET);
      if (!m) break;
      list.append(el("li", { html: mdInline(m[1]) }));
      i++;
    }
    box.append(list);
  };

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    // A pipe table, which is how spec rows arrive now parsing keeps them.
    if (MD_ROW.test(line)) {
      const tbl = el("table", { class: "md-table" });
      while (i < lines.length && MD_ROW.test(lines[i])) {
        if (!MD_SEP.test(lines[i])) {          // the |---|---| row carries no data
          const tr = el("tr", {});
          lines[i].trim().replace(/^\||\|$/g, "").split("|")
            .forEach(c => tr.append(el("td", { html: mdInline(c.trim()) })));
          tbl.append(tr);
        }
        i++;
      }
      box.append(tbl);
      continue;
    }

    if (MD_BULLET.test(line)) { flushList(false); continue; }
    if (MD_NUM.test(line)) { flushList(true); continue; }

    const para = [];
    while (i < lines.length && lines[i].trim()
           && !MD_BULLET.test(lines[i]) && !MD_NUM.test(lines[i])
           && !MD_ROW.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    box.append(el("p", { html: mdInline(para.join(" ")) }));
  }
  return box;
}

async function api(path, opts = {}) {
  const o = Object.assign({ headers: {} }, opts);
  o.headers["x-admin-password"] = pw;
  if (o.body && !(o.body instanceof FormData)) o.headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, o);
  if (r.status === 401) { pw = ""; sessionStorage.removeItem("go_admin_pw"); render(); throw new Error("Password rejected"); }
  if (!r.ok) {
    let d; try { d = (await r.json()).detail; } catch (e) { d = r.statusText; }
    throw new Error(typeof d === "string" ? d : JSON.stringify(d));
  }
  return r.status === 204 ? null : r.json();
}

/* ---------------- data ---------------- */
async function refresh() {
  // All independent reads — run them together rather than in series, so
  // opening the console is one round trip's worth of latency, not six.
  const [cat, src, faq, gaps, widget, leads, prov] = await Promise.all([
    api("/catalog").catch(() => ({ categories: [] })),
    api("/admin/sources").catch(() => ({ sources: [] })),
    api("/faq").catch(() => ({ faq: [] })),
    api("/faq/gaps").catch(() => ({ gaps: [], stats: {} })),
    api("/admin/widget/config").catch(() => null),
    api("/admin/leads").catch(() => ({ leads: [], stats: {} })),
    api("/admin/providers").catch(() => ({ providers: [] })),
  ]);
  cache.catalog = cat.categories || [];
  cache.sources = src.sources || src || [];
  cache.faq = faq.faq || [];
  cache.gaps = gaps.gaps || [];
  cache.gapStats = gaps.stats || {};
  // Kept as null on failure rather than defaulted: the Widget page needs
  // to tell the difference between "not loaded" and "loaded and empty",
  // or a failed read would render as a blank config the admin could
  // accidentally save over their real one.
  cache.widget = widget;
  cache.providers = prov.providers || [];
  cache.leads = leads.leads || [];
  cache.leadStats = leads.stats || {};
}

// Deep copy, so edits in the Widget editor are staged locally and only
// committed on Save — closing the page without saving discards them.
const clone = o => JSON.parse(JSON.stringify(o));

const products = () => cache.catalog.flatMap(c =>
  (c.products || []).map(p => ({ ...p, category: c.key, categoryName: c.name })));
const unassigned = () => cache.sources.filter(s => !(s.product || s.products));
const answered = () => cache.faq.filter(f => (f.answer || "").trim());

/* ---------------- shell ---------------- */
function render() {
  const app = document.getElementById("app");
  endTour();                 // the popover lives on <body>, so it outlives app.innerHTML
  app.innerHTML = "";
  if (!pw) return app.append(gate());

  // Collected so buildSubnav() can hang the active page's sections off its row.
  const navBtns = [];
  const nav = (id, label, count) => {
    const b = el("button", {
      onclick: () => { view = id; render(); },
      "aria-current": view === id ? "page" : null,
    }, el("span", { class: "mark" }), el("span", { style: "flex:1" }, label),
       count !== undefined ? el("span", { class: "badge mono" }, String(count)) : null);
    navBtns.push([id, b]);
    return b;
  };

  app.append(el("div", { class: "shell" },
    el("aside", { class: "rail" },
      el("div", { class: "brand" }, el("b", {}, "GroundedOps"), el("span", {}, "Support console")),
      el("nav", { class: "nav" },
        nav("overview", "Overview"),
        nav("documents", "Documents", cache.sources.length),
        nav("faq", "Generate/Edit FAQs", answered().length),
        nav("gaps", "FAQs from customers", cache.gaps.length),
        nav("catalog", "Products", products().length),
        nav("widget", "Widget design"),
        nav("leads", "Enquiries", cache.leadStats.unhandled || 0),
        nav("test", "Test chat"),
      ),
    ),
    el("main", { class: "main" },
      el("button", { class: "help-btn", onclick: startTour,
                     title: "How to use this page", "aria-label": "How to use this page" }, "?"),
      el("div", { class: "wrap" }, body()))
  ));

  buildSubnav(navBtns);
}

// Lists the active page's sections under its nav row. Reads the rendered DOM
// rather than a per-view table, so tagging a card data-sec is all a view has to
// do to appear here. Fewer than two sections is not worth the extra chrome.
function buildSubnav(navBtns) {
  const active = navBtns.find(([id]) => id === view);
  if (!active) return;
  const secs = [...document.querySelectorAll(".main [data-sec]")];
  if (secs.length < 2) return;
  active[1].after(el("div", { class: "subnav" },
    secs.map(sec => el("button", {
      onclick: () => sec.scrollIntoView({ behavior: "smooth", block: "start" }),
    }, sec.getAttribute("data-sec")))));
}

function body() {
  if (view === "overview") return viewOverview();
  if (view === "documents") return viewDocuments();
  if (view === "faq") return viewFaq();
  if (view === "gaps") return viewGaps();
  if (view === "catalog") return viewCatalog();
  if (view === "widget") return viewWidget();
  if (view === "leads") return viewLeads();
  if (view === "test") return viewTest();
}

/* ---------------- gate ---------------- */
function gate() {
  const input = el("input", { class: "input", type: "password", placeholder: "Admin password", autofocus: "true" });
  // Every failure here used to surface as "that password was not accepted" --
  // a wrong password, a server that was not running, a proxy swallowing the
  // request and a 404 from the private-surface middleware all looked
  // identical. Only a 401 is actually about the password; say what the others
  // were, because from another PC on the LAN the difference is the whole
  // diagnosis.
  const go = async () => {
    pw = input.value;
    try {
      await api("/admin/login", { method: "POST" });
    } catch (e) {
      pw = "";
      // api() throws this exact message on a 401, and nothing else does.
      if (e.message === "Password rejected") {
        toast("That password was not accepted", true);
      } else if (e instanceof TypeError) {
        // fetch() rejects with a TypeError when the request never got a
        // response at all: server down, wrong host, blocked in transit.
        toast("Could not reach the server at " + API + " \u2014 " + e.message, true);
      } else {
        toast("Sign-in failed: " + e.message, true);
      }
      return;
    }

    sessionStorage.setItem("go_admin_pw", pw);
    // A 401 on any of refresh()'s reads clears pw and re-renders the gate from
    // inside api(), and refresh() swallows the error -- which lands you back at
    // the login box with nothing said. Check for it rather than let it look
    // like the password failed.
    try { await refresh(); } catch (e) { toast("Loaded with errors: " + e.message, true); }
    if (!pw) return toast("Signed in, but a follow-up request was rejected", true);
    render();
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  return el("div", { class: "gate" },
    el("div", { class: "card elev-md", style: "padding:22px" },
      el("h2", {}, "GroundedOps console"),
      el("p", { class: "sec-hint", style: "margin-bottom:16px" }, "Manage the documents and answers behind the support widget."),
      el("div", { class: "field" }, input),
      el("div", { style: "margin-top:14px" },
        el("button", { class: "btn btn-primary", onclick: go }, "Open console"))));
}

/* ---------------- overview ---------------- */
function viewOverview() {
  const prods = products(), un = unassigned(), ans = answered();

  const stat = (label, value, tone) =>
    el("div", { class: tone || "" }, el("div", { class: "lbl" }, label), el("b", {}, String(value)));

  const step = (state, title, desc, actions) =>
    el("div", { class: "step" },
      el("div", { class: "mark-dot " + state }, state === "done" ? "\u2713" : state === "todo" ? "!" : "\u00b7"),
      el("div", { class: "step-b" },
        el("b", {}, title), el("p", {}, desc),
        actions && actions.length ? el("div", { class: "acts" }, actions) : null));

  const goTo = (id, label, primary) =>
    el("button", { class: "btn " + (primary ? "btn-primary" : "btn-secondary"), style: "font-size:12.5px;padding:4px 10px",
                   onclick: () => { view = id; render(); } }, label);

  const steps = [];

  steps.push(prods.length
    ? step("done", "Products are set up",
        prods.length + " product" + (prods.length === 1 ? "" : "s") +
        " across " + cache.catalog.length + " range" + (cache.catalog.length === 1 ? "" : "s") + ".",
        [goTo("catalog", "Manage products")])
    : step("todo", "Set up your products first",
        "Documents are filed against a product, and the widget asks visitors to pick one. Nothing else works until at least one exists.",
        [goTo("catalog", "Add a product", true)]));

  steps.push(cache.sources.length
    ? step(un.length ? "todo" : "done",
        un.length ? un.length + " document" + (un.length === 1 ? "" : "s") + " need a product"
                  : cache.sources.length + " documents, all filed",
        un.length ? "Unfiled documents are searchable but never offered in the widget, because it can only show products it can answer about."
                  : "Every document belongs to a product and can be found by the widget.",
        [goTo("documents", un.length ? "File them now" : "View documents", !!un.length)])
    : step("todo", "Add your first document",
        "PDF, Word or text. This is what answers are drawn from.",
        [goTo("documents", "Add documents", true)]));

  steps.push(ans.length
    ? step("done", ans.length + " reviewed answers",
        "Signed-out visitors only ever see these, so they are the public face of the widget.",
        [goTo("faq", "Review answers")])
    : step(cache.sources.length ? "todo" : "idle", "Write the reviewed answers",
        "Visitors who are not signed in can only be shown answers you have approved. Draft them from a document, then edit.",
        cache.sources.length ? [goTo("faq", "Start writing", true)] : []));

  steps.push(cache.gaps.length
    ? step("todo", cache.gaps.length + " unanswered questions logged",
        "Real questions the reviewed answers did not cover. This is your to-do list, ordered by how often each was asked.",
        [goTo("gaps", "See what people asked", true)])
    : step("idle", "Questions people could not get answered",
        "Anything the widget could not answer shows up here once visitors start using it.", []));

  const unhandled = (cache.leadStats || {}).unhandled || 0;
  if (unhandled) {
    steps.push(step("todo", unhandled + " enquir" + (unhandled === 1 ? "y" : "ies") + " waiting",
      "Someone filled in the sales or support form. These are not emailed anywhere, so they sit here until you reply.",
      [goTo("leads", "Read them", true)]));
  }

  return [
    el("h1", {}, "Overview"),
    el("p", { class: "lede" }, "Everything the support widget knows comes from this console. Work down the list; anything needing attention is marked."),
    el("div", { class: "readout", "data-tour": "ov-readout", "data-sec": "At a glance" },
      stat("Documents", cache.sources.length),
      stat("Need filing", un.length, un.length ? "warn" : ""),
      stat("Reviewed answers", ans.length),
      stat("Unanswered", cache.gaps.length, cache.gaps.length ? "warn" : "")),
    el("div", { class: "card elev-sm", style: "padding:18px 20px 6px;gap:0",
                "data-tour": "ov-next", "data-sec": "What to do next" },
      el("div", { class: "sec-title" }, "What to do next"),
      el("div", { class: "sec-hint" }, "Read from live state. Anything needing attention is marked in the accent."),
      steps),
  ];
}

/* ---------------- documents ---------------- */
function viewDocuments() {
  const prods = products();
  let chosenCat = cache.catalog.length === 1 ? cache.catalog[0].key : "";
  let chosen = prods.length === 1 ? prods[0].key : "";

  // Category first, then a product list filtered to it \u2014 separate steps
  // instead of one long "Category > Product" dropdown.
  const catSel = el("select", { class: "input", onchange: e => {
    chosenCat = e.target.value; chosen = ""; syncProductOptions(); sync();
  } }, el("option", { value: "" }, cache.catalog.length ? "Choose a category\u2026" : "No categories yet"),
     cache.catalog.map(c => el("option", { value: c.key }, c.name)));
  if (chosenCat) catSel.value = chosenCat;

  const prodSel = el("select", { class: "input", onchange: e => { chosen = e.target.value; sync(); } });
  function syncProductOptions() {
    prodSel.innerHTML = "";
    const inCat = prods.filter(p => p.category === chosenCat);
    prodSel.disabled = !chosenCat;
    prodSel.append(el("option", { value: "" },
      !chosenCat ? "Choose a category first" : inCat.length ? "Choose a product\u2026" : "No products in this category"));
    inCat.forEach(p => prodSel.append(el("option", { value: p.key }, p.name)));
    if (chosen) prodSel.value = chosen;
  }
  syncProductOptions();

  const drop = el("div", { class: "drop off" },
    el("b", {}, "Choose a product first"),
    "Then drop files here, or click to browse");
  const file = el("input", { type: "file", multiple: "true", accept: ".pdf,.docx,.txt", style: "display:none" });
  const progress = el("div", {});

  function sync() {
    const ok = !!chosen;
    drop.className = "drop" + (ok ? "" : " off");
    drop.innerHTML = "";
    drop.append(el("b", {}, ok ? "Drop files here" : "Choose a product first"),
      ok ? "PDF, Word or text \u2014 or click to browse"
         : "Documents must belong to a product so the widget can offer them");
  }
  sync();

  async function upload(files) {
    if (!chosen) return toast("Choose a product first", true);
    const p = prods.find(x => x.key === chosen);
    for (const f of files) {
      const line = el("div", { class: "item" },
        el("div", { class: "grow" }, el("b", {}, f.name), el("span", {}, "Uploading\u2026")));
      progress.append(line);
      try {
        const fd = new FormData(); fd.append("file", f);
        const r = await fetch(API + "/upload", {
          method: "POST", body: fd,
          headers: { "x-admin-password": pw, "category-key": p.category, "product-key": p.key },
        });
        if (!r.ok) throw new Error(await r.text());
        const { job_id } = await r.json();
        await track(job_id, line, f.name);
      } catch (e) {
        line.querySelector("span").textContent = "Failed: " + e.message;
      }
    }
    await refresh(); render();
  }

  async function track(job, line, name) {
    for (let i = 0; i < 600; i++) {
      await new Promise(r => setTimeout(r, 1000));
      let s; try { s = await api("/upload/status/" + job); } catch (e) { break; }
      const span = line.querySelector("span");
      if (s.status === "done") { span.textContent = "Added \u2014 " + (s.chunks || 0) + " sections"; return; }
      if (s.status === "error") { span.textContent = "Failed: " + (s.error || "unknown"); return; }
      span.textContent = (s.stage || "working") + " " + (s.pct || 0) + "%";
    }
  }

  drop.addEventListener("click", () => chosen && file.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); if (chosen) drop.classList.add("on"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("on"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("on");
    if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
  });
  file.addEventListener("change", () => file.files.length && upload(file.files));

  // Grouped by category > product instead of one flat list \u2014 unassigned
  // docs are their own pinned-first group, same idea as viewGaps' scope
  // grouping.
  const docRow = s => {
    const cur = s.product || s.products || "";
    const move = el("select", { class: "input", style: "width:auto", onchange: async e => {
      const p = prods.find(x => x.key === e.target.value);
      if (!p) return;
      try {
        await api("/admin/reassign_source", { method: "POST",
          body: JSON.stringify({ source: s.source, category_key: p.category, product_key: p.key }) });
        toast("Filed under " + p.name);
        await refresh(); render();
      } catch (err) { toast(err.message, true); }
    } }, el("option", { value: "" }, cur ? "Move to\u2026" : "File under\u2026"),
       prods.map(p => el("option", { value: p.key }, p.categoryName + " \u203a " + p.name)));

    return el("div", { class: "item" + (cur ? "" : " flagged") },
      el("div", { class: "grow" },
        el("b", {}, s.source),
        el("span", {}, (s.chunks || 0) + " sections")),
      cur ? el("span", { class: "tag tag-neutral" }, cur) : el("span", { class: "tag tag-accent" }, "no product"),
      move,
      el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
        if (!confirm("Remove " + s.source + "? Its answers stay, but it can no longer be searched.")) return;
        try { await api("/delete_source", { method: "POST", body: JSON.stringify({ source: s.source }) });
              toast("Removed"); await refresh(); render(); }
        catch (e) { toast(e.message, true); }
      } }, "Remove"));
  };

  const groups = new Map();
  cache.sources.forEach(s => {
    const key = s.product || s.products || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });
  const label = key => {
    if (!key) return "Unassigned";
    const p = prods.find(x => x.key === key);
    return p ? p.categoryName + " \u203a " + p.name : key;
  };
  const ordered = [...groups.entries()].sort((a, b) =>
    a[0] === "" ? -1 : b[0] === "" ? 1 : label(a[0]).localeCompare(label(b[0])));

  const list = ordered.length ? ordered.map(([key, docs]) =>
    el("div", { style: "margin-bottom:16px" },
      el("div", { class: "sec-title", style: key ? "" : "color:var(--color-accent-400)" },
        label(key) + " \u00b7 " + docs.length + (docs.length === 1 ? " document" : " documents")),
      docs.map(docRow)))
    : [el("div", { class: "empty" }, el("b", {}, "No documents yet"),
        "Add a manual or datasheet above and the widget can start answering from it.")];

  return [
    el("h1", {}, "Documents"),
    el("p", { class: "lede" }, "The manuals and datasheets answers are drawn from. Each one belongs to a product, which is how the widget knows what to offer."),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                "data-tour": "doc-add", "data-sec": "Add documents" },
      el("div", { class: "sec-title" }, "Add documents"),
      el("div", { class: "sec-hint" }, "Pick the category, then the product the document describes, then drop the files in."),
      el("div", { class: "row" },
        el("div", {}, el("label", { class: "flabel" }, "Category"), catSel),
        el("div", {}, el("label", { class: "flabel" }, "Product"), prodSel)),
      el("div", { style: "margin-top:14px" }, drop, file),
      progress),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0",
                "data-tour": "doc-list", "data-sec": "All documents" },
      el("div", { class: "sec-title" }, "All documents"),
      el("div", { class: "sec-hint" }, "A document with no product is searchable but never offered in the widget."),
      list),
  ];
}

/* ---------------- answers (FAQ) ---------------- */
function viewFaq() {
  const prods = products();

  const scopeOf = f => (f.products || "").split(",")[0] || f.category || "";

  // scope -> "Category \u203a Product" label.
  const scopeLabel = key => {
    if (!key || key === NO_SCOPE) return "Not tagged to a product";
    const p = prods.find(x => x.key === key);
    return p ? p.categoryName + " \u203a " + p.name : key;
  };

  // The list is gated on a product (below), so the picker has to offer every
  // scope that actually holds answers -- otherwise entries tagged with a key
  // the catalogue does not know about become unreachable rather than merely
  // unsurfaced, and those are exactly the ones needing to be retagged.
  const known = new Set(prods.map(p => p.key));
  const usedScopes = [...new Set(cache.faq.map(scopeOf))];
  const orphanScopes = usedScopes.filter(k => k && !known.has(k)).sort();
  const hasUnscoped = usedScopes.includes("");
  const countFor = key => (key === NO_SCOPE
    ? cache.faq.filter(f => !scopeOf(f)).length
    : cache.faq.filter(f => (f.products || "").split(",").includes(key) || f.category === key).length);

  let scope = "";
  const shown = () => {
    if (!scope) return [];
    if (scope === NO_SCOPE) return cache.faq.filter(f => !scopeOf(f));
    return cache.faq.filter(f =>
      (f.products || "").split(",").includes(scope) || f.category === scope);
  };

  const scopeSel = el("select", { class: "input", style: "width:auto",
                                  onchange: e => { scope = e.target.value; render2(); } },
    el("option", { value: "" }, "Choose a product\u2026"),
    prods.map(p => el("option", { value: p.key },
      p.categoryName + " \u203a " + p.name + " (" + countFor(p.key) + ")")),
    orphanScopes.map(k => el("option", { value: k },
      k + " \u2014 not in the catalogue (" + countFor(k) + ")")),
    hasUnscoped ? el("option", { value: NO_SCOPE },
      "Not tagged to a product (" + countFor(NO_SCOPE) + ")") : null);

  let expandedId = null;      // one row open for editing at a time
  const dirty = new Map();    // id -> {question, answer} not yet saved

  const listBox = el("div", {});
  function render2() {
    scopeSel.value = scope;
    listBox.innerHTML = "";

    // Nothing is listed until a product is chosen. The full list ran to
    // hundreds of rows across every product at once, which is not a thing
    // anyone reads -- and the wording is edited product by product anyway.
    if (!scope) {
      listBox.append(el("div", { class: "empty" },
        el("b", {}, "Choose a product to see its answers"),
        cache.faq.length
          ? cache.faq.length + " reviewed answers in total, across " +
            (usedScopes.filter(Boolean).length || 1) + " product tag" +
            (usedScopes.filter(Boolean).length === 1 ? "" : "s") + "."
          : "No answers yet. Draft some from a document above, or write one by hand."));
      return;
    }

    const items = shown();
    if (!items.length) {
      listBox.append(el("div", { class: "empty" },
        el("b", {}, "No answers for " + scopeLabel(scope)),
        "Draft some from a document above, or write one by hand."));
      return;
    }

    listBox.append(el("div", { style: "display:flex;align-items:center;gap:10px;margin:4px 0 6px" },
      el("b", { style: "font-size:13.5px" }, scopeLabel(scope)),
      el("span", { class: "tag tag-neutral" }, String(items.length)),
      el("button", { class: "btn btn-ghost", style: "font-size:11.5px;margin-left:auto", onclick: () => {
        appliesSel.value = scope === NO_SCOPE ? "" : scope; nq.value = ""; na.value = "";
        na.closest(".card").scrollIntoView({ behavior: "smooth", block: "center" });
        setTimeout(() => nq.focus(), 300);
      } }, "+ Add answer")));

    items.forEach(f => {
      const open = expandedId === f.id;
      const row = el("div", { class: "item", style: open ? "display:block" : "cursor:pointer" });

      if (!open) {
        row.addEventListener("click", () => { expandedId = f.id; render2(); });
        row.append(
          el("div", { class: "grow" }, el("b", {}, f.question),
            el("span", {}, (f.answer || "").slice(0, 90) + ((f.answer || "").length > 90 ? "\u2026" : ""))),
          dirty.has(f.id) ? el("span", { class: "tag tag-neutral mono" }, "unsaved") : null);
      } else {
        const draft = dirty.get(f.id) || {};
        const q = el("input", { class: "input", type: "text", value: draft.question ?? f.question });
        const a = el("textarea", { class: "input" }, draft.answer ?? (f.answer || ""));
        const markDirty = () => dirty.set(f.id, { question: q.value, answer: a.value });
        q.addEventListener("input", markDirty);
        a.addEventListener("input", markDirty);
        row.append(
          el("div", { class: "row", style: "margin-bottom:8px" },
            el("div", { style: "flex:3" }, el("label", { class: "flabel" }, "Question"), q)),
          el("label", { class: "flabel" }, "Answer"), a,
          el("p", { class: "sec-hint", style: "margin:7px 0 0" },
            "Write it so it reads correctly on its own \u2014 it may be shown to someone whose wording was slightly different."),
          el("div", { style: "margin-top:9px;display:flex;gap:8px" },
            el("button", { class: "btn btn-secondary", style: "font-size:12.5px;padding:5px 11px", onclick: async () => {
              try { await api("/faq/" + f.id, { method: "PATCH",
                      body: JSON.stringify({ question: q.value, answer: a.value }) });
                    dirty.delete(f.id); toast("Saved"); await refresh(); render(); }
              catch (e) { toast(e.message, true); }
            } }, "Save"),
            el("button", { class: "btn btn-ghost", style: "font-size:12.5px;padding:5px 11px", onclick: () => {
              expandedId = null; render2();
            } }, "Close"),
            el("button", { class: "btn btn-ghost", style: "font-size:12.5px;padding:5px 11px;margin-left:auto", onclick: async () => {
              if (!confirm("Delete this answer?")) return;
              try { await api("/faq/" + f.id, { method: "DELETE" }); dirty.delete(f.id); toast("Deleted");
                    await refresh(); render(); } catch (e) { toast(e.message, true); }
            } }, "Delete")));
      }
      listBox.append(row);
    });
  }
  render2();

  // Generating FAQs from a document, server-side.
  //
  // This was two buttons, "Draft answers" and "Draft all", which differed only
  // in WHICH documents they covered -- and that is a property of the picker,
  // not a separate action. One button now, with the scope chosen above it.
  const ALL_DOCS = "__all__";
  const undraftedDocs = () => cache.sources.filter(s => {
    const key = s.product || s.products || "";
    return !cache.faq.some(f => scopeOf(f) === key && f.source === s.source);
  });

  const srcSel = el("select", { class: "input" },
    el("option", { value: "" }, "Choose a document\u2026"),
    el("option", { value: ALL_DOCS }, "Every document with no FAQs yet"),
    cache.sources.map(s => el("option", { value: s.source }, s.source)));
  const provSel = providerBox();
  const modelIn = linkModelBox(provSel,
    el("input", { class: "input", type: "text", placeholder: "model (optional)" }));

  const genOne = s => api("/admin/faq/autogenerate", { method: "POST",
    body: JSON.stringify({ source: s.source, product: s.product || s.products || "",
      category: s.category || "",
      provider: provSel.value || null, model: modelIn.value.trim() || null }) });

  const genBtn = el("button", { class: "btn btn-primary", style: BTN, onclick: async () => {
    const pick = srcSel.value;
    if (!pick) return toast("Choose a document first", true);

    const docs = pick === ALL_DOCS ? undraftedDocs()
                                   : cache.sources.filter(s => s.source === pick);
    if (!docs.length) {
      return toast(pick === ALL_DOCS ? "Every document already has FAQs"
                                     : "That document is no longer listed", true);
    }
    if (docs.length > 1 && !confirm("Generate FAQs from " + docs.length +
        " documents? This calls the model once per document.")) return;

    genBtn.disabled = true;
    let done = 0, added = 0, dupes = 0;
    try {
      for (const s of docs) {
        genBtn.textContent = docs.length > 1
          ? "Generating " + (++done) + "/" + docs.length + "\u2026" : "Generating\u2026";
        try {
          const r = await genOne(s);
          added += r.added || 0; dupes += r.skipped_duplicates || 0;
        } catch (e) { toast(s.source + ": " + e.message, true); }
      }
      toast("Added " + added + " new FAQ" + (added === 1 ? "" : "s") +
            (dupes ? ", skipped " + dupes + " already there" : ""));
      await refresh(); render();
    } finally { genBtn.disabled = false; genBtn.textContent = "Generate FAQs"; }
  } }, "Generate FAQs");

  // #7: PATCH every row edited but not yet saved.
  const saveAllBtn = el("button", { class: "btn btn-secondary", style: BTN, onclick: async () => {
    if (!dirty.size) return toast("Nothing unsaved");
    const n = dirty.size;
    for (const [id, d] of [...dirty]) {
      try { await api("/faq/" + id, { method: "PATCH", body: JSON.stringify(d) }); dirty.delete(id); }
      catch (e) { toast(id + ": " + e.message, true); }
    }
    toast("Saved " + n + " answer(s)");
    await refresh(); render();
  } }, "Save all");

  // add by hand
  const nq = el("input", { class: "input", type: "text", placeholder: "Does it need an internet connection?" });
  const na = el("textarea", { class: "input", placeholder: "No. Everything is processed on the device; no connection is required." });
  // Its own picker rather than a clone of scopeSel: an empty value means "all
  // products" when writing an answer, but "nothing chosen yet" when filtering.

/* ---------------- unanswered (gaps) ---------------- */
function viewGaps() {
  const prods = products();
  const nameFor = key => {
    const p = prods.find(x => x.key === key);
    if (p) return p.categoryName + " \u203a " + p.name;
    const c = cache.catalog.find(x => x.key === key);
    return c ? c.name : null;
  };

  const selected = new Set();
  const provSel = providerBox({ style: "width:auto" });
  const modelIn = linkModelBox(provSel,
    el("input", { class: "input", style: "width:auto", type: "text", placeholder: "model (optional)" }));

  const answerHere = (g, answer) => {
    // Prefill the Answers page's hand-written form with this question (and
    // an AI draft, if there is one) and jump there, rather than opening a
    // second editor here. One place to write an answer means one set of
    // wording rules to learn, and saving it resolves this gap automatically.
    pendingAnswer = { question: g.question, product: g.scope || "", answer: answer || "" };
    view = "faq"; render();
  };

  const bulkAction = async (path, method, verb) => {
    if (!selected.size) return toast("Select at least one question first", true);
    try {
      await api(path, { method, body: JSON.stringify({ ids: [...selected] }) });
      toast(verb + " " + selected.size + " question(s)");
      selected.clear(); await refresh(); render();
    } catch (e) { toast(e.message, true); }
  };

  // Group by scope so the list reads as "which product is underserved",
  // which is the decision this page exists to support. Questions asked
  // with no product selected are their own group rather than being
  // hidden or forced under an arbitrary product.
  const groups = new Map();
  cache.gaps.forEach(g => {
    const key = g.scope || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(g);
  });
  const ordered = [...groups.entries()].sort((a, b) =>
    b[1].reduce((n, g) => n + (g.times_asked || 1), 0) -
    a[1].reduce((n, g) => n + (g.times_asked || 1), 0));

  const rows = ordered.map(([key, list]) => {
    const label = key ? (nameFor(key) || key) : "No product selected";
    const asks = list.reduce((n, g) => n + (g.times_asked || 1), 0);
    return el("div", { class: "card elev-sm", style: "padding:14px 20px 8px;gap:0;margin-bottom:12px" +
                        (key ? "" : ";box-shadow:var(--shadow-sm),inset 0 0 0 1px color-mix(in srgb,var(--color-accent) 30%,transparent)") },
      el("div", { style: "display:flex;align-items:baseline;gap:10px;padding-bottom:4px" },
        el("span", { class: "sec-title", style: "flex:1;margin:0" }, label),
        el("span", { style: "font-size:12px;color:color-mix(in srgb,var(--color-text) 45%,transparent)" },
          list.length + (list.length === 1 ? " question" : " questions") + " \u00b7 " + asks + " asks")),
      list.map(g => {
        const draftBox = el("div", {});
        const cb = el("input", { type: "checkbox", style: "margin-top:3px", onchange: e => {
          if (e.target.checked) selected.add(g.id); else selected.delete(g.id);
        } });
        const row = el("div", { class: "step" },
          cb,
          el("span", { style: "font-size:15px;font-variant-numeric:tabular-nums;color:var(--color-accent-400);flex:0 0 42px" },
            (g.times_asked || 1) + "\u00d7"),
          el("div", { class: "step-b" },
            el("div", { style: "font-size:13.5px" }, g.question),
            el("p", {}, (g.reason === "ungrounded_answer_suppressed"
                ? "The documents nearly cover this \u2014 an answer was found but could not be verified."
                : "Nothing in the documents matched.")
              + (g.ts ? " Last asked " + shortDate(new Date(g.ts * 1000).toISOString()) + "." : "")),
            draftBox),
          el("button", { class: "btn btn-secondary", style: "font-size:12.5px;padding:4px 12px", onclick: async e => {
            const btn = e.target; btn.disabled = true; btn.textContent = "Drafting\u2026";
            try {
              const r = await api("/admin/faq/answer_gap", { method: "POST", body: JSON.stringify({
                gap_id: g.id, provider: provSel.value || null, model: modelIn.value.trim() || null }) });
              draftBox.innerHTML = "";
              draftBox.append(
                el("p", { class: "sec-hint", style: "margin:8px 0 4px" }, "AI draft \u2014 not saved yet:"),
                el("p", { style: "font-size:13px;white-space:pre-wrap" }, r.answer || "(no answer)"),
                el("div", { style: "display:flex;gap:8px" },
                  el("button", { class: "btn btn-primary", style: "font-size:12px;padding:3px 10px",
                    onclick: () => answerHere(g, r.answer) }, "Use this \u2014 review & save"),
                  el("button", { class: "btn btn-ghost", style: "font-size:12px;padding:3px 10px",
                    onclick: () => { draftBox.innerHTML = ""; } }, "Discard")));
            } catch (e2) { toast(e2.message, true); }
            finally { btn.disabled = false; btn.textContent = "Answer with AI"; }
          } }, "Answer with AI"),
          el("button", { class: "btn btn-primary", style: "font-size:12.5px;padding:4px 12px",
                         onclick: () => answerHere(g) }, "Answer this"),
          el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
            if (!confirm("Dismiss this question?\n\nAsking it again starts a fresh entry. Use \"Mark spam\" instead if it should never come back.")) return;
            try { await api("/faq/gaps/" + encodeURIComponent(g.id), { method: "DELETE" });
                  toast("Dismissed"); await refresh(); render(); }
            catch (e) { toast(e.message, true); }
          } }, "Dismiss"));
        return row;
      }));
  });

  return [
    el("h1", {}, "FAQs from customers"),
    el("p", { class: "lede" }, "Questions real visitors asked that the reviewed answers did not cover, most asked first. Working down this list is the single most useful piece of upkeep."),
    cache.gaps.length ? el("div", { class: "card elev-sm", style: "padding:12px 20px;gap:0;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap" },
      el("span", { class: "sec-hint", style: "margin:0" }, "Select questions above, then:"),
      el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: () => bulkAction("/faq/gaps", "DELETE", "Dismissed") }, "Dismiss selected"),
      el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: () => bulkAction("/faq/gaps/spam", "POST", "Marked spam:") }, "Mark spam"),
      el("span", { style: "flex:1" }),
      el("label", { class: "flabel", style: "margin:0" }, "AI model:"), provSel, modelIn) : null,
    cache.gaps.length ? el("div", { "data-tour": "gaps-list" }, rows)
      : el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
          el("b", {}, "Nothing unanswered"),
          "Questions the widget could not answer will collect here once visitors start using it.")),
  ];
}

function shortDate(iso) {
  try {
    const d = new Date(iso), now = new Date();
    const days = Math.floor((now - d) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 30) return days + " days ago";
    return d.toLocaleDateString();
  } catch (e) { return ""; }
}

            try { await api("/admin/widget/config/reset", { method: "POST" });
                  toast("Reset to defaults"); await refresh(); render(); }
            catch (e) { toast(e.message, true); }
          } }, "Reset to defaults"))),
      el("div", { style: "position:sticky;top:0", "data-tour": "wd-preview" }, preview)),
  ];
}

            el("div", { style: "margin-top:8px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;color:color-mix(in srgb,var(--color-text) 70%,transparent)" },
              l.transcript.map(t => (t.role === "user" || t.q ? "Visitor: " : "Assistant: ") +
                                    (t.text || t.q || t.a || "")).join("\n")))

      el("div", { style: "margin-top:12px;display:flex;gap:8px" },
        el("button", { class: "btn btn-secondary", style: "font-size:12.5px;padding:5px 11px", onclick: async () => {
          try { await api("/admin/leads/" + l.id + "/handled?handled=" + (!l.handled),
                          { method: "POST" });
                await refresh(); render(); } catch (e) { toast(e.message, true); }
        } }, l.handled ? "Mark unhandled" : "Mark handled"),
        el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
          if (!confirm("Delete this enquiry? It cannot be recovered.")) return;

        } }, "Delete")));
  }) : [el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
        el("b", {}, "Coming soon"),
        "The embeddable widget doesn't have a sales/support form yet \u2014 " +

  const s = cache.leadStats || {};
  return [
    el("h1", {}, "Enquiries"),
    el("p", { class: "lede" }, "Sales and support forms submitted through the widget. These are not emailed to anyone \u2014 this console is where they arrive, so check it regularly."),
    el("div", { class: "readout" },
      el("div", { class: s.unhandled ? "warn" : "" },
        el("div", { class: "lbl" }, "Needs a reply"), el("b", {}, String(s.unhandled || 0))),
      el("div", {}, el("div", { class: "lbl" }, "Sales"), el("b", {}, String(s.sales || 0))),
      el("div", {}, el("div", { class: "lbl" }, "Support"), el("b", {}, String(s.support || 0))),
      el("div", {}, el("div", { class: "lbl" }, "Total"), el("b", {}, String(s.total || 0)))),
    el("div", { "data-tour": "leads-list" }, rows),
  ];
}

/* ---------------- catalog ---------------- */
function viewCatalog() {
  const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  const cName = el("input", { class: "input", type: "text", placeholder: "Coin hoppers" });
  const pCat = el("select", { class: "input" }, cache.catalog.map(c => el("option", { value: c.key }, c.name)));
  const pName = el("input", { class: "input", type: "text", placeholder: "SMART Hopper" });

  const rows = cache.catalog.length ? cache.catalog.map(c =>
    el("div", { class: "card elev-sm", style: "margin-bottom:12px;padding:16px 20px 8px;gap:0" },
      el("div", { style: "display:flex;align-items:center;gap:10px" },
        el("div", { class: "sec-title", style: "flex:1;margin:0" }, c.name),
        el("span", { class: "tag tag-neutral mono" }, c.key),
        el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
          if (!confirm("Delete the " + c.name + " range and its products?")) return;
          try { await api("/admin/category/" + encodeURIComponent(c.key), { method: "DELETE" });
                toast("Deleted"); await refresh(); render(); } catch (e) { toast(e.message, true); }
        } }, "Delete")),
      (c.products || []).length
        ? (c.products || []).map(p => el("div", { class: "item" },
            el("div", { class: "grow" }, el("b", {}, p.name),
              el("span", {}, (p.doc_count || (p.sources || []).length || 0) + " documents")),
            el("span", { class: "tag tag-neutral mono" }, p.key),
            el("button", { class: "btn btn-ghost", style: "font-size:12.5px", onclick: async () => {
              if (!confirm("Delete " + p.name + "?")) return;
              try { await api("/admin/product/" + encodeURIComponent(c.key) + "/" + encodeURIComponent(p.key),
                              { method: "DELETE" });
                    toast("Deleted"); await refresh(); render(); } catch (e) { toast(e.message, true); }
            } }, "Delete")))
        : el("p", { class: "sec-hint", style: "margin:10px 0 10px" }, "No products in this range yet.")))
    : [el("div", { class: "card elev-sm" }, el("div", { class: "empty" },
        el("b", {}, "No ranges yet"),
        "A range groups related products \u2014 Coin hoppers, Note validators, Biometrics."))];

  return [
    el("h1", {}, "Products"),
    el("p", { class: "lede" }, "Ranges group products; documents are filed against a product. This is what the widget asks visitors to choose from."),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                "data-tour": "cat-range", "data-sec": "Add a range" },
      el("div", { class: "sec-title" }, "Add a range"),
      el("div", { class: "sec-hint" }, "A family of products, such as Coin hoppers."),
      el("div", { class: "row" },
        el("div", {}, el("label", { class: "flabel" }, "Name"), cName),
        el("div", { style: "flex:0 0 auto" },
          el("button", { class: "btn btn-secondary", onclick: async () => {
            if (!cName.value.trim()) return toast("Give the range a name", true);
            try { await api("/admin/category", { method: "POST",
                    body: JSON.stringify({ key: slug(cName.value), name: cName.value.trim() }) });
                  cName.value = ""; toast("Range added"); await refresh(); render(); }
            catch (e) { toast(e.message, true); }
          } }, "Add range")))),
    cache.catalog.length ? el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0;margin-bottom:16px",
                                      "data-tour": "cat-product", "data-sec": "Add a product" },
      el("div", { class: "sec-title" }, "Add a product"),
      el("div", { class: "sec-hint" }, "Documents and widget conversations are scoped to a product."),
      el("div", { class: "row" },
        el("div", {}, el("label", { class: "flabel" }, "Range"), pCat),
        el("div", {}, el("label", { class: "flabel" }, "Name"), pName),
        el("div", { style: "flex:0 0 auto" },
          el("button", { class: "btn btn-primary", onclick: async () => {
            if (!pName.value.trim()) return toast("Give the product a name", true);
            try { await api("/admin/product", { method: "POST", body: JSON.stringify({
                    category_key: pCat.value, key: slug(pName.value), name: pName.value.trim(), sources: [] }) });
                  pName.value = ""; toast("Product added"); await refresh(); render(); }

/* ---------------- test ---------------- */
function viewTest() {
  const prods = products();
  const sel = el("select", { class: "input" }, el("option", { value: "" }, "Whole knowledge base"),
    prods.map(p => el("option", { value: p.key }, p.categoryName + " \u203a " + p.name)));
  const provSel = providerBox();
  const modelIn = linkModelBox(provSel,
    el("input", { class: "input", type: "text", placeholder: "model (optional)" }));
  const log = el("div", { class: "chat" },
    el("div", { class: "bub a" }, "Ask something a customer might ask. This uses the same pipeline as the widget, so what you see here is what they would get."));
  const input = el("input", { class: "input", type: "text", placeholder: "Does it need an internet connection?" });
  const sid = "console-" + Math.random().toString(36).slice(2);

  // /query only honors force_provider when force_model is ALSO set, so fall
  // back to the provider's current default rather than silently dropping to
  // the default chain. That default now comes from the server (see
  // providerBox) -- it was a hardcoded map here, holding a DeepSeek alias
  // that had been retired, so every forced DeepSeek call failed.
  async function send(q, opts = {}) {
    q = (q === undefined ? input.value : q).trim();
    if (!q) return;
    if (q === input.value.trim()) input.value = "";

    // Choosing or rejecting a suggestion re-asks a question the assistant
    // itself put on screen, so it is not a new turn from the visitor.
    if (!opts.silent) log.append(el("div", { class: "bub u" }, q));
    const wait = el("div", { class: "bub a" }, "Checking the documentation\u2026");
    log.append(wait); log.scrollTop = log.scrollHeight;

    const provider = provSel.value || null;
    const model = provider ? (modelIn.value.trim() || defaultModelFor(provider) || null) : null;
    try {
      const r = await api("/query", { method: "POST", body: JSON.stringify({
        q, session_id: sid, product: sel.value || null,
        force_provider: provider, force_model: model,
        faq_id: opts.faqId || null, skip_faq: !!opts.skipFaq }) });
      wait.remove();
      const bub = el("div", { class: "bub a" });
      bub.append(renderMarkdown(r.answer || "No answer"));
      if (r.sources && r.sources.length) {
        bub.append(el("div", { class: "lbl", style: "margin-top:9px" }, "Sources"));
        // The document is a link, and the pages are named, so the reader can
        // go and check. download_url and page_label already come from the
        // server -- they were being flattened into plain text here.
        r.sources.forEach(s => {
          const row = el("div", { style: "font-size:12px;margin-top:3px" });
          row.append(s.download_url
            ? el("a", { href: s.download_url, target: "_blank", rel: "noopener" }, s.source)
            : el("span", {}, s.source));
          if (s.page_label) {
            row.append(el("span", { style: "color:color-mix(in srgb, var(--color-text) 55%, transparent)" },
              "  \u2014 see " + s.page_label));
          }
          bub.append(row);
        });
      }

      // The conversation window holds a fixed number of turns, after which the
      // oldest is dropped silently -- the assistant appears to forget with
      // nothing on screen to explain it. Warn as the window fills, and once at
      // it, so a fresh chat is an obvious choice rather than a discovery.
      const _turns = r.turns || 0, _limit = r.turn_limit || 20;
      if (_turns >= _limit - 3 && !log.dataset.warnedAt) {
        log.dataset.warnedAt = String(_turns);
        const note = el("div", { class: "bub a", style: "font-size:12.5px" });
        note.append(el("div", {}, r.context_full
          ? "This chat has reached its " + _limit + "-question memory. The oldest "
            + "questions are now being dropped, so earlier answers can no longer "
            + "be referred back to."
          : "Approaching this chat's " + _limit + "-question memory ("
            + _turns + " of " + _limit + "). After that, the earliest questions "
            + "start dropping out."));
        note.append(el("div", { style: "margin-top:8px" },
          el("button", { class: "btn btn-secondary", style: BTN, onclick: () => {
            view = "test"; render();
          } }, "Start a new chat")));
        log.append(note);
      }
      // A refusal with no next step is a dead end. Offer the human.
      if (r.offer_support) {
        bub.append(el("div", { style: "margin-top:10px" },
          el("button", { class: "btn btn-secondary", style: BTN, onclick: () => {
            view = "leads"; render();
          } }, "Contact support about this")));
      }

      // Unscoped question spanning several products: let them pick, then
      // re-ask scoped rather than retyping.
      (r.product_options || []).forEach(o => {
        bub.append(el("div", { style: "margin-top:6px" },
          el("button", { class: "btn btn-secondary", style: BTN, onclick: () => {
            sel.value = o.key; send(q, { silent: true });
          } }, o.label)));
      });
      if (r.from_faq) bub.append(el("div", { class: "tag tag-outline", style: "margin-top:8px" }, "reviewed answer"));
      log.append(bub);

      // The widget shows these; this page did not, so a clarify turn arrived
      // as a bare "is this what you meant?" with nothing to answer it -- the
      // one place the test chat did NOT match what a customer sees.
      const cands = r.faq_candidates || [];
      if (cands.length) {
        const box = el("div", { class: "bub a", style: "display:flex;flex-direction:column;gap:6px;align-items:flex-start" });
        cands.forEach(c => box.append(el("button", {
          class: "btn btn-secondary", style: "font-size:12.5px;padding:6px 11px;text-align:left;white-space:normal",
          onclick: () => { box.remove(); send(c.question, { faqId: c.id, silent: true }); },
        }, c.question)));
        box.append(el("button", {
          class: "btn btn-ghost", style: "font-size:12px;padding:4px 9px",
          onclick: () => { box.remove(); send(q, { skipFaq: true, silent: true }); },
        }, "None of these \u2014 answer from the documents"));
        log.append(box);
      }
    } catch (e) { wait.textContent = "Failed: " + e.message; }
    log.scrollTop = log.scrollHeight;
  }
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  return [
    el("h1", {}, "Test chat"),
    el("p", { class: "lede" }, "Check what the widget would say before customers do. Nothing here is shown to visitors."),
    el("div", { class: "card elev-sm", style: "padding:18px 20px;gap:0", "data-tour": "test-chat" },
      el("div", { class: "row", style: "margin-bottom:12px" },
        el("div", {}, el("label", { class: "flabel" }, "Ask about"), sel),
        el("div", {}, el("label", { class: "flabel" }, "Provider"), provSel),
        el("div", {}, el("label", { class: "flabel" }, "Model"), modelIn)),
      log,
      el("div", { class: "row", style: "margin-top:12px" },
        el("div", { style: "flex:1" }, input),
        el("div", { style: "flex:0 0 auto" }, el("button", { class: "btn btn-primary", onclick: () => send() }, "Ask")))),
  ];
}

/* ---------------- walkthrough ---------------- */
/* Replaces the old modal guide. Rather than describing the console in prose,
   this points at one real element at a time, on the page you are already on.
   Steps are per view: the tour is a tour of *this* page, and render() ends it
   on navigation (endTour() at the top) instead of trying to drive the user
   across pages mid-step.

   A step targets [data-tour="<ref>"]. Steps whose target is absent get dropped
   when the tour starts, so an empty-state page that renders fewer cards gets a
   correctly-numbered shorter tour rather than a step pointing at nothing. */
const tourStepsByView = {
  overview: [
    { ref: "ov-readout", title: "Where things stand",
      text: "The four numbers that matter, read live. \u201cNeed filing\u201d and \u201cUnanswered\u201d turn amber when they want attention." },
    { ref: "ov-next", title: "What to do next",
      text: "Reads that same state and names the next useful thing, with a button straight to it. If you read one part of this console, read this one." },
  ],
  documents: [
    { ref: "doc-add", title: "Add documents",
      text: "Pick the product the document describes, then drop the file in. That link is what lets the widget find it \u2014 an unfiled document is searchable but never offered to a visitor." },
    { ref: "doc-list", title: "Everything you have added",
      text: "Grouped by product, the same way the widget sees them. Anything with no product is called out separately." },
  ],
  faq: [
    { ref: "ans-draft", title: "Generate FAQs from a document",
      text: "Reads a document and writes FAQs from it. Pick one document, or every document that has none yet. Nothing goes live until you have read it, and running it again never overwrites an answer you edited by hand." },
    { ref: "ans-hand", title: "Write one yourself",
      text: "For anything the documents do not cover. Hand-written answers are protected \u2014 drafting will never replace them." },
    { ref: "ans-list", title: "Read and fix the wording",
      text: "Pick a product to see its answers. Edit each one so it reads correctly on its own \u2014 someone may be shown it after asking a slightly different question." },
  ],
  gaps: [
    { ref: "gaps-list", title: "What people asked and did not get",
      text: "Real visitor questions the reviewed answers missed, grouped by product, most asked first. Working down this list is the most useful upkeep there is, and answering one here removes it automatically." },
  ],
  catalog: [
    { ref: "cat-range", title: "Start with a range",
      text: "A range is a family of products \u2014 Coin hoppers, Note validators. It is the first thing a visitor picks in the widget." },
    { ref: "cat-product", title: "Then add products",
      text: "Every product added here becomes something the widget can be asked about, and something a document can be filed against." },
    { ref: "cat-list", title: "Your catalogue",
      text: "Each range with its products, and how many documents back each one. A product with no documents cannot be answered about." },
  ],
  widget: [
    { ref: "wd-preview", title: "Live preview",
      text: "Exactly what a visitor sees. Every change on this page updates it as you type." },
    { ref: "wd-branding", title: "Branding",
      text: "Name the assistant, write its greeting, and pick the accent colour used through the widget." },
    { ref: "wd-options", title: "Opening options",
      text: "The buttons a visitor is offered first. If you offer \u201cTalk to sales\u201d or \u201cTalk to support\u201d, set up what that form asks for." },
  ],
  leads: [
    { ref: "leads-list", title: "Enquiries arrive here and nowhere else",
      text: "The sales and support forms visitors submit. Nothing is emailed out, so this console is the only place they land \u2014 worth building a habit of checking." },
  ],
  test: [
    { ref: "test-chat", title: "Ask it what a customer would ask",
      text: "Runs the same pipeline the real widget runs. If an answer looks wrong here, it is wrong there too." },
  ],
};

let tourOn = false, tourStep = 0, tourSteps = [];
let tourPop = null, tourHi = null, tourKeys = null, tourReflow = null;

const tourTarget = ref => document.querySelector('[data-tour="' + ref + '"]');

function startTour() {
  const live = (tourStepsByView[view] || []).filter(s => tourTarget(s.ref));
  if (!live.length) return toast("No walkthrough for this page yet");
  endTour();
  tourSteps = live; tourOn = true; tourStep = 0;

  tourKeys = e => {
    if (!tourOn) return;
    if (e.key === "Escape") endTour();
    else if (e.key === "ArrowRight") tourGo(1);
    else if (e.key === "ArrowLeft") tourGo(-1);
  };
  document.addEventListener("keydown", tourKeys);

  // .main is the scroll container, not the window, so the popover has to
  // follow its scroll to stay beside the element it points at.
  tourReflow = () => { if (tourOn) placeTour(); };
  window.addEventListener("resize", tourReflow);
  const main = document.querySelector(".main");
  if (main) main.addEventListener("scroll", tourReflow);

  drawTour();
}

function endTour() {
  tourOn = false; tourStep = 0; tourSteps = [];
  if (tourPop) { tourPop.remove(); tourPop = null; }
  if (tourHi) { tourHi.classList.remove("tour-hi"); tourHi = null; }
  if (tourKeys) { document.removeEventListener("keydown", tourKeys); tourKeys = null; }
  if (tourReflow) {
    window.removeEventListener("resize", tourReflow);
    const main = document.querySelector(".main");
    if (main) main.removeEventListener("scroll", tourReflow);
    tourReflow = null;
  }
}

function tourGo(delta) {
  if (!tourOn) return;
  const n = tourStep + delta;
  if (n < 0) return;
  if (n >= tourSteps.length) return endTour();
  tourStep = n; drawTour();
}

function drawTour() {
  const s = tourSteps[tourStep];
  if (!s) return endTour();

  if (tourHi) tourHi.classList.remove("tour-hi");
  tourHi = tourTarget(s.ref);
  if (!tourHi) return endTour();
  tourHi.classList.add("tour-hi");
  tourHi.scrollIntoView({ behavior: "smooth", block: "center" });

  const last = tourStep === tourSteps.length - 1;
  if (tourPop) tourPop.remove();
  tourPop = el("div", { class: "tour-pop", role: "dialog", "aria-label": "Walkthrough" },
    el("div", { class: "step mono" }, "Step " + (tourStep + 1) + " of " + tourSteps.length),
    el("div", { class: "tt" }, s.title),
    el("div", { class: "tx" }, s.text),
    el("div", { class: "acts" },
      el("button", { class: "btn btn-ghost", onclick: endTour }, "Skip"),
      el("div", { style: "display:flex;gap:8px" },
        el("button", { class: "btn btn-secondary", disabled: tourStep === 0 ? "true" : null,
                       onclick: () => tourGo(-1) }, "Back"),
        el("button", { class: "btn btn-primary", onclick: () => tourGo(1) }, last ? "Done" : "Next"))));
  document.body.append(tourPop);
  placeTour();
}

// Beside the highlighted element, per the design, flipped to its other side
// when there is no room -- so the popover never lands on top of the thing it
// is describing.
function placeTour() {
  if (!tourPop || !tourHi) return;
  const r = tourHi.getBoundingClientRect();
  const w = tourPop.offsetWidth || 300, h = tourPop.offsetHeight || 190;
  const gap = 16, pad = 12;

  let left = r.right + gap;
  if (left + w + pad > window.innerWidth) {
    left = r.left - gap - w;
    if (left < pad) left = Math.max(pad, window.innerWidth - w - pad);
  }
  const top = Math.max(pad, Math.min(r.top, window.innerHeight - h - pad));

  tourPop.style.left = Math.round(left) + "px";
  tourPop.style.top = Math.round(top) + "px";
}


/* ---------------- boot ---------------- */
(async () => {
  if (pw) { try { await api("/admin/login", { method: "POST" }); await refresh(); }
            catch (e) { pw = ""; } }
  render();
})();
